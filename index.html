<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Animation Runner</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --header-bg: #1a1a1a;
            --accent: #00ff88;
            --text: #efefef;
            --border: #333;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Cascadia Code', 'Consolas', monospace;
            background-color: var(--bg-color);
            color: var(--text);
            overflow: hidden;
        }

        .layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: var(--header-bg);
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
        }

        .btn-run {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-run:hover { opacity: 0.9; transform: scale(1.02); }

        .main {
            display: flex;
            flex: 1;
        }

        .editor-pane, .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .label {
            font-size: 10px;
            color: #666;
            padding: 5px 15px;
            background: #151515;
            border-bottom: 1px solid var(--border);
        }

        textarea {
            flex: 1;
            background: transparent;
            color: #aaa;
            border: none;
            padding: 15px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            border-right: 1px solid var(--border);
        }

        #preview-container {
            flex: 1;
            background: #fff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="layout">
    <header>
        <div style="color: var(--accent); font-weight: bold;">ANIMATION_RUNNER v2</div>
        <button class="btn-run" onclick="forceRun()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            EJECUTAR (LIMPIO)
        </button>
    </header>

    <div class="main">
        <div class="editor-pane">
            <div class="label">CÓDIGO FUENTE</div>
            <textarea id="editor" spellcheck="false"></textarea>
        </div>
        <div class="preview-pane">
            <div class="label">RESULTADO (RENDER)</div>
            <div id="preview-container">
                <div id="loader" class="loader">Cargando escena...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const container = document.getElementById('preview-container');
    const loader = document.getElementById('loader');

    // Ejemplo de Three.js corregido para este editor
    const threeExample = `<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshNormalMaterial();
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    <\/script>
</body>
</html>`;

    function forceRun() {
        loader.style.display = 'block';
        
        // ELIMINAR EL IFRAME ANTERIOR (Esto limpia la memoria de la GPU y JS)
        const oldIframe = container.querySelector('iframe');
        if (oldIframe) oldIframe.remove();

        // CREAR UN NUEVO IFRAME DESDE CERO
        const newIframe = document.createElement('iframe');
        container.appendChild(newIframe);

        const content = editor.value;
        const doc = newIframe.contentDocument || newIframe.contentWindow.document;

        // Inyección asíncrona ligera para evitar bloqueos
        setTimeout(() => {
            doc.open();
            doc.write(content);
            doc.close();
            loader.style.display = 'none';
        }, 50);
    }

    // Configuración inicial
    window.onload = () => {
        editor.value = threeExample;
        forceRun();
    };

    // Soporte de tabulación y atajo Ctrl+Enter
    editor.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') forceRun();
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = editor.selectionStart;
            editor.value = editor.value.substring(0, start) + "  " + editor.value.substring(editor.selectionEnd);
            editor.selectionStart = editor.selectionEnd = start + 2;
        }
    });
</script>

</body>
</html>
