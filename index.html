<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master-Mec Pro V9.1 | Cloud + KM + Backup</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #2563eb; --accent: #f59e0b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .logo-font { font-family: 'Orbitron', sans-serif; }
        .bg-pattern { background-image: radial-gradient(#cbd5e1 0.8px, transparent 0.8px); background-size: 24px 24px; }
        .hex-icon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        .card-neo { background: white; border: 1px solid white; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        .btn-main { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .input-mecanic { background-color: #f8fafc; border: 2px solid #e2e8f0; border-radius: 1rem; padding: 0.8rem; font-weight: 600; width: 100%; font-size: 0.8rem; }
        .input-mecanic:focus { border-color: var(--primary); outline: none; background-color: #fff; }
        
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        .sync-active { animation: pulse-green 2s infinite; }
    </style>
</head>
<body class="bg-pattern min-h-screen pb-32 text-slate-800">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, updateDoc, deleteDoc, 
            doc, onSnapshot, query, orderBy, serverTimestamp, setDoc 
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBo2bZYaXmYAGML1YL8X3ru-mDMs4LIwU0",
            authDomain: "servidor-de-mecanic.firebaseapp.com",
            projectId: "servidor-de-mecanic",
            storageBucket: "servidor-de-mecanic.firebasestorage.app",
            messagingSenderId: "482393370095",
            appId: "1:482393370095:web:a036033b962916c8669a1a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "servicios_v9_1");

        let APP_DATA = JSON.parse(localStorage.getItem('MEC_DATA_V9')) || [];
        let CURRENT_FILTER = 'all';

        const toast = (title, icon = 'success') => {
            Swal.fire({ title, icon, toast: true, position: 'top', showConfirmButton: false, timer: 2000 });
        };

        // --- EXPORTAR (BACKUP) ---
        window.exportData = () => {
            const dataStr = JSON.stringify(APP_DATA, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `RESPALDO_MEC_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            toast("Respaldo descargado");
        };

        // --- IMPORTAR (RESTORE) ---
        window.importData = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = async event => {
                    try {
                        const content = JSON.parse(event.target.result);
                        if(Array.isArray(content)) {
                            Swal.fire({ title: 'Restaurando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                            for (const item of content) {
                                const { id, ...data } = item;
                                data.updatedAt = serverTimestamp();
                                id ? await setDoc(doc(db, "servicios_v9_1", id), data) : await addDoc(colRef, data);
                            }
                            Swal.close();
                            toast("Base de datos restaurada");
                        }
                    } catch (err) { toast("Error en archivo", "error"); }
                };
                reader.readAsText(file);
            };
            input.click();
        };

        // --- CORE LOGIC ---
        window.startApp = () => {
            document.getElementById('splash').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            syncCloud();
            lucide.createIcons();
        };

        function syncCloud() {
            const q = query(colRef, orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                APP_DATA = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                localStorage.setItem('MEC_DATA_V9', JSON.stringify(APP_DATA));
                document.getElementById('cloud-status').innerText = "Cloud Online";
                document.getElementById('indicator').className = "w-2 h-2 rounded-full bg-green-500 sync-active";
                updateStats();
                renderCards();
            }, () => {
                document.getElementById('cloud-status').innerText = "Modo Local";
                document.getElementById('indicator').className = "w-2 h-2 rounded-full bg-amber-500";
            });
        }

        window.saveRecord = async (e) => {
            e.preventDefault();
            const id = document.getElementById('f-id').value;
            const btn = e.submitter;
            btn.disabled = true;

            const docData = {
                client: document.getElementById('f-client').value,
                phone: document.getElementById('f-phone').value,
                car: document.getElementById('f-car').value,
                plate: document.getElementById('f-plate').value.toUpperCase(),
                km: document.getElementById('f-km').value,
                work: document.getElementById('f-work').value,
                price: parseFloat(document.getElementById('f-price').value) || 0,
                priority: document.getElementById('f-priority').value,
                updatedAt: serverTimestamp()
            };

            try {
                if(id) {
                    await updateDoc(doc(db, "servicios_v9_1", id), docData);
                } else {
                    docData.status = 'pending';
                    docData.createdAt = serverTimestamp();
                    await addDoc(colRef, docData);
                }
                closeModal();
                toast("Guardado en Nube");
            } catch (err) { toast("Error de red", "error"); }
            btn.disabled = false;
        };

        window.deleteRecord = async (id) => {
            const res = await Swal.fire({ title: '¿Borrar registro?', icon: 'warning', showCancelButton: true });
            if(res.isConfirmed) await deleteDoc(doc(db, "servicios_v9_1", id));
        };

        window.toggleStatus = async (id, current) => {
            const next = current === 'paid' ? 'pending' : 'paid';
            await updateDoc(doc(db, "servicios_v9_1", id), { status: next });
        };

        function updateStats() {
            const money = APP_DATA.filter(i => i.status === 'pending').reduce((a, b) => a + (b.price || 0), 0);
            document.getElementById('stat-money').innerText = `$${money.toLocaleString()}`;
            document.getElementById('stat-count').innerText = APP_DATA.length;
        }

        window.renderCards = () => {
            const container = document.getElementById('cards');
            const search = document.getElementById('search').value.toLowerCase();
            container.innerHTML = '';

            let list = APP_DATA.filter(i => (i.client||'').toLowerCase().includes(search) || (i.plate||'').toLowerCase().includes(search));
            if(CURRENT_FILTER !== 'all') list = list.filter(i => i.status === CURRENT_FILTER);

            list.forEach(i => {
                const card = document.createElement('div');
                card.className = "card-neo rounded-[2rem] p-5 border-l-4 " + (i.priority === 'Urgente' ? 'border-red-500' : 'border-blue-500');
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h4 class="font-black text-slate-800 uppercase leading-none text-sm">${i.client}</h4>
                            <p class="text-[10px] font-bold text-blue-600 mt-1">${i.car} • <span class="font-mono text-slate-900">${i.plate}</span></p>
                            <div class="flex items-center gap-1 mt-1 text-slate-400 text-[9px] font-bold">
                                <i data-lucide="gauge" class="w-3 h-3"></i> ${i.km || 0} KM
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-[7px] font-black text-amber-500 uppercase">Presupuesto Est.</p>
                            <p class="text-lg font-black text-slate-900">$${(i.price||0).toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl mb-4 text-[10px] font-semibold text-slate-500 italic">"${i.work}"</div>
                    <div class="flex gap-2">
                        <button onclick="toggleStatus('${i.id}', '${i.status}')" class="flex-1 py-3 rounded-xl text-[9px] font-black uppercase transition-all ${i.status === 'paid' ? 'bg-green-600 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}">
                            ${i.status === 'paid' ? 'PAGADO' : 'PENDIENTE'}
                        </button>
                        <button onclick="editMode('${i.id}')" class="p-3 bg-blue-50 text-blue-600 rounded-xl"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="deleteRecord('${i.id}')" class="p-3 bg-red-50 text-red-500 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        };

        window.editMode = (id) => {
            const i = APP_DATA.find(x => x.id === id);
            document.getElementById('f-id').value = i.id;
            document.getElementById('f-client').value = i.client;
            document.getElementById('f-phone').value = i.phone;
            document.getElementById('f-car').value = i.car;
            document.getElementById('f-plate').value = i.plate;
            document.getElementById('f-km').value = i.km || '';
            document.getElementById('f-work').value = i.work;
            document.getElementById('f-price').value = i.price;
            document.getElementById('f-priority').value = i.priority;
            openModal();
        };

        window.openModal = () => document.getElementById('modal').classList.replace('hidden', 'flex');
        window.closeModal = () => { document.getElementById('modal').classList.replace('flex', 'hidden'); document.getElementById('main-form').reset(); };
        window.setFilter = (f) => { CURRENT_FILTER = f; renderCards(); };
    </script>

    <div id="splash" class="fixed inset-0 z-[300] bg-slate-900 flex flex-col items-center justify-center p-10">
        <div class="w-20 h-20 bg-blue-600 hex-icon flex items-center justify-center mb-6 shadow-2xl shadow-blue-500/50">
            <i data-lucide="gauge" class="w-10 h-10 text-white"></i>
        </div>
        <h1 class="logo-font text-xl text-white tracking-widest uppercase">Master-Mec Pro</h1>
        <p class="text-[8px] text-blue-400 font-black uppercase mt-2 tracking-[0.4em]">Cloud System V9.1</p>
        <button onclick="startApp()" class="mt-12 w-full max-w-xs bg-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">Ingresar al Taller</button>
    </div>

    <div id="main-content" class="hidden">
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b p-4">
            <div class="max-w-4xl mx-auto space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div id="indicator" class="w-2 h-2 rounded-full bg-slate-300"></div>
                        <h2 id="cloud-status" class="text-[8px] font-black uppercase text-slate-400 tracking-widest">Sincronizando...</h2>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="exportData()" class="p-2.5 bg-slate-100 rounded-xl text-slate-600 active:bg-blue-100"><i data-lucide="download" class="w-4 h-4"></i></button>
                        <button onclick="importData()" class="p-2.5 bg-slate-100 rounded-xl text-slate-600 active:bg-blue-100"><i data-lucide="upload" class="w-4 h-4"></i></button>
                        <button onclick="openModal()" class="btn-main text-white px-5 py-2.5 rounded-xl font-black text-[9px] uppercase tracking-tighter shadow-lg">+ ENTRADA</button>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-900 p-4 rounded-[1.8rem] text-white shadow-xl shadow-slate-200">
                        <p class="text-[7px] font-black text-amber-400 uppercase tracking-widest mb-1">Presupuesto Pendiente</p>
                        <h3 id="stat-money" class="text-xl font-black">$0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-[1.8rem] border border-slate-100 shadow-sm">
                        <p class="text-[7px] font-black text-slate-400 uppercase tracking-widest mb-1">Unidades Totales</p>
                        <h3 id="stat-count" class="text-xl font-black">0</h3>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto p-4 space-y-6">
            <div class="relative">
                <input type="text" id="search" onkeyup="renderCards()" placeholder="Buscar placa o nombre..." class="w-full p-5 pl-14 rounded-2xl border-none shadow-xl shadow-slate-200 outline-none font-bold text-slate-700">
                <i data-lucide="search" class="absolute left-6 top-5 text-slate-300"></i>
            </div>
            <div id="cards" class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-10"></div>
        </main>
    </div>

    <div id="modal" class="fixed inset-0 z-[200] bg-slate-900/90 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] p-8 flex flex-col max-h-[95vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black uppercase text-xs tracking-widest text-blue-600">Registro Técnico</h3>
                <button onclick="closeModal()" class="p-2 bg-slate-100 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="main-form" onsubmit="saveRecord(event)" class="space-y-4">
                <input type="hidden" id="f-id">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="f-client" placeholder="Nombre Cliente" required class="input-mecanic">
                    <input type="tel" id="f-phone" placeholder="Celular" class="input-mecanic">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="f-car" placeholder="Vehículo (Ej: Hilux)" required class="input-mecanic">
                    <input type="text" id="f-plate" placeholder="Placa" required class="input-mecanic text-center font-mono">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-2">Kilometraje Actual</label>
                    <input type="number" id="f-km" placeholder="Ej: 154000" class="input-mecanic">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-2">Trabajo / Diagnóstico</label>
                    <textarea id="f-work" required rows="3" class="input-mecanic"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3 items-center">
                    <select id="f-priority" class="input-mecanic">
                        <option value="Normal">Normal</option>
                        <option value="Urgente">Urgente 🔴</option>
                    </select>
                    <div class="bg-slate-900 p-3.5 rounded-2xl flex justify-between items-center border border-amber-500/30">
                        <span class="text-amber-500 font-black text-[8px] uppercase tracking-tighter">Est. Presupuesto $</span>
                        <input type="number" id="f-price" required class="bg-transparent text-white font-black text-right w-20 outline-none text-sm">
                    </div>
                </div>
                <button type="submit" class="w-full py-5 bg-blue-600 text-white font-black rounded-2xl uppercase text-[10px] tracking-widest shadow-xl shadow-blue-200 mt-4 active:scale-95 transition-all">Confirmar Registro</button>
            </form>
        </div>
    </div>

    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 flex gap-4 bg-white/90 backdrop-blur-xl p-2.5 rounded-[2rem] border shadow-2xl z-[100]">
        <button onclick="setFilter('all')" class="p-4 rounded-full hover:bg-slate-100 transition-colors"><i data-lucide="layout-grid" class="w-5 h-5"></i></button>
        <button onclick="setFilter('pending')" class="p-4 rounded-full hover:bg-slate-100 text-amber-500 transition-colors"><i data-lucide="clock" class="w-5 h-5"></i></button>
        <button onclick="setFilter('paid')" class="p-4 rounded-full hover:bg-slate-100 text-green-500 transition-colors"><i data-lucide="check-circle" class="w-5 h-5"></i></button>
    </div>

</body>
</html>
