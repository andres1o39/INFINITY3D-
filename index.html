<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Geometry Dash Infinite - Rhythm Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; background: linear-gradient(#005, #001); }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; pointer-events: none; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; }
    </style>
</head>
<body>
    <div id="ui">Puntos: 0</div>
    <div id="msg">Haz CLICK para Empezar<br>Salto: Ratón o Espacio</div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const msg = document.getElementById('msg');

// Configuración del Juego
let gameRunning = false;
let score = 0;
const gravity = 0.6;
const jumpForce = -12;
const speed = 7;
const bpm = 125; // Ritmo del juego
const beatInterval = (60 / bpm) * 1000;

// Objetos
const player = {
    x: 100, y: 0, w: 40, h: 40,
    vy: 0, rotation: 0, grounded: false,
    color: '#0ff'
};

let obstacles = [];
let lastBeat = 0;

// --- AUDIO SYSTEM (Sintetizador rítmico) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, type, duration) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    player.y = canvas.height - 140;
    gameRunning = true;
    msg.style.display = 'none';
    score = 0;
    obstacles = [];
    requestAnimationFrame(update);
}

function spawnObstacle() {
    obstacles.push({
        x: canvas.width,
        y: canvas.height - 100,
        w: 40, h: 40,
        type: Math.random() > 0.7 ? 'double' : 'single'
    });
    // Sonido de bombo rítmico
    playTone(60, 'sine', 0.2);
}

function update(time) {
    if (!gameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dibujar Suelo
    ctx.fillStyle = '#555';
    ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

    // Lógica rítmica (Spawn basado en BPM)
    if (time - lastBeat > beatInterval) {
        spawnObstacle();
        lastBeat = time;
    }

    // Jugador: Gravedad y Movimiento
    player.vy += gravity;
    player.y += player.vy;
    
    const floorY = canvas.height - 100 - player.h;
    if (player.y >= floorY) {
        player.y = floorY;
        player.vy = 0;
        player.grounded = true;
        // Alinear rotación al suelo
        player.rotation = Math.round(player.rotation / 90) * 90;
    } else {
        player.grounded = false;
        player.rotation += 5; // Rotar en el aire
    }

    // Dibujar Jugador
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.rotate(player.rotation * Math.PI / 180);
    ctx.fillStyle = player.color;
    ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.strokeRect(-player.w/2, -player.h/2, player.w, player.h);
    ctx.restore();

    // Obstáculos
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let o = obstacles[i];
        o.x -= speed;

        // Dibujar Triángulo (Spike)
        ctx.fillStyle = "#ff4444";
        ctx.beginPath();
        ctx.moveTo(o.x, o.y);
        ctx.lineTo(o.x + o.w, o.y);
        ctx.lineTo(o.x + o.w/2, o.y - o.h);
        ctx.fill();

        // Colisión
        if (player.x < o.x + o.w - 10 && 
            player.x + player.w > o.x + 10 && 
            player.y + player.h > o.y - o.h + 10) {
            gameOver();
        }

        if (o.x < -100) {
            obstacles.splice(i, 1);
            score++;
            ui.innerText = `Puntos: ${score}`;
        }
    }

    requestAnimationFrame(update);
}

function jump() {
    if (!gameRunning) {
        init();
        return;
    }
    if (player.grounded) {
        player.vy = jumpForce;
        playTone(400, 'square', 0.1); // Sonido de salto
    }
}

function gameOver() {
    gameRunning = false;
    msg.innerHTML = `GAME OVER<br>Puntos: ${score}<br>Haz Click para reintentar`;
    msg.style.display = 'block';
    playTone(100, 'sawtooth', 0.5);
}

// Eventos
window.addEventListener('mousedown', jump);
window.addEventListener('keydown', (e) => { if(e.code === 'Space') jump(); });
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
