<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfinityB3D - Engine Preview</title>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #ui-overlay { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .badge { background: #007bff; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        #controls-guide { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; font-size: 13px; border: 1px solid #333; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <span class="badge">🚀 INFINITY B3D CORE</span>
        <h1 style="margin: 10px 0 5px 0;">NeuralFlow v1.0</h1>
        <p style="opacity: 0.7; margin: 0;">Real-time PBR Preview</p>
    </div>

    <div id="controls-guide">
        <strong>Controles de Transformación:</strong><br>
        [ Q ] Ocultar Gizmo | [ W ] Mover | [ E ] Rotar | [ R ] Escalar<br>
        [ Mouse ] Arrastrar ejes para transformar | [ Click Derecho ] Orbitar cámara
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        let camera, scene, renderer, control, orbit;

        init();
        animate();

        function init() {
            // 1. Escena y Cámara
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 5, 15);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(5, 3, 5);

            // 2. Renderizado
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.body.appendChild(renderer.domElement);

            // 3. Luces (Simulando Global Illumination)
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x007bff, 15, 10);
            pointLight.position.set(2, 3, 2);
            scene.add(pointLight);

            // 4. El Objeto (Infinity Core)
            const geometry = new THREE.OctahedronGeometry(1, 0);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x007bff, 
                metalness: 0.9, 
                roughness: 0.1,
                emissive: 0x001133
            });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // Grid de referencia
            const grid = new THREE.GridHelper(20, 20, 0x222222, 0x111111);
            scene.add(grid);

            // 5. Controles de Órbita (Cámara)
            orbit = new OrbitControls(camera, renderer.domElement);
            orbit.update();

            // 6. Transform Controls (El Gizmo)
            control = new TransformControls(camera, renderer.domElement);
            control.addEventListener('dragging-changed', function (event) {
                orbit.enabled = !event.value; // Desactiva órbita al usar el gizmo
            });
            control.attach(mesh);
            scene.add(control);

            // 7. Eventos de Teclado
            window.addEventListener('keydown', function (event) {
                switch (event.key.toLowerCase()) {
                    case 'q': control.visible = !control.visible; break; // Toggle visual
                    case 'w': control.setMode('translate'); break;       // Mover
                    case 'e': control.setMode('rotate'); break;          // Rotar
                    case 'r': control.setMode('scale'); break;           // Escalar
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
