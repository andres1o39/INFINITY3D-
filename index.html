<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Code Runner</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --border-color: #333;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            height: 40px;
        }

        .logo {
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .main-editor {
            display: flex;
            flex: 1;
            width: 100%;
        }

        .editor-side, .preview-side {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .panel-label {
            background: var(--panel-bg);
            font-size: 11px;
            padding: 4px 12px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            color: #888;
        }

        textarea {
            flex: 1;
            background-color: var(--bg-color);
            color: #9cdcfe;
            border: none;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            outline: none;
            border-right: 1px solid var(--border-color);
        }

        iframe {
            flex: 1;
            background-color: white;
            border: none;
            width: 100%;
            height: 100%;
        }

        /* Scrollbar styling */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        textarea::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">HTML RUNNER</div>
        <div style="font-size: 12px; opacity: 0.6;">Escritura rápida activada</div>
    </header>

    <div class="main-editor">
        <div class="editor-side">
            <div class="panel-label">Editor de Código</div>
            <textarea id="code-input" spellcheck="false" placeholder="Escribe tu HTML, CSS o JS aquí..."></textarea>
        </div>
        
        <div class="preview-side">
            <div class="panel-label">Vista Previa</div>
            <iframe id="live-preview"></iframe>
        </div>
    </div>
</div>

<script>
    const editor = document.getElementById('code-input');
    const preview = document.getElementById('live-preview');

    // Default template
    const defaultCode = `<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      font-family: sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 80vh; 
      color: #333;
    }
    .card {
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { color: #007acc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>¡Funciona! 🚀</h1>
    <p>Modifica el código a la izquierda para ver los cambios aquí mismo.</p>
  </div>
</body>
</html>`;

    function updatePreview() {
        const content = editor.value;
        const iframeDoc = preview.contentDocument || preview.contentWindow.document;
        
        iframeDoc.open();
        iframeDoc.write(content);
        iframeDoc.close();
    }

    // Event listener for real-time updates
    editor.addEventListener('input', updatePreview);

    // Initial load
    window.onload = () => {
        editor.value = defaultCode;
        updatePreview();
    };

    // Support Tab key in textarea
    editor.onkeydown = function(e) {
        if (e.keyCode === 9) { // Tab
            e.preventDefault();
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 2;
        }
    };
</script>

</body>
</html>
