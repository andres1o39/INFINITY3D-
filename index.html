<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; color: white; }
        #top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        #top-bar h1 { margin: 0; font-size: 1.5em; }
        #info {
            position: absolute;
            top: 60px; left: 10px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 9;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }
        button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        button:hover { background-color: #0056b3; }
        input[type="range"] {
            width: 200px;
            -webkit-appearance: none;
            height: 8px;
            background: #d3d3d3;
            outline: none;
            opacity: 0.7;
            -webkit-transition: .2s;
            transition: opacity .2s;
            border-radius: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
        }
        #current-frame {
            font-size: 1em;
            margin-left: 5px;
            width: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="top-bar">
    <h1>Infinity 3D</h1>
    <div>
        <button id="addCubeBtn">Agregar Cubo</button>
    </div>
</div>

<div id="info">
    <strong>Controles de Transformación:</strong><br>
    W: Mover | E: Rotar | R: Escalar<br>
    Click en Objeto: Seleccionar<br>
    Click/Arrastrar: Orbitar cámara
    <p><strong>Objeto Seleccionado:</strong> <span id="selectedObjectName">Ninguno</span></p>
</div>

<div id="controls">
    <button id="playPauseBtn">▶ Reproducir</button>
    <label for="timeline">Frame:</label>
    <input type="range" id="timeline" min="0" max="100" value="0">
    <span id="current-frame">0</span>
    <button id="saveKeyframeBtn">Guardar Keyframe</button>
    <button id="deleteKeyframeBtn" style="background-color: #dc3545;">Borrar Keyframe</button>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // --- Configuración de la Escena ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- Luces ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 10, 7.5);
    scene.add(directionalLight);

    // --- Rejilla ---
    const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
    scene.add(grid);

    // --- Controles de Cámara y Transformación ---
    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.update();

    const transformControl = new TransformControls(camera, renderer.domElement);
    scene.add(transformControl);

    // --- Raycaster para selección de objetos ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let selectedObject = null;
    let objects = []; // Array para almacenar todos los objetos que podemos seleccionar/animar

    // --- Sistema de Animación (Keyframes) ---
    const animationData = new Map(); // Mapa para almacenar keyframes por objeto
                                     // Key: object.uuid, Value: Map<frame, {position, rotation, scale}>

    let currentFrame = 0;
    const maxFrames = 100;
    let isPlaying = false;
    let animationSpeed = 1; // Frames por segundo
    let lastRenderTime = 0;

    // --- Elementos HTML ---
    const addCubeBtn = document.getElementById('addCubeBtn');
    const timelineSlider = document.getElementById('timeline');
    const currentFrameSpan = document.getElementById('current-frame');
    const saveKeyframeBtn = document.getElementById('saveKeyframeBtn');
    const deleteKeyframeBtn = document.getElementById('deleteKeyframeBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const selectedObjectNameSpan = document.getElementById('selectedObjectName');

    timelineSlider.max = maxFrames;

    // --- Funciones del sistema ---

    function createCube() {
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({
            color: new THREE.Color(Math.random(), Math.random(), Math.random()),
            roughness: 0.7,
            metalness: 0.2
        });
        const cube = new THREE.Mesh(geometry, material);
        cube.position.set((Math.random() - 0.5) * 10, 1, (Math.random() - 0.5) * 10);
        cube.name = `Cubo_${objects.length + 1}`; // Nombre único
        scene.add(cube);
        objects.push(cube);
        return cube;
    }

    function selectObject(object) {
        if (selectedObject) {
            // Deseleccionar el anterior (opcional, podrías cambiar su material para indicar deselección)
        }
        selectedObject = object;
        transformControl.attach(selectedObject);
        selectedObjectNameSpan.textContent = selectedObject ? selectedObject.name : "Ninguno";
    }

    function deselectObject() {
        selectedObject = null;
        transformControl.detach();
        selectedObjectNameSpan.textContent = "Ninguno";
    }

    function saveKeyframe() {
        if (!selectedObject) return;

        let objAnimation = animationData.get(selectedObject.uuid);
        if (!objAnimation) {
            objAnimation = new Map();
            animationData.set(selectedObject.uuid, objAnimation);
        }

        objAnimation.set(currentFrame, {
            position: selectedObject.position.clone(),
            rotation: selectedObject.rotation.clone(),
            scale: selectedObject.scale.clone()
        });
        console.log(`Keyframe guardado para ${selectedObject.name} en el frame ${currentFrame}`);
    }

    function deleteKeyframe() {
        if (!selectedObject) return;

        const objAnimation = animationData.get(selectedObject.uuid);
        if (objAnimation && objAnimation.has(currentFrame)) {
            objAnimation.delete(currentFrame);
            console.log(`Keyframe borrado para ${selectedObject.name} en el frame ${currentFrame}`);
        }
    }

    function applyKeyframe(object, frame) {
        const objAnimation = animationData.get(object.uuid);
        if (!objAnimation) return;

        const frames = Array.from(objAnimation.keys()).sort((a, b) => a - b);
        if (frames.length === 0) return;

        let prevFrame = frames[0];
        let nextFrame = frames[frames.length - 1];

        // Encuentra los keyframes más cercanos antes y después del frame actual
        for (let i = 0; i < frames.length; i++) {
            if (frames[i] <= frame) {
                prevFrame = frames[i];
            }
            if (frames[i] >= frame) {
                nextFrame = frames[i];
                break;
            }
        }

        const prevKey = objAnimation.get(prevFrame);
        const nextKey = objAnimation.get(nextFrame);

        if (!prevKey && !nextKey) return;

        let interpolatedPosition = new THREE.Vector3();
        let interpolatedRotation = new THREE.Euler();
        let interpolatedScale = new THREE.Vector3();

        if (prevFrame === nextFrame || frame <= prevFrame) {
            // Si estamos en un keyframe exacto o antes del primero
            interpolatedPosition.copy(prevKey.position);
            interpolatedRotation.copy(prevKey.rotation);
            interpolatedScale.copy(prevKey.scale);
        } else if (frame >= nextFrame) {
            // Si estamos después del último keyframe
            interpolatedPosition.copy(nextKey.position);
            interpolatedRotation.copy(nextKey.rotation);
            interpolatedScale.copy(nextKey.scale);
        } else {
            // Interpolar entre prevKey y nextKey
            const t = (frame - prevFrame) / (nextFrame - prevFrame);
            interpolatedPosition.lerpVectors(prevKey.position, nextKey.position, t);
            // Para rotaciones es mejor usar Slerp (Spherical Linear Interpolation) con Quaternions
            // Aquí usaremos una interpolación lineal simple para Eulers, que puede tener gimbal lock
            // Para una producción real, se recomienda usar Quaternions
            interpolatedRotation.set(
                THREE.MathUtils.lerp(prevKey.rotation.x, nextKey.rotation.x, t),
                THREE.MathUtils.lerp(prevKey.rotation.y, nextKey.rotation.y, t),
                THREE.MathUtils.lerp(prevKey.rotation.z, nextKey.rotation.z, t)
            );
            interpolatedScale.lerpVectors(prevKey.scale, nextKey.scale, t);
        }

        object.position.copy(interpolatedPosition);
        object.rotation.copy(interpolatedRotation);
        object.scale.copy(interpolatedScale);
    }

    function updateAnimation(deltaTime) {
        if (!isPlaying) return;

        currentFrame += animationSpeed * deltaTime; // Avanza el frame basado en el tiempo
        if (currentFrame > maxFrames) {
            currentFrame = 0; // Reiniciar animación
        }
        timelineSlider.value = Math.floor(currentFrame);
        currentFrameSpan.textContent = Math.floor(currentFrame);

        // Aplica los keyframes a todos los objetos animados
        objects.forEach(obj => {
            applyKeyframe(obj, currentFrame);
        });

        if (selectedObject && transformControl.object === selectedObject) {
            transformControl.updateMatrixWorld(); // Asegura que los controles sigan al objeto animado
        }
    }


    // --- Event Listeners ---
    addCubeBtn.addEventListener('click', () => {
        createCube();
    });

    timelineSlider.addEventListener('input', (event) => {
        currentFrame = parseInt(event.target.value);
        currentFrameSpan.textContent = currentFrame;

        // Cuando se arrastra el slider, aplicar keyframes a todos los objetos
        objects.forEach(obj => {
            applyKeyframe(obj, currentFrame);
        });

        // Asegúrate de que el objeto seleccionado (si lo hay) se actualice y los TransformControls lo sigan
        if (selectedObject && transformControl.object === selectedObject) {
            selectedObject.updateMatrixWorld();
            transformControl.updateMatrixWorld();
        }
    });

    saveKeyframeBtn.addEventListener('click', saveKeyframe);
    deleteKeyframeBtn.addEventListener('click', deleteKeyframe);

    playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseBtn.textContent = isPlaying ? "⏸ Pausar" : "▶ Reproducir";
    });


    // Detección de clic para seleccionar objeto
    renderer.domElement.addEventListener('pointerdown', (event) => {
        if (transformControl.dragging || isPlaying) return; // No seleccionar si arrastrando un control o animando

        // Calcular la posición del mouse en coordenadas normalizadas de dispositivo (-1 a +1)
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        // Calcula los objetos que intersectan con el rayo
        const intersects = raycaster.intersectObjects(objects, false);

        if (intersects.length > 0) {
            const clickedObject = intersects[0].object;
            if (clickedObject !== selectedObject) {
                selectObject(clickedObject);
            }
        } else {
            deselectObject(); // Clic en el vacío deselecciona
        }
    });

    // Deshabilitar OrbitControls mientras se transforma el objeto
    transformControl.addEventListener('dragging-changed', (event) => {
        orbit.enabled = !event.value;
    });

    // Eventos de Teclado
    window.addEventListener('keydown', (event) => {
        if (event.key.toLowerCase() === 'w') transformControl.setMode('translate');
        if (event.key.toLowerCase() === 'e') transformControl.setMode('rotate');
        if (event.key.toLowerCase() === 'r') transformControl.setMode('scale');
        // También puedes añadir atajos para guardar/borrar keyframes
        // if (event.key.toLowerCase() === 'k') saveKeyframe();
        // if (event.key.toLowerCase() === 'delete' || event.key.toLowerCase() === 'backspace') deleteKeyframe();
    });

    // Ajuste de Ventana
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animación ---
    function animate(currentTime) {
        requestAnimationFrame(animate);

        const deltaTime = (currentTime - lastRenderTime) / 1000; // Segundos desde el último frame
        lastRenderTime = currentTime;

        updateAnimation(deltaTime);

        orbit.update(); // Solo para OrbitControls
        renderer.render(scene, camera);
    }

    // --- Inicialización ---
    const initialCube = createCube(); // Crear un cubo al inicio
    selectObject(initialCube);
    animate(0); // Iniciar el loop de animación
</script>
</body>
</html>
