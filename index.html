<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity 3D - Engine Pro + AutoRig</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; }
        #viewport { position: absolute; inset: 0; z-index: 1; }
        
        /* Toolbar lateral */
        .left-toolbar {
            position: absolute; left: 15px; top: 15px; bottom: 120px;
            width: 50px; background: rgba(15, 15, 20, 0.9);
            border: 1px solid #222; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; padding: 12px 0; z-index: 10;
        }
        .tool-btn {
            width: 36px; height: 36px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; cursor: pointer; transition: 0.2s; color: #666;
        }
        .tool-btn.active { background: #3b82f6; color: white; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .tool-btn:hover:not(.active) { background: #1a1a1e; color: #eee; }

        /* Panel Inspector */
        .right-panel {
            position: absolute; right: 0; top: 0; bottom: 100px;
            width: 280px; background: rgba(10, 10, 12, 0.98);
            border-left: 1px solid #1a1a1a; z-index: 10; padding: 20px;
            display: flex; flex-direction: column; font-size: 11px;
        }

        /* Timeline Inferior Estilo Tablet */
        .bottom-timeline {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 100px; background: #08080a; border-top: 1px solid #1a1a1a;
            z-index: 20; display: flex; flex-direction: column;
        }
        .ruler {
            height: 35px; border-bottom: 1px solid #151518; position: relative;
            overflow: hidden; font-size: 9px; color: #444; cursor: pointer;
        }
        .timeline-controls {
            flex: 1; display: flex; align-items: center; padding: 0 20px; gap: 15px;
        }

        /* Botones Acción */
        .action-btn {
            background: #f59e0b; color: #000; font-weight: 800; font-size: 10px;
            padding: 10px 18px; border-radius: 4px; text-transform: uppercase;
            box-shadow: 0 2px 0 #b45309; transition: transform 0.1s;
        }
        .action-btn:active { transform: translateY(2px); box-shadow: none; }
        
        .play-btn { background: #2563eb; color: white; padding: 8px 20px; border-radius: 4px; font-weight: bold; }

        /* Notificación de Auto-Rig */
        #rig-notif {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: #10b981; color: white; padding: 8px 20px; border-radius: 20px;
            font-size: 11px; font-weight: bold; z-index: 100; display: none;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .prop-input { width: 100%; background: #000; border: 1px solid #222; color: #f59e0b; padding: 5px; border-radius: 3px; font-family: monospace; margin-top: 2px; }
        #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ef4444; z-index: 30; }
    </style>
</head>
<body>

    <div id="rig-notif">SISTEMA AUTO-RIG: Esqueleto detectado y vinculado con éxito.</div>
    <div id="viewport"></div>

    <!-- Herramientas Laterales -->
    <div class="left-toolbar">
        <div class="tool-btn active" id="t-move"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M13 11V5.41l2.3 2.3 1.41-1.42L12 1.58l-4.71 4.71 1.41 1.42 2.3-2.3V11H5.41l2.3-2.3-1.42-1.41L1.58 12l4.71 4.71 1.42-1.41-2.3-2.3H11v5.59l-2.3-2.3-1.41 1.42L12 22.42l4.71-4.71-1.41-1.42-2.3 2.3V13h5.59l-2.3 2.3 1.41 1.42L22.42 12l-4.71-4.71-1.41 1.41 2.3 2.3H13z"/></svg></div>
        <div class="tool-btn" id="t-rotate"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 20c-4.41 0-8-3.59-8-8s3.59-8 8-8v3L17 3l-5-4v3c-5.52 0-10 4.48-10 10s4.48 10 10 10 10-4.48 10-10h-2c0 4.41-3.59 8-8 8z"/></svg></div>
        <div class="tool-btn" id="t-scale"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 19H5V5h14v14zM3 3v18h18V3H3zm15 15h-2V7h-4V5h6v13z"/></svg></div>
        <div class="mt-auto"></div>
        <div class="tool-btn" onclick="document.getElementById('glb-loader').click()"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg></div>
    </div>

    <!-- Inspector Pro -->
    <div class="right-panel">
        <h3 class="text-blue-500 font-black mb-6 uppercase text-xs">● Inspector Pro</h3>
        <div id="inspector-content"></div>
        
        <div class="mt-10">
            <h3 class="text-zinc-600 font-bold mb-4 uppercase text-[9px]">● Estructura del Actor</h3>
            <div id="outliner" class="space-y-2"></div>
        </div>

        <div class="mt-auto p-4 bg-zinc-900/50 rounded-lg">
            <label class="text-[8px] text-zinc-500 block mb-2">MODO VISUALIZACIÓN</label>
            <button onclick="toggleSkeleton()" class="w-full bg-zinc-800 text-[10px] py-2 border border-zinc-700 rounded mb-2">VER ESQUELETO (RIG)</button>
            <button onclick="deleteSelected()" class="w-full text-red-500 text-[9px] font-bold">ELIMINAR SELECCIÓN</button>
        </div>
    </div>

    <!-- Timeline Inferior -->
    <div class="bottom-timeline">
        <div class="ruler" id="timeline-ruler">
            <div id="playhead"></div>
        </div>
        <div class="timeline-controls">
            <button class="play-btn" id="btn-play">▶ PLAY</button>
            <div class="bg-black border border-zinc-800 px-5 py-1.5 rounded text-orange-400 font-mono text-base font-bold" id="current-frame-label">0</div>
            <button class="action-btn" onclick="addKeyframe()">INSERTAR KEY</button>
            <button class="bg-zinc-800 text-zinc-400 px-4 py-2 rounded text-[10px] font-bold" onclick="resetAnimation()">RESET</button>
        </div>
    </div>

    <input type="file" id="glb-loader" accept=".glb,.gltf" class="hidden" onchange="loadAndAutoRig(event)">

    <script>
        let scene, camera, renderer, orbit, transform;
        let objects = [], animations = new Map();
        let currentFrame = 0, totalFrames = 250, isPlaying = false;
        let selectedObject = null;
        let skeletonHelper = null;

        // Diccionario de Auto-Rigging (Mapeo inteligente)
        const RIG_KEYWORDS = {
            head: ["head", "cabeza", "skull"],
            spine: ["spine", "back", "hips", "root"],
            arm_l: ["arm_l", "leftarm", "shoulder_l"],
            arm_r: ["arm_r", "rightarm", "shoulder_r"],
            leg_l: ["leg_l", "leftleg", "thigh_l"],
            leg_r: ["leg_r", "rightleg", "thigh_r"]
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 8, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('viewport').appendChild(renderer.domElement);

            const grid = new THREE.GridHelper(40, 40, 0x151515, 0x111111);
            scene.add(grid);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const light = new THREE.PointLight(0xffffff, 1);
            light.position.set(10, 20, 10);
            scene.add(light);

            orbit = new THREE.OrbitControls(camera, renderer.domElement);
            transform = new THREE.TransformControls(camera, renderer.domElement);
            transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);
            transform.addEventListener('change', updateInspector);
            scene.add(transform);

            initTimelineUI();
            setupTools();
            animate();
        }

        // --- SISTEMA AUTO-RIGGING ---
        function loadAndAutoRig(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            const loader = new THREE.GLTFLoader();
            const url = URL.createObjectURL(file);
            
            loader.load(url, (gltf) => {
                const model = gltf.scene;
                model.name = file.name.split('.')[0];
                model.id = THREE.MathUtils.generateUUID();
                
                let foundBones = [];
                model.traverse(node => {
                    if(node.isBone) {
                        foundBones.push(node);
                        // Auto-etiquetado inteligente
                        const nameLower = node.name.toLowerCase();
                        for(const [key, keywords] of Object.entries(RIG_KEYWORDS)) {
                            if(keywords.some(k => nameLower.includes(k))) {
                                node.userData.rigType = key;
                            }
                        }
                    }
                });

                scene.add(model);
                objects.push(model);
                selectObject(model);
                updateOutliner();

                if(foundBones.length > 0) {
                    showRigNotif();
                    if(skeletonHelper) scene.remove(skeletonHelper);
                    skeletonHelper = new THREE.SkeletonHelper(model);
                    skeletonHelper.visible = false;
                    scene.add(skeletonHelper);
                }
            });
        }

        function showRigNotif() {
            const n = document.getElementById('rig-notif');
            n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 4000);
        }

        function toggleSkeleton() {
            if(skeletonHelper) skeletonHelper.visible = !skeletonHelper.visible;
        }

        // --- GESTIÓN DE UI ---
        function selectObject(obj) {
            selectedObject = obj;
            transform.attach(obj);
            updateInspector();
            updateOutliner();
        }

        function updateInspector() {
            const container = document.getElementById('inspector-content');
            if(!selectedObject) return;
            
            const p = selectedObject.position;
            const r = selectedObject.rotation;
            
            container.innerHTML = `
                <div class="bg-blue-500/5 p-3 rounded border border-blue-500/20 mb-4">
                    <p class="text-[8px] text-blue-400 font-bold mb-1">TIPO: ${selectedObject.type}</p>
                    <h4 class="text-white font-bold truncate">${selectedObject.name}</h4>
                </div>
                <div class="space-y-4">
                    <div>
                        <span class="text-[9px] text-zinc-600 block mb-1">POSICIÓN</span>
                        <div class="grid grid-cols-3 gap-1">
                            <input class="prop-input" value="${p.x.toFixed(2)}">
                            <input class="prop-input" value="${p.y.toFixed(2)}">
                            <input class="prop-input" value="${p.z.toFixed(2)}">
                        </div>
                    </div>
                    <div>
                        <span class="text-[9px] text-zinc-600 block mb-1">ROTACIÓN (DEG)</span>
                        <div class="grid grid-cols-3 gap-1">
                            <input class="prop-input" value="${(r.x * 57.3).toFixed(0)}">
                            <input class="prop-input" value="${(r.y * 57.3).toFixed(0)}">
                            <input class="prop-input" value="${(r.z * 57.3).toFixed(0)}">
                        </div>
                    </div>
                </div>
            `;
        }

        function updateOutliner() {
            const container = document.getElementById('outliner');
            container.innerHTML = '';
            objects.forEach(obj => {
                const el = document.createElement('div');
                el.className = `flex items-center gap-2 p-2 rounded cursor-pointer transition ${selectedObject === obj ? 'bg-blue-600' : 'bg-zinc-900/50 hover:bg-zinc-800'}`;
                el.innerHTML = `<span class="text-[10px] opacity-70">📦</span> <span class="truncate">${obj.name}</span>`;
                el.onclick = () => selectObject(obj);
                container.appendChild(el);
            });
        }

        // --- ANIMACIÓN ---
        function addKeyframe() {
            if(!selectedObject) return;
            if(!animations.has(selectedObject.id)) animations.set(selectedObject.id, []);
            
            const track = animations.get(selectedObject.id);
            const key = {
                frame: currentFrame,
                pos: selectedObject.position.clone(),
                rot: selectedObject.quaternion.clone(),
                scale: selectedObject.scale.clone()
            };

            const existingIdx = track.findIndex(k => k.frame === currentFrame);
            if(existingIdx >= 0) track[existingIdx] = key;
            else { track.push(key); track.sort((a,b) => a.frame - b.frame); }
            
            // Efecto visual en el botón
            const btn = event.target;
            btn.innerText = "KEY GUARDADA";
            setTimeout(() => btn.innerText = "INSERTAR KEY", 1000);
        }

        function updateFrame() {
            document.getElementById('current-frame-label').innerText = currentFrame;
            document.getElementById('playhead').style.left = (currentFrame / totalFrames * 100) + '%';
            
            objects.forEach(obj => {
                const keys = animations.get(obj.id);
                if(!keys || keys.length === 0) return;

                let prev = keys.filter(k => k.frame <= currentFrame).pop();
                let next = keys.filter(k => k.frame > currentFrame)[0];

                if(prev && next) {
                    const t = (currentFrame - prev.frame) / (next.frame - prev.frame);
                    obj.position.lerpVectors(prev.pos, next.pos, t);
                    obj.quaternion.slerpQuaternions(prev.rot, next.rot, t);
                    obj.scale.lerpVectors(prev.scale, next.scale, t);
                } else if(prev) {
                    obj.position.copy(prev.pos);
                    obj.quaternion.copy(prev.rot);
                    obj.scale.copy(prev.scale);
                }
            });
            updateInspector();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(isPlaying) {
                currentFrame++;
                if(currentFrame > totalFrames) currentFrame = 0;
                updateFrame();
            }
            if(skeletonHelper) skeletonHelper.update();
            renderer.render(scene, camera);
        }

        // --- UTILS UI ---
        function initTimelineUI() {
            const ruler = document.getElementById('timeline-ruler');
            for(let i=0; i<=totalFrames; i+=25) {
                const label = document.createElement('div');
                label.style.position = 'absolute';
                label.style.left = (i/totalFrames * 100) + '%';
                label.style.borderLeft = '1px solid #222';
                label.style.height = '15px';
                label.style.paddingLeft = '5px';
                label.innerText = i;
                ruler.appendChild(label);
            }
            ruler.onclick = (e) => {
                const rect = ruler.getBoundingClientRect();
                currentFrame = Math.round(((e.clientX - rect.left) / rect.width) * totalFrames);
                currentFrame = Math.max(0, Math.min(totalFrames, currentFrame));
                updateFrame();
            };
            document.getElementById('btn-play').onclick = () => {
                isPlaying = !isPlaying;
                document.getElementById('btn-play').innerText = isPlaying ? "⏸ PAUSE" : "▶ PLAY";
            };
        }

        function setupTools() {
            const modes = { 't-move': 'translate', 't-rotate': 'rotate', 't-scale': 'scale' };
            Object.keys(modes).forEach(id => {
                document.getElementById(id).onclick = () => {
                    transform.setMode(modes[id]);
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                    document.getElementById(id).classList.add('active');
                };
            });
        }

        function deleteSelected() {
            if(!selectedObject) return;
            scene.remove(selectedObject);
            objects = objects.filter(o => o !== selectedObject);
            animations.delete(selectedObject.id);
            transform.detach();
            selectedObject = null;
            updateOutliner();
            updateInspector();
        }

        function resetAnimation() {
            isPlaying = false;
            currentFrame = 0;
            updateFrame();
        }

        window.onload = init;
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
