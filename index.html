<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VoxelOS Ultimate - Laptop</title>
    <style>
        :root {
            --bg: #0f0f1a; --taskbar: rgba(15, 15, 26, 0.9);
            --accent: #00d1ff; --win-bg: #1e1e2f; --text: #ffffff;
        }
        body, html { margin: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; color: var(--text); }
        
        /* --- ARRANQUE --- */
        #boot { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: #000; position: fixed; width: 100%; z-index: 9999; }
        .spinner { width: 60px; height: 60px; border: 5px solid #222; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- ESCRITORIO --- */
        #desktop { display: none; height: 100vh; background: var(--bg); position: relative; overflow: hidden; }
        #canvas-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, 90px); gap: 15px; padding: 20px; position: relative; z-index: 10; }
        .icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 10px; border-radius: 8px; transition: 0.2s; text-align: center; }
        .icon:hover { background: rgba(255,255,255,0.1); transform: translateY(-5px); }
        .icon img { width: 45px; margin-bottom: 5px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
        .icon span { font-size: 11px; }

        /* --- VENTANAS --- */
        .window { position: absolute; width: 600px; height: 450px; background: var(--win-bg); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); display: none; flex-direction: column; z-index: 100; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; resize: both; }
        .win-header { background: rgba(0,0,0,0.4); padding: 12px; display: flex; justify-content: space-between; cursor: move; align-items: center; }
        .win-content { padding: 20px; flex-grow: 1; overflow-y: auto; }
        .btn-close { color: #ff5f56; cursor: pointer; font-size: 20px; line-height: 0; }

        /* --- EDITOR VOXEL --- */
        #editor-area { width: 100%; height: 80%; background: #12121e; color: #00ff00; border: none; border-radius: 5px; padding: 10px; font-family: 'Courier New', monospace; resize: none; }
        .editor-tools { margin-bottom: 10px; display: flex; gap: 10px; }

        /* --- GRID DE TIENDA Y CONFIG --- */
        .config-list, .store-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        button { background: var(--accent); border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* --- BARRA TAREAS --- */
        .taskbar { position: absolute; bottom: 0; width: 100%; height: 48px; background: var(--taskbar); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; box-sizing: border-box; z-index: 1000; }
        #notif { position: fixed; top: 20px; right: -350px; background: var(--accent); color: #000; padding: 15px 25px; border-radius: 8px; transition: 0.5s; z-index: 10000; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div id="notif">Sistema Listo</div>

<div id="boot">
    <div class="spinner"></div>
    <h1 id="boot-text">Iniciando VoxelOS...</h1>
</div>

<div id="desktop">
    <canvas id="canvas-bg"></canvas>
    
    <div class="icon-grid" id="desktop-icons">
        <div class="icon" onclick="openWin('win-config')"><img src="https://cdn-icons-png.flaticon.com/512/3953/3953226.png"><span>Configuración</span></div>
        <div class="icon" onclick="openWin('win-store')"><img src="https://cdn-icons-png.flaticon.com/512/3306/3306613.png"><span>Voxel Store</span></div>
        <div class="icon" onclick="openWin('win-editor')"><img src="https://cdn-icons-png.flaticon.com/512/2919/2919590.png"><span>Voxel Editor</span></div>
    </div>

    <div id="win-config" class="window">
        <div class="win-header" onmousedown="drag(this.parentElement)"><span>⚙️ Configuración del Sistema</span><span class="btn-close" onclick="closeWin('win-config')">×</span></div>
        <div class="win-content">
            <div class="config-list" id="config-container">
                </div>
        </div>
    </div>

    <div id="win-store" class="window">
        <div class="win-header" onmousedown="drag(this.parentElement)"><span>🛒 Voxel Store - Juegos</span><span class="btn-close" onclick="closeWin('win-store')">×</span></div>
        <div class="win-content">
            <div class="store-list" id="store-container">
                </div>
        </div>
    </div>

    <div id="win-editor" class="window" style="width: 700px;">
        <div class="win-header" onmousedown="drag(this.parentElement)"><span>📝 Voxel Editor Pro</span><span class="btn-close" onclick="closeWin('win-editor')">×</span></div>
        <div class="win-content">
            <div class="editor-tools">
                <button onclick="saveFile()">Descargar .txt</button>
                <button onclick="document.getElementById('editor-area').value = ''">Nuevo</button>
                <select onchange="document.getElementById('editor-area').style.fontSize = this.value">
                    <option value="14px">Pequeño</option>
                    <option value="18px">Normal</option>
                    <option value="24px">Grande</option>
                </select>
            </div>
            <textarea id="editor-area" placeholder="Escribe tu código o notas aquí..."></textarea>
        </div>
    </div>

    <div class="taskbar">
        <div style="font-weight: bold; letter-spacing: 2px;">VOXEL OS</div>
        <div style="display: flex; gap: 20px; align-items: center;">
            <span>📶 WiFi: 5G</span>
            <input type="range" min="20" max="100" value="100" oninput="document.getElementById('desktop').style.filter=`brightness(${this.value}%)`">
            <span id="clock">00:00</span>
        </div>
    </div>
</div>

<script>
    // 1. SECUENCIA DE ARRANQUE
    const bootSteps = ["Iniciando Kernel...", "Cargando controladores de video...", "Instalando Voxel Library...", "Optimizando Sistema...", "Listo!"];
    let step = 0;
    const bootInterval = setInterval(() => {
        document.getElementById('boot-text').innerText = bootSteps[step];
        step++;
        if(step >= bootSteps.length) {
            clearInterval(bootInterval);
            document.getElementById('boot').style.display = 'none';
            document.getElementById('desktop').style.display = 'block';
            notify("VoxelOS v2.0 Iniciado");
        }
    }, 1200);

    // 2. GENERAR 20 CONFIGURACIONES
    const configs = [
        "Modo Oscuro", "Animaciones", "Transparencia", "Sonido de Inicio", "Bluetooth", "Ubicación", 
        "Notificaciones", "Firewall", "Ahorro de Energía", "Modo Gaming", "Escritorio Remoto", 
        "Actualizaciones", "Privacidad", "Micrófono", "Cámara", "Fuente Negrita", "VPN", 
        "Reloj 24h", "Barra Flotante", "Fondo Animado"
    ];
    const confContainer = document.getElementById('config-container');
    configs.forEach(c => {
        confContainer.innerHTML += `<div class="item-card"><span>${c}</span><input type="checkbox" checked onclick="notify('${c} actualizado')"></div>`;
    });

    // 3. GENERAR 20 JUEGOS EN STORE
    const games = [
        "Voxel Craft", "Cyber Runner", "Block Shooter", "Space Explorer", "Mine Dash", 
        "Neon Race", "Pixel Quest", "Void Hunter", "Cube World", "Battle Logic", 
        "Shadow Ninja", "Retro Ball", "Star Fighter", "Grid Master", "Data Leak", 
        "Logic Gate", "Alpha Zero", "Vector Zone", "Omega Code", "Voxel Clicker"
    ];
    const storeContainer = document.getElementById('store-container');
    games.forEach(g => {
        storeContainer.innerHTML += `<div class="item-card"><span>${g}</span><button onclick="install('${g}')">Instalar</button></div>`;
    });

    // 4. FUNCIONES DEL SISTEMA
    function openWin(id) { 
        let w = document.getElementById(id);
        w.style.display = 'flex'; 
        w.style.top = "50px"; w.style.left = "100px";
    }
    function closeWin(id) { document.getElementById(id).style.display = 'none'; }
    
    function notify(msg) {
        let n = document.getElementById('notif');
        n.innerText = msg; n.style.right = '20px';
        setTimeout(() => n.style.right = '-350px', 3000);
    }

    function install(name) {
        notify(`Instalando ${name}...`);
        setTimeout(() => {
            let grid = document.getElementById('desktop-icons');
            grid.innerHTML += `<div class="icon" onclick="notify('Abriendo ${name}...')"><img src="https://cdn-icons-png.flaticon.com/512/686/686588.png"><span>${name}</span></div>`;
            notify(`${name} instalado en el escritorio`);
        }, 2000);
    }

    function saveFile() {
        const text = document.getElementById('editor-area').value;
        const blob = new Blob([text], {type: "text/plain"});
        const anchor = document.createElement("a");
        anchor.download = "nota_voxel.txt";
        anchor.href = window.URL.createObjectURL(blob);
        anchor.click();
        notify("Archivo guardado con éxito");
    }

    // 5. DRAG & DROP (Arrastrar ventanas)
    function drag(elm) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
        elm.onmousedown = (e) => {
            p3 = e.clientX; p4 = e.clientY;
            document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
            document.onmousemove = (e) => {
                p1 = p3 - e.clientX; p2 = p4 - e.clientY;
                p3 = e.clientX; p4 = e.clientY;
                elm.style.top = (elm.offsetTop - p2) + "px";
                elm.style.left = (elm.offsetLeft - p1) + "px";
            };
        };
    }

    // RELOJ
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }, 1000);
</script>
</body>
</html>
