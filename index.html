<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Warzone HTML5 - Color & Jump</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #gui { position: absolute; bottom: 20px; left: 20px; color: white; text-shadow: 2px 2px 4px black; }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; 
            width: 12px; height: 12px; border: 2px solid #00ff00;
            border-radius: 50%; transform: translate(-50%, -50%); 
            pointer-events: none;
        }
        #instructions {
            position: absolute; top: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.5); color: white; cursor: pointer; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>MODO COMBATE ACTIVADO</h1>
        <p>CLICK PARA EMPEZAR</p>
        <p>W,A,S,D: Mover | ESPACIO: Saltar | SHIFT: Correr | CLICK: Disparar</p>
    </div>

    <div id="crosshair"></div>
    <div id="gui">
        <h2>M4A1 - VERDANSK EDITION</h2>
        <p>ESTADO: <span style="color: #00ff00;">LISTO</span></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>

    <script type="module">
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.128.0/examples/jsm/controls/PointerLockControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Cielo azul claro
        scene.fog = new THREE.Fog(0x87CEEB, 0, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- LUCES PARA MÁS COLOR ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // --- MAPA CON COLOR ---
        const floorGeo = new THREE.PlaneGeometry(1000, 1000);
        const floorMat = new THREE.MeshPhongMaterial({ color: 0x348C31 }); // Pasto verde
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Edificios de colores
        for(let i=0; i<60; i++) {
            const h = Math.random() * 30 + 5;
            const boxGeo = new THREE.BoxGeometry(10, h, 10);
            const boxMat = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
            const building = new THREE.Mesh(boxGeo, boxMat);
            building.position.set(Math.random()*400-200, h/2, Math.random()*400-200);
            scene.add(building);
        }

        // --- ARMA Y FLASH DE DISPARO ---
        const weaponGroup = new THREE.Group();
        const gunMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
        const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.7), gunMat);
        weaponGroup.add(gunBody);

        const flash = new THREE.PointLight(0xffaa00, 0, 5); // Luz del disparo
        flash.position.set(0, 0, -0.6);
        weaponGroup.add(flash);

        weaponGroup.position.set(0.4, -0.4, -0.6);
        camera.add(weaponGroup);
        scene.add(camera);

        // --- FÍSICAS DE MOVIMIENTO Y SALTO ---
        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('instructions').addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => document.getElementById('instructions').style.display = 'none');
        controls.addEventListener('unlock', () => document.getElementById('instructions').style.display = 'flex');

        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') moveF = true;
            if(e.code === 'KeyS') moveB = true;
            if(e.code === 'KeyA') moveL = true;
            if(e.code === 'KeyD') moveR = true;
            if(e.code === 'Space' && canJump) {
                velocity.y += 15; // Fuerza del salto
                canJump = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') moveF = false;
            if(e.code === 'KeyS') moveB = false;
            if(e.code === 'KeyA') moveL = false;
            if(e.code === 'KeyD') moveR = false;
        });

        // --- ACCIÓN DE DISPARO ---
        window.addEventListener('mousedown', () => {
            if(!controls.isLocked) return;
            
            // Animación retroceso
            gsap.to(weaponGroup.position, { z: -0.45, duration: 0.04, yoyo: true, repeat: 1 });
            
            // Flash de luz
            flash.intensity = 5;
            setTimeout(() => { flash.intensity = 0; }, 50);
        });

        // --- LOOP PRINCIPAL ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if(controls.isLocked) {
                const delta = clock.getDelta();

                // Fricción y Gravedad
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 4.0 * delta; // Gravedad (9.8 m/s^2)

                direction.z = Number(moveF) - Number(moveB);
                direction.x = Number(moveR) - Number(moveL);
                direction.normalize();

                if (moveF || moveB) velocity.z -= direction.z * 400.0 * delta;
                if (moveL || moveR) velocity.x -= direction.x * 400.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                camera.position.y += (velocity.y * delta);

                // Detectar suelo
                if (camera.position.y < 2) {
                    velocity.y = 0;
                    camera.position.y = 2;
                    canJump = true;
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
