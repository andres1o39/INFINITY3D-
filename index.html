<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master-Mec Pro V9.5 | Final Legacy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }

        .logo-font { font-family: 'Orbitron', sans-serif; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(15px);
        }

        @media (max-width: 1024px) {
            .sidebar { position: fixed; transform: translateX(-100%); z-index: 50; height: 100vh; }
            .sidebar.active { transform: translateX(0); }
        }

        .card-service {
            background: white;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .card-service:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .history-item {
            border-left: 3px solid #3b82f6;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Lógica de Datos -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        window.appState = {
            services: JSON.parse(localStorage.getItem('master_mec_v9_data')) || [],
            user: null,
            isOffline: false
        };

        let auth, db, appId;

        const hideLoading = () => {
            const loader = document.getElementById('loading-screen');
            if (loader) loader.style.display = 'none';
            window.renderUI();
        };

        // Fallback para evitar bloqueo en "Iniciando sistema"
        const safetyTimeout = setTimeout(() => {
            if (!window.appState.user) {
                console.warn("La conexión tardó demasiado. Activando modo offline de seguridad.");
                window.appState.isOffline = true;
                hideLoading();
            }
        }, 5000);

        try {
            const firebaseConfig = JSON.parse(__firebase_config);
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'master-mec-v9-5';

            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (e) {
                    console.error("Auth Error:", e);
                    window.appState.isOffline = true;
                    hideLoading();
                }
            };

            onAuthStateChanged(auth, (user) => {
                clearTimeout(safetyTimeout);
                if (user) {
                    window.appState.user = user;
                    document.getElementById('user-id-display').innerText = user.uid.substring(0,8);
                    startSync();
                    hideLoading();
                } else {
                    initAuth();
                }
            });

        } catch (err) {
            console.error("Firebase Config Error:", err);
            window.appState.isOffline = true;
            hideLoading();
        }

        function startSync() {
            if (!db || !appId) return;
            const ref = collection(db, 'artifacts', appId, 'public', 'data', 'services');
            onSnapshot(ref, (snap) => {
                const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                data.sort((a, b) => b.createdAt - a.createdAt);
                window.appState.services = data;
                localStorage.setItem('master_mec_v9_data', JSON.stringify(data));
                window.renderUI();
            }, (err) => {
                console.warn("Firestore Sync Error (Mec):", err);
            });
        }

        window.dbActions = {
            save: async (data) => {
                if (window.appState.isOffline) {
                    alert("Modo offline: Los datos se guardan solo localmente.");
                    return;
                }
                const ref = collection(db, 'artifacts', appId, 'public', 'data', 'services');
                try {
                    if (data.id) {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'services', data.id), { ...data, updatedAt: Date.now() });
                    } else {
                        await addDoc(ref, { ...data, createdAt: Date.now(), status: 'pending' });
                    }
                } catch (e) { console.error(e); }
            },
            delete: async (id) => {
                if(confirm("¿Eliminar registro permanentemente?")) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'services', id));
                }
            },
            status: async (id, next) => {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'services', id), { status: next });
            },
            logout: async () => {
                if(confirm("¿Cerrar sesión? Se borrará el caché local.")) {
                    localStorage.removeItem('master_mec_v9_data');
                    if (auth) await signOut(auth);
                    location.reload();
                }
            }
        };
    </script>

    <!-- Pantalla de Carga -->
    <div id="loading-screen" class="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center text-white">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="logo-font text-[10px] tracking-widest text-blue-400">INICIANDO SISTEMA...</p>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar w-[280px] text-slate-300 flex flex-col border-r border-slate-800 shrink-0">
        <div class="p-8 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white">
                    <i data-lucide="wrench" class="w-6 h-6"></i>
                </div>
                <h1 class="logo-font text-white text-base">MASTER-MEC</h1>
            </div>
            <button onclick="toggleSidebar()" class="lg:hidden p-2 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <nav class="px-6 space-y-2">
            <button onclick="switchTab('dashboard')" class="nav-btn active w-full flex items-center gap-4 px-4 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Inicio
            </button>
            <button onclick="switchTab('services')" class="nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-sm font-medium text-slate-400">
                <i data-lucide="clipboard-list" class="w-4 h-4"></i> Órdenes
            </button>
            <button onclick="switchTab('customers')" class="nav-btn w-full flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/5 text-sm font-medium text-slate-400">
                <i data-lucide="users" class="w-4 h-4"></i> Clientes
            </button>
        </nav>

        <div class="mt-auto p-6 space-y-4 border-t border-slate-800/50">
            <div class="p-3 bg-slate-800/40 rounded-xl flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-blue-500 flex items-center justify-center text-white font-black text-[10px]">ID</div>
                <div class="flex-1 min-w-0">
                    <p class="text-[9px] font-black text-white uppercase">Operador</p>
                    <p id="user-id-display" class="text-[8px] text-slate-500 truncate">Sincronizando...</p>
                </div>
            </div>
            <button onclick="window.dbActions.logout()" class="w-full py-3 bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl text-[10px] font-black uppercase hover:bg-red-500 hover:text-white transition-all">
                Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 h-screen overflow-y-auto">
        <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 bg-slate-100 rounded-lg"><i data-lucide="menu" class="w-5 h-5"></i></button>
                <h2 id="page-title" class="text-lg font-extrabold text-slate-800">Resumen General</h2>
            </div>
            <button onclick="openForm()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> Nueva Orden
            </button>
        </header>

        <div class="p-6 max-w-6xl mx-auto space-y-8">
            <!-- Vistas -->
            <section id="view-dashboard" class="animate__animated animate__fadeIn">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                    <div class="p-6 bg-white border border-slate-100 rounded-2xl">
                        <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Entregados</p>
                        <p id="stat-paid" class="text-2xl font-black text-emerald-600">$0</p>
                    </div>
                    <div class="p-6 bg-white border border-slate-100 rounded-2xl">
                        <p class="text-[9px] font-black text-slate-400 uppercase mb-1">En Taller</p>
                        <p id="stat-pending" class="text-2xl font-black text-amber-600">0</p>
                    </div>
                    <div class="p-6 bg-white border border-slate-100 rounded-2xl">
                        <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Total Servicios</p>
                        <p id="stat-total" class="text-2xl font-black text-slate-900">0</p>
                    </div>
                </div>
                <div class="bg-slate-900 p-8 rounded-[2rem] text-white flex justify-between items-center">
                    <div>
                        <h3 class="text-xl font-bold mb-1">Sistema Master-Mec</h3>
                        <p class="text-slate-400 text-sm">Versión 9.5 Pro - Estable.</p>
                    </div>
                    <i data-lucide="activity" class="text-blue-500 w-12 h-12 opacity-50"></i>
                </div>
            </section>

            <section id="view-services" class="hidden animate__animated animate__fadeIn">
                <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>

            <section id="view-customers" class="hidden animate__animated animate__fadeIn">
                <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                            <tr><th class="p-5">Nombre</th><th class="p-5">Vehículo</th><th class="p-5">Placa</th></tr>
                        </thead>
                        <tbody id="customers-list" class="text-sm"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Modal Formulario -->
    <div id="modal-form" class="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-[2.5rem] shadow-2xl flex flex-col md:flex-row overflow-hidden max-h-[90vh]">
            <div class="flex-1 p-8 overflow-y-auto">
                <h3 class="text-2xl font-black mb-6">Registro de Servicio</h3>
                <form id="master-form" class="space-y-4">
                    <input type="hidden" id="f-id">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input type="text" id="f-name" required placeholder="Nombre del Cliente" class="w-full p-4 bg-slate-50 rounded-xl border-none font-bold outline-none focus:ring-2 focus:ring-blue-500">
                        <input type="tel" id="f-phone" required placeholder="Teléfono" class="w-full p-4 bg-slate-50 rounded-xl border-none font-bold outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <input type="text" id="f-car" required placeholder="Marca/Modelo" class="w-full p-4 bg-slate-50 rounded-xl border-none outline-none">
                        <input type="text" id="f-plate" required oninput="searchVehicleHistory(this.value)" placeholder="PLACA" class="w-full p-4 bg-slate-900 text-blue-400 rounded-xl font-black text-center text-xl uppercase outline-none">
                        <input type="number" id="f-km" required placeholder="Kilometraje" class="w-full p-4 bg-slate-50 rounded-xl border-none outline-none">
                    </div>
                    <textarea id="f-work" required rows="3" placeholder="Descripción del trabajo..." class="w-full p-4 bg-blue-50/50 border-2 border-dashed border-blue-100 rounded-xl outline-none focus:border-blue-500"></textarea>
                    <div class="p-6 bg-slate-950 rounded-2xl flex justify-between items-center text-white">
                        <span class="text-[10px] font-black uppercase text-blue-500">Costo Estimado</span>
                        <input type="number" id="f-price" required class="bg-transparent text-white font-black text-3xl text-right w-40 outline-none">
                    </div>
                    <div class="flex gap-3 pt-4">
                        <button type="button" onclick="closeForm()" class="flex-1 py-4 bg-slate-100 rounded-xl font-black uppercase text-[10px]">Cerrar</button>
                        <button type="submit" class="flex-[2] py-4 bg-blue-600 text-white rounded-xl font-black uppercase text-[10px]">Guardar Orden</button>
                    </div>
                </form>
            </div>
            <div class="hidden md:flex flex-col w-72 bg-slate-50 p-6 overflow-y-auto border-l">
                <h4 class="text-[10px] font-black uppercase text-slate-400 mb-4 flex items-center gap-2">
                    <i data-lucide="history" class="w-3 h-3"></i> Historial Pasado
                </h4>
                <div id="history-container" class="space-y-3">
                    <p class="text-[10px] text-slate-300 italic text-center py-10">Ingresa una placa...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Recibo -->
    <div id="modal-receipt" class="fixed inset-0 z-[70] bg-slate-950/90 hidden items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[2rem] shadow-2xl max-w-sm w-full">
            <div id="receipt-body" class="text-center"></div>
            <div class="mt-6 flex gap-2">
                <button onclick="window.print()" class="flex-1 bg-slate-900 text-white py-3 rounded-xl font-black text-[10px] uppercase">PDF</button>
                <button onclick="document.getElementById('modal-receipt').classList.replace('flex', 'hidden')" class="flex-1 bg-slate-100 py-3 rounded-xl font-black text-[10px] uppercase">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        const currency = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 });

        function switchTab(tab) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white', 'active');
                b.classList.add('hover:bg-white/5', 'text-slate-400');
            });
            const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(b => b.getAttribute('onclick').includes(tab));
            if (activeBtn) {
                activeBtn.classList.add('bg-blue-600', 'text-white', 'active');
                activeBtn.classList.remove('hover:bg-white/5', 'text-slate-400');
            }
            if (window.innerWidth < 1024) toggleSidebar();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function searchVehicleHistory(plate) {
            const p = plate.toUpperCase().trim();
            const container = document.getElementById('history-container');
            
            if (p.length < 3) {
                container.innerHTML = '<p class="text-[10px] text-slate-300 italic text-center py-10">Ingresa una placa...</p>';
                return;
            }

            const past = (window.appState.services || []).filter(s => s.plate === p);
            if (past.length === 0) {
                container.innerHTML = '<p class="text-[10px] text-slate-400 font-bold text-center py-10">SIN REGISTROS PREVIOS</p>';
                return;
            }

            if (!document.getElementById('f-id').value) {
                document.getElementById('f-name').value = past[0].name;
                document.getElementById('f-phone').value = past[0].phone;
                document.getElementById('f-car').value = past[0].car;
            }

            container.innerHTML = past.map(w => `
                <div class="history-item">
                    <p class="font-black text-blue-600 mb-1">${new Date(w.createdAt).toLocaleDateString()}</p>
                    <p class="text-slate-700 leading-tight">${w.work}</p>
                    <div class="flex justify-between mt-2 text-[9px] font-bold text-slate-400">
                        <span>${w.km.toLocaleString()} KM</span>
                        <span>${currency.format(w.price)}</span>
                    </div>
                </div>
            `).join('');
        }

        window.renderUI = () => {
            const s = window.appState.services || [];
            
            document.getElementById('stat-paid').innerText = currency.format(s.reduce((a, c) => a + (c.status === 'paid' ? c.price : 0), 0));
            document.getElementById('stat-pending').innerText = s.filter(i => i.status === 'pending').length;
            document.getElementById('stat-total').innerText = s.length;

            const grid = document.getElementById('services-grid');
            grid.innerHTML = '';
            s.forEach(item => {
                const badge = { pending: 'text-amber-500 bg-amber-50', completed: 'text-blue-500 bg-blue-50', paid: 'text-emerald-500 bg-emerald-50' }[item.status];
                const card = document.createElement('div');
                card.className = "card-service p-6 rounded-2xl";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="bg-slate-900 text-blue-400 px-3 py-1 rounded-lg font-black text-[10px]">${item.plate}</span>
                        <span class="text-[8px] font-black uppercase px-2 py-1 rounded-full ${badge}">${item.status}</span>
                    </div>
                    <h4 class="font-black text-slate-800">${item.name}</h4>
                    <p class="text-[9px] font-bold text-slate-400 uppercase mb-4">${item.car} • ${item.km.toLocaleString()} KM</p>
                    <div class="bg-slate-50 p-3 rounded-xl mb-4 text-[11px] text-slate-600 italic line-clamp-2">"${item.work}"</div>
                    <div class="flex justify-between items-center pt-4 border-t border-slate-50">
                        <p class="font-black text-lg">${currency.format(item.price)}</p>
                        <div class="flex gap-1">
                            <button onclick="showReceipt('${item.id}')" class="p-2 text-slate-400 hover:text-blue-500"><i data-lucide="printer" class="w-4 h-4"></i></button>
                            <button onclick="advanceStatus('${item.id}', '${item.status}')" class="p-2 bg-slate-900 text-white rounded-lg"><i data-lucide="arrow-right" class="w-4 h-4"></i></button>
                            <button onclick="window.dbActions.delete('${item.id}')" class="p-2 text-red-300 hover:text-red-500"><i data-lucide="trash" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            const list = document.getElementById('customers-list');
            list.innerHTML = '';
            const unique = [];
            s.forEach(x => { if(!unique.find(u => u.phone === x.phone)) unique.push(x); });
            unique.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-5 font-bold">${c.name}</td><td class="p-5 text-slate-500">${c.car}</td><td class="p-5 font-mono text-blue-600">${c.plate}</td>`;
                list.appendChild(tr);
            });

            lucide.createIcons();
        };

        function advanceStatus(id, current) {
            const flow = { pending: 'completed', completed: 'paid', paid: 'pending' };
            window.dbActions.status(id, flow[current]);
        }

        function openForm() { 
            document.getElementById('master-form').reset(); 
            document.getElementById('f-id').value = '';
            document.getElementById('history-container').innerHTML = '<p class="text-[10px] text-slate-300 italic text-center py-10">Ingresa una placa...</p>';
            document.getElementById('modal-form').classList.replace('hidden', 'flex'); 
        }

        function closeForm() { document.getElementById('modal-form').classList.replace('flex', 'hidden'); }

        document.getElementById('master-form').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                id: document.getElementById('f-id').value || null,
                name: document.getElementById('f-name').value,
                phone: document.getElementById('f-phone').value,
                car: document.getElementById('f-car').value,
                plate: document.getElementById('f-plate').value.toUpperCase().trim(),
                km: parseInt(document.getElementById('f-km').value),
                work: document.getElementById('f-work').value,
                price: parseFloat(document.getElementById('f-price').value)
            };
            await window.dbActions.save(data);
            closeForm();
        };

        function showReceipt(id) {
            const s = window.appState.services.find(x => x.id === id);
            if (!s) return;
            document.getElementById('receipt-body').innerHTML = `
                <h3 class="logo-font text-xl mb-1">MASTER-MEC</h3>
                <p class="text-[8px] font-bold text-blue-500 uppercase tracking-widest mb-6">Comprobante de Servicio</p>
                <div class="text-left text-xs space-y-2 border-t pt-4">
                    <p><b>FECHA:</b> ${new Date(s.createdAt).toLocaleDateString()}</p>
                    <p><b>CLIENTE:</b> ${s.name.toUpperCase()}</p>
                    <p><b>VEHÍCULO:</b> ${s.car.toUpperCase()} [${s.plate}]</p>
                    <p><b>KM:</b> ${s.km.toLocaleString()}</p>
                    <div class="bg-slate-50 p-3 rounded-lg mt-4">
                        <p class="text-[9px] font-black text-slate-400 mb-1 uppercase">Trabajo Realizado</p>
                        <p class="italic text-slate-600">${s.work}</p>
                    </div>
                    <div class="pt-4 flex justify-between items-center">
                        <span class="font-black text-base">TOTAL PAGADO</span>
                        <span class="font-black text-lg text-blue-600">${currency.format(s.price)}</span>
                    </div>
                </div>
            `;
            document.getElementById('modal-receipt').classList.replace('hidden', 'flex');
        }

        // Ejecutar inmediatamente para asegurar iconos iniciales si carga lento
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            window.renderUI(); // Renderizar datos locales de inmediato
        });
    </script>
</body>
</html>
