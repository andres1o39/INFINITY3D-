<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master-Mec Pro V9.0 | Backup & Cloud</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #2563eb; --accent: #f59e0b; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .logo-font { font-family: 'Orbitron', sans-serif; }
        .bg-pattern { background-image: radial-gradient(#cbd5e1 0.8px, transparent 0.8px); background-size: 24px 24px; }
        .hex-icon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
        .card-neo { background: white; border: 1px solid white; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        .btn-main { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .input-mecanic { background-color: #f8fafc; border: 2px solid #e2e8f0; border-radius: 1rem; padding: 1rem; font-weight: 600; width: 100%; }
        .input-mecanic:focus { border-color: var(--primary); outline: none; background-color: #fff; }
        
        /* Animación de Guardado */
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        .sync-active { animation: pulse-green 2s infinite; }
    </style>
</head>
<body class="bg-pattern min-h-screen pb-32">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, updateDoc, deleteDoc, 
            doc, onSnapshot, query, orderBy, serverTimestamp, setDoc 
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBo2bZYaXmYAGML1YL8X3ru-mDMs4LIwU0",
            authDomain: "servidor-de-mecanic.firebaseapp.com",
            projectId: "servidor-de-mecanic",
            storageBucket: "servidor-de-mecanic.firebasestorage.app",
            messagingSenderId: "482393370095",
            appId: "1:482393370095:web:a036033b962916c8669a1a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "servicios_v9");

        let APP_DATA = JSON.parse(localStorage.getItem('MEC_MASTER_DATA')) || [];
        let CURRENT_FILTER = 'all';

        const toast = (title, icon = 'success') => {
            Swal.fire({ title, icon, toast: true, position: 'top', showConfirmButton: false, timer: 2000 });
        };

        // --- EXPORTAR TODO (BACKUP) ---
        window.exportData = () => {
            const dataStr = JSON.stringify(APP_DATA, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = `BACKUP_MECANIC_${new Date().toLocaleDateString()}.json`;

            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            toast("Archivo de Respaldo Creado");
        };

        // --- IMPORTAR TODO (RESTAURAR) ---
        window.importData = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.readAsText(file, 'UTF-8');
                reader.onload = async readerEvent => {
                    try {
                        const content = JSON.parse(readerEvent.target.result);
                        if(Array.isArray(content)) {
                            Swal.fire({
                                title: 'Restaurando...',
                                text: 'Subiendo datos a la nube, espera un momento.',
                                allowOutsideClick: false,
                                didOpen: () => { Swal.showLoading(); }
                            });

                            // Subir cada item a Firebase
                            for (const item of content) {
                                const { id, ...cleanData } = item;
                                // Re-limpiar timestamps para Firebase
                                cleanData.updatedAt = serverTimestamp();
                                if(id) {
                                    await setDoc(doc(db, "servicios_v9", id), cleanData);
                                } else {
                                    await addDoc(colRef, cleanData);
                                }
                            }
                            
                            Swal.close();
                            toast("¡Datos Restaurados con Éxito!");
                        }
                    } catch (err) {
                        toast("Archivo inválido", "error");
                    }
                }
            }
            input.click();
        };

        // --- INICIO Y SINCRONIZACIÓN ---
        window.startApp = () => {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('main-content').classList.remove('hidden');
            syncCloud();
            lucide.createIcons();
        };

        function syncCloud() {
            const q = query(colRef, orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                APP_DATA = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                localStorage.setItem('MEC_MASTER_DATA', JSON.stringify(APP_DATA));
                
                document.getElementById('cloud-status').innerText = "Cloud Online";
                document.getElementById('indicator').classList.add('bg-green-500', 'sync-active');
                
                updateUI();
            }, (err) => {
                document.getElementById('cloud-status').innerText = "Modo Local";
                document.getElementById('indicator').classList.add('bg-amber-500');
                updateUI();
            });
        }

        window.saveRecord = async (e) => {
            e.preventDefault();
            const id = document.getElementById('f-id').value;
            const btn = e.submitter;
            btn.disabled = true;

            const docData = {
                client: document.getElementById('f-client').value,
                phone: document.getElementById('f-phone').value,
                car: document.getElementById('f-car').value,
                plate: document.getElementById('f-plate').value.toUpperCase(),
                work: document.getElementById('f-work').value,
                price: parseFloat(document.getElementById('f-price').value) || 0,
                priority: document.getElementById('f-priority').value,
                updatedAt: serverTimestamp()
            };

            try {
                if(id) {
                    await updateDoc(doc(db, "servicios_v9", id), docData);
                } else {
                    docData.status = 'pending';
                    docData.createdAt = serverTimestamp();
                    await addDoc(colRef, docData);
                }
                closeModal();
                toast("Guardado");
            } catch (err) { toast("Error Nube", "error"); }
            btn.disabled = false;
        };

        window.deleteRecord = async (id) => {
            const res = await Swal.fire({
                title: '¿Borrar de Nube?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, borrar'
            });
            if(res.isConfirmed) await deleteDoc(doc(db, "servicios_v9", id));
        };

        window.toggleStatus = async (id, current) => {
            const next = current === 'paid' ? 'pending' : 'paid';
            await updateDoc(doc(db, "servicios_v9", id), { status: next });
        };

        function updateUI() {
            const money = APP_DATA.filter(i => i.status === 'pending').reduce((a, b) => a + (b.price || 0), 0);
            document.getElementById('stat-money').innerText = `$${money.toLocaleString()}`;
            document.getElementById('stat-count').innerText = APP_DATA.length;
            renderCards();
        }

        window.renderCards = () => {
            const container = document.getElementById('cards');
            const search = document.getElementById('search').value.toLowerCase();
            container.innerHTML = '';

            let list = APP_DATA.filter(i => (i.client||'').toLowerCase().includes(search) || (i.plate||'').toLowerCase().includes(search));
            if(CURRENT_FILTER !== 'all') list = list.filter(i => i.status === CURRENT_FILTER);

            list.forEach(i => {
                const card = document.createElement('div');
                card.className = "card-neo rounded-[2rem] p-5 border-l-4 " + (i.priority === 'Urgente' ? 'border-red-500' : 'border-blue-500');
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h4 class="font-black text-slate-800 uppercase leading-none">${i.client}</h4>
                            <p class="text-[10px] font-bold text-blue-600 mt-1">${i.car} • ${i.plate}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[7px] font-black text-amber-500 uppercase">Presupuesto Est.</p>
                            <p class="text-lg font-black">$${(i.price||0).toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl mb-4 text-[11px] font-semibold text-slate-500 italic">"${i.work}"</div>
                    <div class="flex gap-2">
                        <button onclick="toggleStatus('${i.id}', '${i.status}')" class="flex-1 py-3 rounded-xl text-[9px] font-black uppercase ${i.status === 'paid' ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-400'}">
                            ${i.status === 'paid' ? 'PAGADO' : 'PENDIENTE'}
                        </button>
                        <button onclick="editMode('${i.id}')" class="p-3 bg-slate-100 rounded-xl"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="deleteRecord('${i.id}')" class="p-3 bg-red-50 text-red-500 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        };

        window.editMode = (id) => {
            const i = APP_DATA.find(x => x.id === id);
            document.getElementById('f-id').value = i.id;
            document.getElementById('f-client').value = i.client;
            document.getElementById('f-phone').value = i.phone;
            document.getElementById('f-car').value = i.car;
            document.getElementById('f-plate').value = i.plate;
            document.getElementById('f-work').value = i.work;
            document.getElementById('f-price').value = i.price;
            document.getElementById('f-priority').value = i.priority;
            openModal();
        };

        window.openModal = () => document.getElementById('modal').classList.replace('hidden', 'flex');
        window.closeModal = () => { document.getElementById('modal').classList.replace('flex', 'hidden'); document.getElementById('main-form').reset(); };
        window.setFilter = (f) => { CURRENT_FILTER = f; renderCards(); };
    </script>

    <div id="splash" class="fixed inset-0 z-[300] bg-slate-900 flex flex-col items-center justify-center p-10">
        <div class="w-20 h-20 bg-blue-600 hex-icon flex items-center justify-center mb-6 shadow-2xl shadow-blue-500/50">
            <i data-lucide="shield-check" class="w-10 h-10 text-white"></i>
        </div>
        <h1 class="logo-font text-xl text-white tracking-widest">MASTER-MEC V9</h1>
        <p class="text-[8px] text-blue-400 font-black uppercase mt-2 tracking-[0.4em]">Backup & Recovery System</p>
        <button onclick="startApp()" class="mt-12 w-full max-w-xs bg-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">Iniciar Sistema</button>
    </div>

    <div id="main-content" class="hidden">
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b p-4">
            <div class="max-w-4xl mx-auto flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div id="indicator" class="w-2 h-2 rounded-full bg-slate-300"></div>
                        <h2 id="cloud-status" class="text-[9px] font-black uppercase text-slate-400 tracking-widest">Conectando...</h2>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="exportData()" class="p-2 bg-slate-100 rounded-lg text-slate-600" title="Respaldar todo">
                            <i data-lucide="download-cloud" class="w-4 h-4"></i>
                        </button>
                        <button onclick="importData()" class="p-2 bg-slate-100 rounded-lg text-slate-600" title="Restaurar backup">
                            <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                        </button>
                        <button onclick="openModal()" class="btn-main text-white px-5 py-2.5 rounded-xl font-black text-[9px] uppercase tracking-tighter">
                            + NUEVO
                        </button>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-900 p-4 rounded-[1.5rem] text-white">
                        <p class="text-[7px] font-black text-amber-400 uppercase tracking-widest">Est. Pendiente</p>
                        <h3 id="stat-money" class="text-xl font-black">$0</h3>
                    </div>
                    <div class="bg-white p-4 rounded-[1.5rem] border shadow-sm">
                        <p class="text-[7px] font-black text-slate-400 uppercase tracking-widest">Historial Total</p>
                        <h3 id="stat-count" class="text-xl font-black">0</h3>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto p-4 space-y-6">
            <input type="text" id="search" onkeyup="renderCards()" placeholder="Buscar placa o cliente..." class="w-full p-5 rounded-2xl border-none shadow-lg outline-none font-bold text-slate-600">
            <div id="cards" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </main>
    </div>

    <div id="modal" class="fixed inset-0 z-[200] bg-slate-900/90 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-[2.5rem] p-8 flex flex-col max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="font-black uppercase text-xs">Ficha de Servicio</h3>
                <button onclick="closeModal()"><i data-lucide="x"></i></button>
            </div>
            <form id="main-form" onsubmit="saveRecord(event)" class="space-y-4">
                <input type="hidden" id="f-id">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="f-client" placeholder="Cliente" required class="input-mecanic text-xs">
                    <input type="tel" id="f-phone" placeholder="Celular" class="input-mecanic text-xs">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="f-car" placeholder="Vehículo" required class="input-mecanic text-xs">
                    <input type="text" id="f-plate" placeholder="Placa" required class="input-mecanic text-xs uppercase text-center font-mono">
                </div>
                <textarea id="f-work" placeholder="Trabajo a realizar" required rows="3" class="input-mecanic text-xs"></textarea>
                <div class="grid grid-cols-2 gap-4 items-center">
                    <select id="f-priority" class="input-mecanic text-xs">
                        <option value="Normal">Normal</option>
                        <option value="Urgente">Urgente 🔴</option>
                    </select>
                    <div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center">
                        <span class="text-amber-500 font-black text-[8px] uppercase">Presupuesto $</span>
                        <input type="number" id="f-price" required class="bg-transparent text-white font-black text-right w-20 outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full py-5 bg-blue-600 text-white font-black rounded-2xl uppercase text-[10px] tracking-widest shadow-xl">Confirmar y Sincronizar</button>
            </form>
        </div>
    </div>

    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 flex gap-4 bg-white/90 backdrop-blur-md p-2 rounded-full border shadow-2xl">
        <button onclick="setFilter('all')" class="p-4 rounded-full hover:bg-slate-100"><i data-lucide="layout-grid" class="w-5 h-5"></i></button>
        <button onclick="setFilter('pending')" class="p-4 rounded-full hover:bg-slate-100 text-amber-500"><i data-lucide="clock" class="w-5 h-5"></i></button>
        <button onclick="setFilter('paid')" class="p-4 rounded-full hover:bg-slate-100 text-green-500"><i data-lucide="check-circle" class="w-5 h-5"></i></button>
    </div>

</body>
</html>
