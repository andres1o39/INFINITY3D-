<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini AI Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080c10; --surface: #0d1117; --border: #1a2233;
      --accent: #4f8ef7; --accent2: #a78bfa; --green: #34d399;
      --text: #dde6f0; --muted: #4a5568;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Mono', monospace; font-size: 14px;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 5%, rgba(79,142,247,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 85% 95%, rgba(167,139,250,0.07) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    .grain {
      position: fixed; inset: 0; opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px; pointer-events: none; z-index: 1;
    }
    .app {
      position: relative; z-index: 2; width: 100%; max-width: 760px;
      height: 100vh; display: flex; flex-direction: column; padding: 0 16px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 26px 0 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 36px; height: 36px; border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      animation: pulse-border 4s ease-in-out infinite;
    }
    @keyframes pulse-border {
      0%,100% { box-shadow: 0 0 0 0 rgba(79,142,247,0); }
      50% { box-shadow: 0 0 14px 2px rgba(79,142,247,0.2); }
    }
    .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.03em; }
    .logo-text span { color: var(--accent); }
    .model-badge {
      font-size: 10px; letter-spacing: 0.1em; color: var(--muted);
      border: 1px solid var(--border); padding: 4px 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: blink 2.5s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }
    .messages {
      flex: 1; overflow-y: auto; padding: 28px 0 16px;
      display: flex; flex-direction: column; scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); }
    .message {
      display: flex; gap: 14px; padding: 18px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.3s ease both;
    }
    .message:last-child { border-bottom: none; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .msg-avatar {
      width: 28px; height: 28px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 10px;
      letter-spacing: 0.05em; margin-top: 2px;
    }
    .message.user .msg-avatar { border: 1px solid var(--accent2); color: var(--accent2); }
    .message.ai .msg-avatar { border: 1px solid var(--accent); color: var(--accent); }
    .msg-content { flex: 1; min-width: 0; }
    .msg-label {
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
    }
    .message.user .msg-label { color: var(--accent2); }
    .message.ai .msg-label { color: var(--accent); }
    .msg-time { color: var(--muted); font-size: 10px; text-transform: none; letter-spacing: 0.04em; }
    .msg-text { color: var(--text); line-height: 1.78; white-space: pre-wrap; word-break: break-word; }
    .msg-text strong { color: #fff; font-weight: 600; }
    .msg-text code { background: #1a2233; padding: 1px 6px; border-radius: 2px; font-size: 12.5px; color: var(--green); }
    .msg-text pre { background: #0d1117; border: 1px solid var(--border); padding: 14px 16px; margin: 10px 0; overflow-x: auto; }
    .msg-text pre code { background: none; padding: 0; color: #a5d6a7; }
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 40px 0;
    }
    .empty-icon { width: 54px; height: 54px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
    .empty-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; color: rgba(221,230,240,0.45); }
    .empty-sub { font-size: 12px; max-width: 280px; line-height: 1.7; color: var(--muted); }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
    .sugg-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); font-family: 'DM Mono', monospace;
      font-size: 11px; padding: 7px 14px; cursor: pointer; transition: all 0.2s;
    }
    .sugg-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.05); }
    .input-area { padding: 14px 0 26px; flex-shrink: 0; border-top: 1px solid var(--border); }
    .error { color: #f87171; font-size: 12px; padding: 9px 14px; border: 1px solid rgba(248,113,113,0.3); background: rgba(248,113,113,0.05); margin-bottom: 10px; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    .input-wrap { flex: 1; border: 1px solid var(--border); background: var(--surface); transition: border-color 0.2s; }
    .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(79,142,247,0.1); }
    textarea {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--text); font-family: 'DM Mono', monospace; font-size: 13.5px;
      line-height: 1.6; padding: 13px 16px; resize: none; min-height: 50px; max-height: 180px; display: block;
    }
    textarea::placeholder { color: var(--muted); }
    .send-btn {
      width: 50px; height: 50px; background: var(--accent); border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .send-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .send-btn svg { color: #080c10; }
    .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing-dots span { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s ease-in-out infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform:translateY(0); opacity:0.35; } 30% { transform:translateY(-5px); opacity:1; } }
    .hint { margin-top: 9px; font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-align: center; }
    .hint kbd { border: 1px solid var(--border); padding: 1px 5px; font-family: 'DM Mono', monospace; }
  </style>
</head>
<body>
<div class="grain"></div>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <div class="logo-text">GEMINI<span>.</span>CHAT</div>
    </div>
    <div class="model-badge">
      <div class="badge-dot"></div>
      GEMINI 2.0 FLASH
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.2">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
        </svg>
      </div>
      <div class="empty-title">¿En qué te ayudo hoy?</div>
      <div class="empty-sub">Powered by Google Gemini 2.0 Flash</div>
      <div class="suggestions">
        <button class="sugg-btn" onclick="suggest('¿Qué puedes hacer?')">¿Qué puedes hacer?</button>
        <button class="sugg-btn" onclick="suggest('Explícame la inteligencia artificial')">¿Qué es la IA?</button>
        <button class="sugg-btn" onclick="suggest('Escribe un poema corto sobre tecnología')">Poema</button>
        <button class="sugg-btn" onclick="suggest('Dame ideas para un proyecto web creativo')">Ideas web</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div id="errorBox" class="error" style="display:none"></div>
    <div class="input-row">
      <div class="input-wrap">
        <textarea id="input" placeholder="Escribe tu mensaje..." rows="1"
          onkeydown="handleKey(event)" oninput="resize(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="hint"><kbd>Enter</kbd> enviar · <kbd>Shift+Enter</kbd> nueva línea</div>
  </div>
</div>

<script>
  const API_KEY = 'AIzaSyAKowdAGu1nmgAveGsXcTCNeNETkQ6AjdY';
  const MODEL = 'gemini-2.0-flash';
  let history = [];
  let busy = false;

  function suggest(text) {
    document.getElementById('input').value = text;
    resize(document.getElementById('input'));
    send();
  }

  function resize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 180) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function showError(msg) {
    const el = document.getElementById('errorBox');
    el.style.display = msg ? 'block' : 'none';
    el.textContent = msg;
  }

  function now() {
    return new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  }

  function renderMarkdown(text) {
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  function addMsg(role, content, typing = false) {
    const empty = document.getElementById('emptyState');
    if (empty) empty.remove();
    const wrap = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = `message ${role}`;
    if (typing) el.id = 'typing';
    el.innerHTML = `
      <div class="msg-avatar">${role === 'user' ? 'YOU' : 'AI'}</div>
      <div class="msg-content">
        <div class="msg-label">
          ${role === 'user' ? 'TÚ' : 'GEMINI'}
          <span class="msg-time">${now()}</span>
        </div>
        <div class="msg-text">${typing
          ? '<div class="typing-dots"><span></span><span></span><span></span></div>'
          : renderMarkdown(content)
        }</div>
      </div>`;
    wrap.appendChild(el);
    wrap.scrollTop = wrap.scrollHeight;
    return el;
  }

  async function send() {
    if (busy) return;
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    busy = true;
    document.getElementById('sendBtn').disabled = true;
    input.value = '';
    input.style.height = 'auto';
    showError('');

    history.push({ role: 'user', parts: [{ text }] });
    addMsg('user', text);
    const typingEl = addMsg('ai', '', true);

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: 'Eres un asistente IA amigable y útil. Responde siempre en el idioma del usuario. Puedes usar markdown para formatear.' }] },
          contents: history
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `Error ${res.status}`);
      }

      const data = await res.json();
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '(Sin respuesta)';
      history.push({ role: 'model', parts: [{ text: reply }] });
      typingEl.querySelector('.msg-text').innerHTML = renderMarkdown(reply);
      typingEl.id = '';

    } catch (err) {
      typingEl.remove();
      history.pop();
      showError('Error: ' + err.message);
    } finally {
      busy = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('messages').scrollTop = 9999;
    }
  }
</script>
</body>
</html>
