<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini OS Simulator</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --taskbar-color: rgba(0, 0, 0, 0.8);
            --accent-color: #3498db;
            --window-bg: #ecf0f1;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
        }

        /* Escritorio */
        #desktop {
            height: calc(100% - 45px);
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 100px);
            grid-template-rows: repeat(auto-fill, 100px);
            grid-gap: 20px;
            align-content: start;
        }

        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            cursor: pointer;
            text-shadow: 1px 1px 3px black;
            transition: 0.2s;
        }

        .icon:hover { background: rgba(255,255,255,0.2); border-radius: 5px; }

        .icon img { width: 50px; height: 50px; margin-bottom: 5px; }

        /* Ventanas */
        .window {
            position: absolute;
            width: 400px;
            height: 300px;
            background: var(--window-bg);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
            resize: both;
        }

        .window-header {
            background: #bdc3c7;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .close-btn { color: red; cursor: pointer; font-weight: bold; }

        .window-content { padding: 15px; flex-grow: 1; overflow: auto; }

        /* Barra de Tareas */
        #taskbar {
            height: 45px;
            background: var(--taskbar-color);
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 10px;
            backdrop-filter: blur(5px);
        }

        .start-btn {
            background: var(--accent-color);
            border: none;
            color: white;
            padding: 5px 15px;
            border-radius: 4px;
            margin-right: 15px;
            cursor: pointer;
        }

        #clock { color: white; margin-left: auto; padding-right: 20px; }
    </style>
</head>
<body>

<div id="desktop">
    <div class="icon" onclick="openWindow('win-docs')">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968517.png" alt="Docs">
        <span>Documentos</span>
    </div>
    <div class="icon" onclick="openWindow('win-settings')">
        <img src="https://cdn-icons-png.flaticon.com/512/3524/3524659.png" alt="Config">
        <span>Ajustes</span>
    </div>
</div>

<div id="win-docs" class="window">
    <div class="window-header">
        <span>📁 Mis Documentos</span>
        <span class="close-btn" onclick="closeWindow('win-docs')">✖</span>
    </div>
    <div class="window-content">
        <p>Bienvenido al simulador. Aquí podrías listar archivos.</p>
        <ul>
            <li>proyecto_secreto.txt</li>
            <li>vacaciones.jpg</li>
        </ul>
    </div>
</div>

<div id="win-settings" class="window">
    <div class="window-header">
        <span>⚙️ Configuración</span>
        <span class="close-btn" onclick="closeWindow('win-settings')">✖</span>
    </div>
    <div class="window-content">
        <label>Color de acento:</label>
        <input type="color" onchange="document.documentElement.style.setProperty('--accent-color', this.value)">
        <p>Versión del sistema: 1.0.2-Gemini</p>
    </div>
</div>

<div id="taskbar">
    <button class="start-btn">Inicio</button>
    <div id="clock">00:00:00</div>
</div>

<script>
    // Reloj
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Lógica de ventanas
    function openWindow(id) {
        const win = document.getElementById(id);
        win.style.display = 'flex';
        win.style.top = '100px';
        win.style.left = '100px';
        win.style.zIndex = 10;
    }

    function closeWindow(id) {
        document.getElementById(id).style.display = 'none';
    }

    // Hacer las ventanas arrastrables (Básico)
    const windows = document.querySelectorAll('.window');
    windows.forEach(win => {
        const header = win.querySelector('.window-header');
        header.onmousedown = function(e) {
            let shiftX = e.clientX - win.getBoundingClientRect().left;
            let shiftY = e.clientY - win.getBoundingClientRect().top;

            function moveAt(pageX, pageY) {
                win.style.left = pageX - shiftX + 'px';
                win.style.top = pageY - shiftY + 'px';
            }

            function onMouseMove(e) { moveAt(e.pageX, e.pageY); }
            document.addEventListener('mousemove', onMouseMove);
            document.onmouseup = function() {
                document.removeEventListener('mousemove', onMouseMove);
                document.onmouseup = null;
            };
        };
    });
</script>

</body>
</html>
