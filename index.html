<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini OS v2</title>
    <style>
        :root {
            --primary: #2980b9;
            --taskbar: rgba(20, 20, 20, 0.9);
        }
        body { 
            margin: 0; font-family: sans-serif; height: 100vh; overflow: hidden;
            background: url('https://images.unsplash.com/photo-1477346611705-65d1883cee1e?auto=format&fit=crop&w=1350&q=80') no-repeat center center;
            background-size: cover;
        }
        
        /* Escritorio */
        #desktop { width: 100%; height: calc(100% - 45px); position: relative; }

        /* Ventanas */
        .window {
            position: absolute; width: 350px; background: white; border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); display: none; flex-direction: column;
            min-width: 200px; min-height: 150px;
        }
        .window-header {
            padding: 10px; background: #eee; cursor: move; border-radius: 5px 5px 0 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .window-body { padding: 15px; flex-grow: 1; overflow-y: auto; }
        
        /* Barra de tareas */
        #taskbar {
            height: 45px; background: var(--taskbar); backdrop-filter: blur(10px);
            position: fixed; bottom: 0; width: 100%; display: flex; align-items: center; padding: 0 10px;
        }
        .btn {
            background: #34495e; color: white; border: none; padding: 8px 15px;
            margin-right: 5px; cursor: pointer; border-radius: 4px;
        }
        .btn:hover { background: var(--primary); }
    </style>
</head>
<body>

<div id="desktop">
    <div id="app-notes" class="window" style="top: 50px; left: 50px; z-index: 1;">
        <div class="window-header" onmousedown="dragElement(this.parentElement)">
            <span>📝 Bloc de Notas</span>
            <button onclick="closeApp('app-notes')">×</button>
        </div>
        <div class="window-body">
            <textarea style="width: 100%; height: 100%; border: none; outline: none;" placeholder="Escribe algo..."></textarea>
        </div>
    </div>

    <div id="app-settings" class="window" style="top: 100px; left: 100px; z-index: 1;">
        <div class="window-header" onmousedown="dragElement(this.parentElement)">
            <span>⚙️ Ajustes</span>
            <button onclick="closeApp('app-settings')">×</button>
        </div>
        <div class="window-body">
            <label>Color de fondo:</label>
            <input type="color" onchange="document.body.style.background = this.value">
        </div>
    </div>
</div>

<div id="taskbar">
    <button class="btn" style="background: #27ae60;" onclick="toggleMenu()">Inicio</button>
    <button class="btn" onclick="openApp('app-notes')">Notas</button>
    <button class="btn" onclick="openApp('app-settings')">Ajustes</button>
    <div id="clock" style="color: white; margin-left: auto; font-size: 14px;"></div>
</div>

<script>
    let highestZ = 10;

    function openApp(id) {
        const app = document.getElementById(id);
        app.style.display = 'flex';
        app.style.zIndex = ++highestZ;
    }

    function closeApp(id) {
        document.getElementById(id).style.display = 'none';
    }

    // Lógica para arrastrar (Drag and Drop)
    function dragElement(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.style.zIndex = ++highestZ;
        
        document.onmousemove = (e) => {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        };

        document.onmouseup = () => {
            document.onmousemove = null;
            document.onmouseup = null;
        };

        pos3 = window.event.clientX;
        pos4 = window.event.clientY;
    }

    // Reloj dinámico
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>

</body>
</html>
