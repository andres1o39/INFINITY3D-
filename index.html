<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FNAF HTML5 Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #gameContainer { position: relative; width: 1024px; height: 768px; margin: auto; top: 50px; border: 2px solid #333; }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        .ui-overlay { position: absolute; color: white; pointer-events: none; width: 100%; height: 100%; }
        #power { position: absolute; bottom: 20px; left: 20px; font-size: 24px; }
        #camera-btn { 
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 400px; height: 50px; background: rgba(255,255,255,0.2); 
            border: 2px solid white; cursor: pointer; pointer-events: all;
        }
        #camera-btn:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="1024" height="768"></canvas>
    <div class="ui-overlay">
        <div id="power">Energía: 100%</div>
        <div id="camera-btn" onclick="toggleCams()">MONITOR</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const pwrDisplay = document.getElementById('power');

    // Estado del Juego
    let state = {
        officePos: 0,
        isCamOpen: false,
        power: 100,
        leftDoor: false,
        rightDoor: false,
        currentCam: 1
    };

    // "Assets" (Simulados con colores para que el código funcione de inmediato)
    function drawOffice() {
        // Fondo de la oficina (Movimiento panorámico)
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Puerta Izquierda
        ctx.fillStyle = state.leftDoor ? "#444" : "#000";
        ctx.fillRect(50, 100, 100, 500);
        
        // Puerta Derecha
        ctx.fillStyle = state.rightDoor ? "#444" : "#000";
        ctx.fillRect(874, 100, 100, 500);

        // Estática ambiental (Efecto de "laptop potente" con partículas)
        drawStatic(0.05);
    }

    function drawCams() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0f0";
        ctx.font = "30px Arial";
        ctx.fillText("CÁMARA 0" + state.currentCam, 50, 50);
        drawStatic(0.2);
    }

    function drawStatic(alpha) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * alpha})`;
        for(let i=0; i<20; i++) {
            ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
        }
    }

    function toggleCams() {
        state.isCamOpen = !state.isCamOpen;
    }

    // Bucle principal
    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (state.isCamOpen) {
            drawCams();
        } else {
            drawOffice();
        }

        // Consumo de energía
        if (Math.random() > 0.99) {
            state.power -= (state.leftDoor || state.rightDoor) ? 0.5 : 0.1;
            pwrDisplay.innerText = `Energía: ${Math.floor(state.power)}%`;
        }

        requestAnimationFrame(update);
    }

    // Controles de teclado
    window.addEventListener('keydown', (e) => {
        if(e.key === 'a') state.leftDoor = !state.leftDoor;
        if(e.key === 'd') state.rightDoor = !state.rightDoor;
    });

    update();
</script>
</body>
</html>
