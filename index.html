<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master-Mec Pro V8.6 | Cloud Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        :root {
            --primary: #2563eb;
            --dark: #0f172a;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: var(--dark);
            -webkit-tap-highlight-color: transparent;
        }

        .logo-font { font-family: 'Orbitron', sans-serif; }
        
        .bg-pattern {
            background-image: radial-gradient(#cbd5e1 0.7px, transparent 0.7px);
            background-size: 24px 24px;
        }

        .hex-icon {
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            transition: all 0.3s ease;
        }

        .card-neo {
            background: white;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-neo:active { transform: scale(0.98); }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Estilo para inputs enfocados */
        input:focus, textarea:focus {
            ring: 2px;
            ring-color: var(--primary);
            outline: none;
            border-color: var(--primary);
        }

        .status-badge {
            font-size: 9px;
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 800;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-pattern min-h-screen pb-28">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, getDocs, updateDoc, 
            deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        // CONFIGURACIÓN VERIFICADA
        const firebaseConfig = {
            apiKey: "AIzaSyBo2bZYaXmYAGML1YL8X3ru-mDMs4LIwU0",
            authDomain: "servidor-de-mecanic.firebaseapp.com",
            projectId: "servidor-de-mecanic",
            storageBucket: "servidor-de-mecanic.firebasestorage.app",
            messagingSenderId: "482393370095",
            appId: "1:482393370095:web:a036033b962916c8669a1a",
            measurementId: "G-XDEV0DP3FN"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "servicios");

        // Estado Global de la App
        let APP_DATA = [];
        let FILTER = 'all';

        // --- SISTEMA DE NOTIFICACIONES ---
        const notify = (msg, icon = 'success') => {
            const Toast = Swal.mixin({
                toast: true, position: 'top-end', showConfirmButton: false,
                timer: 2000, timerProgressBar: true
            });
            Toast.fire({ icon: icon, title: msg });
        };

        // --- MANEJO DE VISTAS ---
        window.startApp = () => {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('app-main').classList.remove('hidden');
            initRealtimeSync();
            lucide.createIcons();
        };

        // --- SINCRONIZACIÓN EN TIEMPO REAL ---
        function initRealtimeSync() {
            const q = query(colRef, orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                APP_DATA = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                updateStats();
                renderUI();
            }, (error) => {
                console.error("Error Firebase:", error);
                notify("Error de conexión", "error");
            });
        }

        // --- CÁLCULO DE ESTADÍSTICAS ---
        function updateStats() {
            const totalRecaudado = APP_DATA
                .filter(i => i.status === 'paid')
                .reduce((acc, curr) => acc + (parseFloat(curr.price) || 0), 0);
            
            const pendientes = APP_DATA.filter(i => i.status === 'pending').length;

            document.getElementById('stat-money').innerText = `$${totalRecaudado.toLocaleString()}`;
            document.getElementById('stat-pending').innerText = pendientes;
        }

        // --- OPERACIONES CRUD ---
        window.saveService = async (e) => {
            e.preventDefault();
            const id = document.getElementById('f-id').value;
            const btn = e.submitter;
            btn.disabled = true;
            btn.innerHTML = `<div class="loader"></div>`;

            const payload = {
                client: document.getElementById('f-client').value,
                phone: document.getElementById('f-phone').value,
                vehicle: document.getElementById('f-vehicle').value,
                plate: document.getElementById('f-plate').value.toUpperCase(),
                km: document.getElementById('f-km').value,
                work: document.getElementById('f-work').value,
                past: document.getElementById('f-past').value,
                price: parseFloat(document.getElementById('f-price').value) || 0,
                priority: document.getElementById('f-priority').value,
                updatedAt: serverTimestamp()
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "servicios", id), payload);
                    notify("Actualizado correctamente");
                } else {
                    payload.status = 'pending';
                    payload.createdAt = serverTimestamp();
                    await addDoc(colRef, payload);
                    notify("Servicio registrado");
                }
                closeModal();
            } catch (err) {
                notify("Error al guardar", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "GUARDAR REGISTRO";
            }
        };

        window.deleteService = async (id) => {
            const result = await Swal.fire({
                title: '¿Eliminar registro?',
                text: "Esta acción no se puede deshacer en la nube",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Sí, eliminar'
            });

            if (result.isConfirmed) {
                await deleteDoc(doc(db, "servicios", id));
                notify("Eliminado");
            }
        };

        window.toggleStatus = async (id, current) => {
            const newStatus = current === 'paid' ? 'pending' : 'paid';
            await updateDoc(doc(db, "servicios", id), { status: newStatus });
            notify("Estado actualizado");
        };

        // --- RENDERIZADO DE INTERFAZ ---
        window.renderUI = () => {
            const container = document.getElementById('services-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            container.innerHTML = '';

            let list = APP_DATA.filter(i => 
                i.client.toLowerCase().includes(search) || 
                i.plate.toLowerCase().includes(search)
            );

            if (FILTER !== 'all') list = list.filter(i => i.status === FILTER);

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-20 text-center">
                        <i data-lucide="layers" class="mx-auto w-12 h-12 text-slate-300 mb-4"></i>
                        <p class="text-slate-400 font-bold uppercase text-xs tracking-widest">No se encontraron registros</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            list.forEach(item => {
                const isPaid = item.status === 'paid';
                const card = document.createElement('div');
                card.className = "card-neo rounded-[2rem] p-6 relative overflow-hidden border-l-4 " + 
                                (item.priority === 'Urgente' ? 'border-red-500' : 'border-blue-500');
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <div class="flex gap-2 mb-2">
                                <span class="status-badge ${isPaid ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                                    ${isPaid ? 'Pagado' : 'Pendiente'}
                                </span>
                                <span class="status-badge bg-slate-100 text-slate-600">${item.plate}</span>
                            </div>
                            <h3 class="font-black text-lg text-slate-800 uppercase leading-none">${item.client}</h3>
                            <p class="text-xs font-bold text-blue-600 mt-1">${item.vehicle}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Total</p>
                            <p class="text-xl font-black text-slate-900">$${item.price.toLocaleString()}</p>
                        </div>
                    </div>

                    <div class="space-y-3 mb-6">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Trabajo:</p>
                            <p class="text-xs font-semibold text-slate-700 italic">"${item.work}"</p>
                        </div>
                        ${item.km ? `
                        <div class="flex items-center gap-2 text-slate-500">
                            <i data-lucide="gauge" class="w-3.5 h-3.5"></i>
                            <span class="text-[10px] font-bold">${parseInt(item.km).toLocaleString()} Kilómetros</span>
                        </div>` : ''}
                    </div>

                    <div class="flex gap-2">
                        <button onclick="toggleStatus('${item.id}', '${item.status}')" 
                            class="flex-1 py-3 rounded-xl text-[10px] font-black uppercase transition-all flex items-center justify-center gap-2
                            ${isPaid ? 'bg-green-600 text-white shadow-lg' : 'bg-slate-100 text-slate-600 border border-slate-200'}">
                            <i data-lucide="${isPaid ? 'check-circle' : 'circle'}"></i> ${isPaid ? 'Completado' : 'Cobrar'}
                        </button>
                        <button onclick="editMode('${item.id}')" class="p-3 bg-blue-50 text-blue-600 rounded-xl border border-blue-100">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deleteService('${item.id}')" class="p-3 bg-red-50 text-red-400 rounded-xl border border-red-100">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        };

        // --- FUNCIONES DE UI ---
        window.openModal = () => {
            document.getElementById('f-id').value = '';
            document.getElementById('service-form').reset();
            document.getElementById('modal-title').innerText = "Nuevo Ingreso";
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        };

        window.closeModal = () => {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-overlay').classList.remove('flex');
        };

        window.editMode = (id) => {
            const item = APP_DATA.find(i => i.id === id);
            if (!item) return;
            document.getElementById('f-id').value = item.id;
            document.getElementById('f-client').value = item.client;
            document.getElementById('f-phone').value = item.phone;
            document.getElementById('f-vehicle').value = item.vehicle;
            document.getElementById('f-plate').value = item.plate;
            document.getElementById('f-km').value = item.km;
            document.getElementById('f-work').value = item.work;
            document.getElementById('f-past').value = item.past;
            document.getElementById('f-price').value = item.price;
            document.getElementById('f-priority').value = item.priority;

            document.getElementById('modal-title').innerText = "Editar Servicio";
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        };

        window.setFilter = (f) => {
            FILTER = f;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-lg');
                btn.classList.add('bg-white', 'text-slate-500');
            });
            document.getElementById('btn-' + f).classList.add('bg-blue-600', 'text-white', 'shadow-lg');
            renderUI();
        };
    </script>

    <div id="setup-screen" class="fixed inset-0 z-[200] bg-slate-900 flex items-center justify-center p-6">
        <div class="bg-white rounded-[3.5rem] p-10 max-w-sm w-full shadow-2xl text-center">
            <div class="w-24 h-24 mx-auto mb-8 bg-slate-900 hex-icon flex items-center justify-center shadow-2xl shadow-blue-500/40">
                <i data-lucide="gauge" class="w-10 h-10 text-blue-500"></i>
            </div>
            <h1 class="logo-font text-2xl text-slate-900 mb-2 uppercase tracking-tighter">MASTER-MEC</h1>
            <p class="text-[10px] font-black text-blue-600 uppercase tracking-[0.4em] mb-10">Cloud Verificado V8.6</p>
            
            <button onclick="startApp()" class="w-full bg-slate-900 text-white font-extrabold py-6 rounded-2xl flex items-center justify-center gap-3 transition-all hover:bg-blue-600 active:scale-95 shadow-xl uppercase text-xs tracking-widest">
                INICIAR SESIÓN <i data-lucide="shield-check" class="w-4 h-4"></i>
            </button>
            <p class="mt-6 text-[9px] text-slate-400 font-bold uppercase tracking-widest">Conectado a Firebase Firestore</p>
        </div>
    </div>

    <div id="app-main" class="hidden">
        <header class="bg-white/80 backdrop-blur-xl border-b border-slate-200 sticky top-0 z-50 p-4">
            <div class="max-w-5xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-900 hex-icon flex items-center justify-center">
                            <i data-lucide="wrench" class="w-5 h-5 text-blue-500"></i>
                        </div>
                        <div>
                            <h2 class="logo-font text-sm leading-none">MEC-PRO</h2>
                            <span class="text-[8px] font-black text-blue-600 uppercase">Administrador Nube</span>
                        </div>
                    </div>
                    <button onclick="openModal()" class="btn-primary text-white px-6 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i> Nuevo Registro
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-900 rounded-3xl p-4 text-white">
                        <p class="text-[8px] font-black text-blue-400 uppercase mb-1 tracking-widest">Recaudado (Pagados)</p>
                        <h3 id="stat-money" class="text-xl font-black tracking-tighter">$0</h3>
                    </div>
                    <div class="bg-white border border-slate-200 rounded-3xl p-4">
                        <p class="text-[8px] font-black text-slate-400 uppercase mb-1 tracking-widest">Autos en Taller</p>
                        <h3 id="stat-pending" class="text-xl font-black text-slate-800 tracking-tighter">0</h3>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-5xl mx-auto p-4 space-y-6">
            <div class="relative group">
                <input type="text" id="search-input" onkeyup="renderUI()" placeholder="Buscar cliente o placa..." 
                    class="w-full p-5 pl-14 rounded-3xl border-2 border-transparent bg-white shadow-xl shadow-slate-200/50 outline-none focus:border-blue-500 transition-all font-bold text-slate-700">
                <i data-lucide="search" class="absolute left-6 top-5 text-slate-300 group-focus-within:text-blue-500 transition-colors"></i>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                <button id="btn-all" onclick="setFilter('all')" class="filter-btn px-6 py-2.5 rounded-full bg-blue-600 text-white text-[10px] font-black uppercase tracking-widest transition-all">Todos</button>
                <button id="btn-pending" onclick="setFilter('pending')" class="filter-btn px-6 py-2.5 rounded-full bg-white text-slate-500 text-[10px] font-black uppercase tracking-widest border border-slate-200 transition-all">Pendientes</button>
                <button id="btn-paid" onclick="setFilter('paid')" class="filter-btn px-6 py-2.5 rounded-full bg-white text-slate-500 text-[10px] font-black uppercase tracking-widest border border-slate-200 transition-all">Pagados</button>
            </div>

            <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </main>
    </div>

    <div id="modal-overlay" class="fixed inset-0 z-[150] bg-slate-900/90 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-[3rem] overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
                <h3 id="modal-title" class="font-black text-slate-800 uppercase text-xs tracking-widest">Nuevo Ingreso</h3>
                <button onclick="closeModal()" class="p-2 bg-white rounded-full shadow-sm hover:text-red-500"><i data-lucide="x"></i></button>
            </div>
            
            <form id="service-form" onsubmit="saveService(event)" class="p-8 overflow-y-auto space-y-6">
                <input type="hidden" id="f-id">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-blue-600 uppercase ml-2">Cliente</label>
                        <input type="text" id="f-client" required class="w-full p-4 bg-slate-100 rounded-2xl font-bold border-2 border-transparent focus:bg-white transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-blue-600 uppercase ml-2">Teléfono</label>
                        <input type="tel" id="f-phone" required class="w-full p-4 bg-slate-100 rounded-2xl font-bold border-2 border-transparent focus:bg-white transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase ml-2">Vehículo</label>
                        <input type="text" id="f-vehicle" required class="w-full p-4 bg-slate-100 rounded-2xl font-bold">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase ml-2">Placa</label>
                        <input type="text" id="f-plate" required class="w-full p-4 bg-slate-100 rounded-2xl font-mono uppercase text-center font-bold">
                    </div>
                    <div class="space-y-1 col-span-2 md:col-span-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase ml-2">Kilometraje</label>
                        <input type="number" id="f-km" class="w-full p-4 bg-slate-100 rounded-2xl font-bold">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[9px] font-black text-blue-600 uppercase ml-2">Trabajo Actual</label>
                    <textarea id="f-work" required rows="3" class="w-full p-4 bg-slate-100 rounded-2xl font-semibold border-2 border-transparent focus:bg-white"></textarea>
                </div>

                <div class="space-y-1">
                    <label class="text-[9px] font-black text-amber-600 uppercase ml-2">Antecedentes / Notas</label>
                    <textarea id="f-past" rows="2" class="w-full p-4 bg-amber-50/30 rounded-2xl border border-amber-100 font-semibold"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-end">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase ml-2">Prioridad</label>
                        <select id="f-priority" class="w-full p-4 bg-slate-100 rounded-2xl font-bold outline-none">
                            <option value="Normal">Normal</option>
                            <option value="Urgente">Urgente 🔴</option>
                        </select>
                    </div>
                    <div class="bg-slate-900 p-5 rounded-3xl flex items-center justify-between">
                        <p class="text-blue-400 font-black text-[10px] uppercase">Precio $</p>
                        <input type="number" id="f-price" required class="w-32 bg-transparent text-white font-black text-2xl text-right outline-none">
                    </div>
                </div>

                <button type="submit" class="w-full py-6 bg-blue-600 text-white font-black rounded-[2rem] shadow-xl uppercase tracking-widest text-xs hover:bg-blue-700 transition-all flex justify-center items-center">
                    GUARDAR REGISTRO
                </button>
            </form>
        </div>
    </div>

    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-full max-w-xs text-center pointer-events-none">
        <p class="bg-white/50 backdrop-blur-md py-2 px-4 rounded-full border border-slate-200 text-[8px] font-black text-slate-400 uppercase tracking-widest shadow-sm">
            Master-Mec Pro • Sincronizado en tiempo real
        </p>
    </div>

</body>
</html>
