<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blood Strike - Character Select</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        
        /* Menú de Selección */
        #menu {
            position: absolute; width: 100%; height: 100%; 
            background: radial-gradient(circle, #1a1a2e 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; color: white;
        }
        .char-container { display: flex; gap: 40px; margin-top: 30px; }
        .card {
            width: 200px; padding: 20px; border: 2px solid #333; border-radius: 10px;
            text-align: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.05);
        }
        .card:hover { border-color: #0f0; transform: scale(1.1); background: rgba(0,255,0,0.1); }
        .card h2 { margin: 10px 0; color: #0f0; }

        #hud {
            position: absolute; bottom: 20px; left: 20px; color: #fff; 
            background: rgba(0,0,0,0.6); padding: 15px; border-left: 5px solid #0f0; display: none;
        }
        #interaction {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
            color: yellow; font-weight: bold; display: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            border: 1px solid rgba(0,255,0,0.5); border-radius: 50%; transform: translate(-50%, -50%);
            display: none;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="font-size: 50px; letter-spacing: 5px;">BLOOD STRIKE</h1>
        <p>ELIGE TU OPERADOR</p>
        <div class="char-container">
            <div class="card" onclick="startGame(0x00ff00, 'TÁCTICO')">
                <div style="width:100%; height:150px; background:#004400; border-radius:5px;"></div>
                <h2>TÁCTICO</h2>
                <p>Velocidad +</p>
            </div>
            <div class="card" onclick="startGame(0xff0000, 'CAZADOR')">
                <div style="width:100%; height:150px; background:#440000; border-radius:5px;"></div>
                <h2>CAZADOR</h2>
                <p>Ataque +</p>
            </div>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="interaction">PRESIONA 'E'</div>
    <div id="hud">
        OPERADOR: <span id="op-name">-</span> <br>
        ARMA: <span id="weapon-name">NINGUNA</span> <br>
        AMMO: <span id="ammo">0</span>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/PointerLockControls.js';

        let scene, camera, renderer, controls, playerColor;
        let move = { f: false, b: false, l: false, r: false };
        let velocity = new THREE.Vector3();
        let interactables = [];
        let isStarted = false;

        window.startGame = function(color, name) {
            playerColor = color;
            document.getElementById('op-name').innerText = name;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            init();
            animate();
            controls.lock();
        }

        function init() {
            scene = new THREE.Scene();
            
            // --- CIELO REALISTA ---
            // Niebla para horizonte
            scene.fog = new THREE.Fog(0x87ceeb, 1, 1000);
            // Fondo degradado (Cielo)
            const vertexShader = `varying vec3 vWorldPosition; void main() { vec4 worldPosition = modelMatrix * vec4( position, 1.0 ); vWorldPosition = worldPosition.xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`;
            const fragmentShader = `uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition; void main() { float h = normalize( vWorldPosition + offset ).y; gl_FragColor = vec4( mix( bottomColor, topColor, max( pow( max( h, 0.0 ), exponent ), 0.0 ) ), 1.0 ); }`;
            const skyGeo = new THREE.SphereGeometry(500, 32, 15);
            const skyMat = new THREE.ShaderMaterial({
                vertexShader, fragmentShader,
                uniforms: {
                    topColor: { value: new THREE.Color(0x0077ff) },
                    bottomColor: { value: new THREE.Color(0xffffff) },
                    offset: { value: 33 },
                    exponent: { value: 0.6 }
                },
                side: THREE.BackSide
            });
            scene.add(new THREE.Mesh(skyGeo, skyMat));

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
            camera.position.set(0, 300, 0); // Inicio desde el avión

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
            scene.add(light);

            // Suelo Verde
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({color: 0x113311}));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Generar Edificios y Botín
            for(let i=0; i<15; i++) {
                const x = Math.random()*600-300;
                const z = Math.random()*600-300;
                // Edificio
                const b = new THREE.Mesh(new THREE.BoxGeometry(20, 40, 20), new THREE.MeshStandardMaterial({color: 0x333333, wireframe: false}));
                b.position.set(x, 20, z);
                scene.add(b);
                
                // Arma Sniper (flotante)
                const gun = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 2), new THREE.MeshBasicMaterial({color: 0xffff00}));
                gun.position.set(x, 2, z + 15);
                gun.userData = { type: 'arma', name: 'SNIPER RIFLE', ammo: 10 };
                scene.add(gun);
                interactables.push(gun);
            }

            controls = new PointerLockControls(camera, document.body);
            isStarted = true;

            // Eventos
            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') move.f = true;
                if(e.code === 'KeyS') move.b = true;
                if(e.code === 'KeyA') move.l = true;
                if(e.code === 'KeyD') move.r = true;
                if(e.code === 'Space' && camera.position.y <= 2) velocity.y = 12;
                if(e.code === 'KeyE') checkInteraction();
            });
            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') move.f = false;
                if(e.code === 'KeyS') move.b = false;
                if(e.code === 'KeyA') move.l = false;
                if(e.code === 'KeyD') move.r = false;
            });
        }

        function checkInteraction() {
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(), camera);
            const inter = ray.intersectObjects(interactables);
            if(inter.length > 0 && inter[0].distance < 6) {
                const obj = inter[0].object;
                document.getElementById('weapon-name').innerText = obj.userData.name;
                document.getElementById('ammo').innerText = obj.userData.ammo;
                scene.remove(obj);
            }
        }

        function animate() {
            if(!isStarted) return;
            requestAnimationFrame(animate);
            
            if (controls.isLocked) {
                const delta = 0.016;
                velocity.x -= velocity.x * 10 * delta;
                velocity.z -= velocity.z * 10 * delta;
                
                // Gravedad (Caída de paracaídas lenta si estás arriba)
                const gravity = camera.position.y > 50 ? 5 : 25;
                velocity.y -= gravity * delta;

                if(move.f) velocity.z -= 150 * delta;
                if(move.b) velocity.z += 150 * delta;
                if(move.l) velocity.x -= 150 * delta;
                if(move.r) velocity.x += 150 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                if(camera.position.y < 2) { camera.position.y = 2; velocity.y = 0; }
                
                // Mostrar "E"
                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(), camera);
                const inter = ray.intersectObjects(interactables);
                document.getElementById('interaction').style.display = (inter.length > 0 && inter[0].distance < 6) ? 'block' : 'none';
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
