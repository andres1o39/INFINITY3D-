<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel OS</title>
    <style>
        :root {
            --primary-bg: #1a1a1a;
            --accent: #00ffcc;
            --taskbar-bg: rgba(0, 0, 0, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #000;
            color: white;
        }

        /* --- Pantalla de Instalación --- */
        #installer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, #222, #000);
            z-index: 100;
            position: absolute;
            width: 100%;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Escritorio --- */
        #desktop {
            display: none;
            height: 100vh;
            background: linear-gradient(45deg, #1e3c72, #2a5298);
            position: relative;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #desktop h1 {
            font-size: 5rem;
            opacity: 0.2;
            user-select: none;
        }

        /* --- Apps en el Escritorio --- */
        .app-container {
            position: absolute;
            top: 50px;
            left: 50px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 80px;
            transition: transform 0.2s;
        }

        .icon:hover { transform: scale(1.1); }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* --- Barra de Tareas --- */
        .taskbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45px;
            background: var(--taskbar-bg);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .system-tray {
            display: flex;
            gap: 15px;
            font-size: 14px;
            align-items: center;
        }

        /* --- Ventanas --- */
        .window {
            display: none;
            position: absolute;
            top: 100px;
            width: 400px;
            background: #f0f0f0;
            color: #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .window-header {
            background: #ddd;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn { cursor: pointer; color: red; font-weight: bold; }

        .window-content { padding: 20px; }

        textarea { width: 100%; height: 150px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="installer">
        <div class="loader"></div>
        <h2 id="status-text">Instalando Voxel OS...</h2>
    </div>

    <div id="desktop">
        <h1>VOXEL OS</h1>

        <div class="app-container">
            <div class="icon" onclick="openWindow('store')">
                <div class="icon-box">🛒</div>
                <span>Store</span>
            </div>
            <div class="icon" onclick="openWindow('config')">
                <div class="icon-box">⚙️</div>
                <span>Config</span>
            </div>
            <div class="icon" onclick="openWindow('bank')">
                <div class="icon-box">💰</div>
                <span>Banco</span>
            </div>
        </div>

        <div id="store" class="window">
            <div class="window-header">
                <span>Voxel Store</span>
                <span class="close-btn" onclick="closeWindow('store')">X</span>
            </div>
            <div class="window-content">
                <h3>Aplicaciones Disponibles</h3>
                <button onclick="openWindow('notes')">Descargar/Abrir Bloc de Notas</button>
            </div>
        </div>

        <div id="notes" class="window">
            <div class="window-header">
                <span>Bloc de Notas</span>
                <span class="close-btn" onclick="closeWindow('notes')">X</span>
            </div>
            <div class="window-content">
                <textarea placeholder="Escribe algo aquí..."></textarea>
            </div>
        </div>

        <div class="taskbar">
            <div style="font-weight: bold;">VX</div>
            <div class="system-tray">
                <span>📶 Wifi</span>
                <span>🔋 85%</span>
                <span>🔊</span>
                <span>🔵 BT</span>
                <span id="clock">00:00</span>
            </div>
        </div>
    </div>

    <script>
        // Simulador de instalación
        setTimeout(() => {
            document.getElementById('status-text').innerText = "Iniciando...";
            setTimeout(() => {
                document.getElementById('installer').style.display = 'none';
                document.getElementById('desktop').style.display = 'flex';
            }, 1500);
        }, 3000);

        // Reloj en tiempo real
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Manejo de ventanas
        function openWindow(id) {
            document.getElementById(id).style.display = 'block';
        }

        function closeWindow(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>
</body>
</html>
