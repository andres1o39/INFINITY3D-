<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vertex Engine | Final Master Edition</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        :root {
            --b-0: #020202; --b-1: #0f0f13; --b-2: #19191e;
            --acc: #00f2ff; --pink: #ff007a; --key: #ffcc00; --txt: #f1f2f6; --brd: rgba(255,255,255,0.08);
            --sidebar-w: 280px; --timeline-h: 180px;
        }

        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--b-0); color: var(--txt); font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }

        /* LAYOUT PRINCIPAL */
        #app-grid {
            display: grid;
            grid-template-areas: "tool view side" "tool time side";
            grid-template-columns: 60px 1fr var(--sidebar-w);
            grid-template-rows: 1fr var(--timeline-h);
            height: 100vh; width: 100vw; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* TOOLBAR */
        #toolbar { grid-area: tool; background: var(--b-1); border-right: 1px solid var(--brd); display: flex; flex-direction: column; align-items: center; padding: 15px 0; z-index: 100; }
        .t-btn { width: 44px; height: 44px; margin-bottom: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--b-2); color: #888; border: 1px solid var(--brd); cursor: pointer; }
        .t-btn.active { background: var(--acc); color: #000; box-shadow: 0 0 15px rgba(0,242,255,0.3); }

        /* VIEWPORT */
        #viewport { grid-area: view; position: relative; background: radial-gradient(circle, #111 0%, #000 100%); overflow: hidden; }

        /* TIMELINE (COLAPSABLE) */
        #timeline { grid-area: time; background: var(--b-1); border-top: 1px solid var(--brd); display: flex; flex-direction: column; z-index: 80; position: relative; }
        #timeline.collapsed { margin-bottom: calc(-1 * var(--timeline-h) + 40px); }
        
        .time-nav { height: 40px; background: var(--b-2); display: flex; align-items: center; padding: 0 15px; justify-content: space-between; border-bottom: 1px solid var(--brd); cursor: ns-resize; }
        #time-ruler { height: 30px; background: #0a0a0f; position: relative; border-bottom: 1px solid var(--brd); overflow: hidden; }
        .ruler-mark { position: absolute; bottom: 0; width: 1px; height: 8px; background: #333; }
        .ruler-num { position: absolute; bottom: 10px; font-size: 9px; color: #666; transform: translateX(-50%); }

        #key-track { flex: 1; position: relative; overflow: hidden; background: #050507; }
        #playhead { position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: var(--acc); z-index: 10; pointer-events: none; }
        #playhead::after { content: ''; position: absolute; top: 0; left: -5px; width: 12px; height: 12px; background: var(--acc); border-radius: 0 0 5px 5px; }
        .key-node { position: absolute; top: 20px; width: 10px; height: 10px; background: var(--key); transform: rotate(45deg); border: 1px solid #000; z-index: 5; }

        /* SIDEBAR (DESLIZABLE) */
        #sidebar { grid-area: side; background: var(--b-1); border-left: 1px solid var(--brd); display: flex; flex-direction: column; z-index: 90; position: relative; transition: width 0.3s; }
        #sidebar.collapsed { width: 0; overflow: hidden; border-left: none; }
        
        #side-handle { position: absolute; left: -30px; top: 50%; transform: translateY(-50%); width: 30px; height: 60px; background: var(--b-1); border: 1px solid var(--brd); border-radius: 10px 0 0 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .sb-content { padding: 20px; flex: 1; overflow-y: auto; width: var(--sidebar-w); }

        /* INPUTS TACTILES */
        .section-h { font-size: 10px; font-weight: 800; color: var(--acc); text-transform: uppercase; margin: 15px 0 10px; letter-spacing: 1px; }
        .t-input { background: var(--b-2); border: 1px solid var(--brd); padding: 12px; border-radius: 8px; color: #fff; width: 100%; margin-bottom: 10px; font-size: 13px; }
        .btn-acc { background: var(--acc); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; }
        
        .hud { position: absolute; top: 15px; left: 15px; pointer-events: none; display: flex; gap: 8px; }
        .chip { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); padding: 5px 10px; border-radius: 4px; font-size: 10px; border: 1px solid var(--brd); }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div id="app-grid">
    <aside id="toolbar">
        <div class="t-btn active" onclick="setTMode('translate', this)"><i data-lucide="move"></i></div>
        <div class="t-btn" onclick="setTMode('rotate', this)"><i data-lucide="rotate-cw"></i></div>
        <div class="t-btn" onclick="setTMode('scale', this)"><i data-lucide="maximize"></i></div>
        <div style="height: 1px; width: 30px; background: var(--brd); margin: 5px 0;"></div>
        <label class="t-btn" style="color:var(--acc)" for="import-glb"><i data-lucide="upload-cloud"></i></label>
        <input type="file" id="import-glb" accept=".glb,.gltf">
        <div class="t-btn" onclick="addPrimitive('cube')"><i data-lucide="box"></i></div>
    </aside>

    <main id="viewport">
        <div class="hud">
            <div class="chip">FRAME: <span id="hud-frame">0</span></div>
            <div class="chip" id="fps-counter">60 FPS</div>
            <div class="chip" style="color:var(--acc)" id="obj-name-hud">No selection</div>
        </div>
    </main>

    <footer id="timeline">
        <div class="time-nav" onclick="toggleTimeline()">
            <div style="display: flex; gap: 10px; pointer-events: all;" onclick="event.stopPropagation()">
                <button class="t-btn" style="margin:0; width:30px; height:30px;" onclick="togglePlay()"><i data-lucide="play" id="play-icon"></i></button>
                <button class="t-btn" style="margin:0; width:30px; height:30px; color:var(--key)" onclick="addKeyframe()"><i data-lucide="key"></i></button>
            </div>
            <div style="width: 40px; height: 4px; background: #444; border-radius: 2px;"></div>
            <span id="time-val" style="font-size: 11px; font-weight: bold; width: 40px;">0</span>
        </div>
        <div id="time-ruler"></div>
        <div id="key-track">
            <div id="playhead"></div>
            <div id="keys-container"></div>
        </div>
    </footer>

    <aside id="sidebar">
        <div id="side-handle" onclick="toggleSidebar()"><i data-lucide="chevron-right" id="side-icon"></i></div>
        <div class="sb-content">
            <div class="section-h">Transformación</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <input type="number" id="p-x" class="t-input" placeholder="X" step="0.1">
                <input type="number" id="p-y" class="t-input" placeholder="Y" step="0.1">
            </div>

            <div class="section-h">Material PBR</div>
            <input type="color" id="m-col" class="t-input" style="height: 45px; padding: 5px;">
            <label style="font-size: 9px; opacity: 0.6;">METALICIDAD</label>
            <input type="range" id="m-met" min="0" max="1" step="0.01" style="width: 100%; accent-color: var(--acc); margin-bottom: 10px;">
            <label style="font-size: 9px; opacity: 0.6;">RUGOSIDAD</label>
            <input type="range" id="m-rog" min="0" max="1" step="0.01" style="width: 100%; accent-color: var(--acc);">

            <div class="section-h">Acciones</div>
            <button class="btn-acc" onclick="addKeyframe()">GUARDAR KEYFRAME</button>
            <button class="t-input" style="margin-top: 10px; border-color: var(--pink); color: var(--pink);" onclick="deleteObj()">ELIMINAR OBJETO</button>
            
            <div style="margin-top: 20px;">
                <button class="t-input" onclick="takeSnapshot()"><i data-lucide="camera" style="width:14px"></i> RENDER FOTO</button>
            </div>
        </div>
    </aside>
</div>

<script>
    let scene, camera, renderer, orbit, transform, raycaster, clock;
    let objects = [], keyframes = [], selected = null;
    let currentFrame = 0, isPlaying = false;

    function init() {
        scene = new THREE.Scene();
        clock = new THREE.Clock();
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight - 180), 0.1, 1000);
        camera.position.set(8, 8, 8);

        renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(5, 10, 7);
        sun.castShadow = true;
        scene.add(sun);
        scene.add(new THREE.GridHelper(30, 30, 0x222222, 0x111111));

        orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        transform = new THREE.TransformControls(camera, renderer.domElement);
        transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);
        transform.addEventListener('change', syncSidebar);
        scene.add(transform);

        raycaster = new THREE.Raycaster();

        // Inicializar Regla
        buildRuler();
        setupEvents();
        lucide.createIcons();
        animate();
    }

    function buildRuler() {
        const ruler = document.getElementById('time-ruler');
        ruler.innerHTML = '';
        for(let i=0; i<=100; i+=5) {
            const m = document.createElement('div');
            m.className = 'ruler-mark';
            m.style.left = `${i}%`;
            if(i % 10 === 0) {
                m.style.height = '12px';
                const n = document.createElement('div');
                n.className = 'ruler-num';
                n.innerText = i;
                n.style.left = `${i}%`;
                ruler.appendChild(n);
            }
            ruler.appendChild(m);
        }
    }

    function setupEvents() {
        // Scrubbing en regla
        const ruler = document.getElementById('time-ruler');
        const handleScrub = (e) => {
            const rect = ruler.getBoundingClientRect();
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            let frame = Math.round(((clientX - rect.left) / rect.width) * 100);
            setFrame(Math.max(0, Math.min(100, frame)));
        };

        ruler.addEventListener('pointerdown', (e) => {
            ruler.setPointerCapture(e.pointerId);
            handleScrub(e);
            ruler.addEventListener('pointermove', handleScrub);
        });
        ruler.addEventListener('pointerup', () => ruler.removeEventListener('pointermove', handleScrub));

        // Importar GLB
        document.getElementById('import-glb').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    new THREE.GLTFLoader().parse(ev.target.result, '', (gltf) => {
                        const model = gltf.scene;
                        model.name = file.name;
                        scene.add(model);
                        objects.push(model);
                        selectObj(model);
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // Inputs Sidebar
        document.getElementById('m-col').addEventListener('input', (e) => { if(selected) selected.traverse(n => { if(n.isMesh) n.material.color.set(e.target.value) })});
        document.getElementById('m-met').addEventListener('input', (e) => { if(selected) selected.traverse(n => { if(n.isMesh) n.material.metalness = e.target.value })});
        document.getElementById('m-rog').addEventListener('input', (e) => { if(selected) selected.traverse(n => { if(n.isMesh) n.material.roughness = e.target.value })});
    }

    function setFrame(f) {
        currentFrame = f;
        document.getElementById('hud-frame').innerText = f;
        document.getElementById('time-val').innerText = f;
        document.getElementById('playhead').style.left = `${f}%`;
        applyAnimation();
    }

    function addKeyframe() {
        if(!selected) return;
        const key = {
            frame: currentFrame,
            objId: selected.uuid,
            pos: selected.position.clone(),
            rot: selected.rotation.clone(),
            scl: selected.scale.clone()
        };
        keyframes = keyframes.filter(k => !(k.frame === currentFrame && k.objId === selected.uuid));
        keyframes.push(key);
        renderKeyDots();
    }

    function applyAnimation() {
        objects.forEach(obj => {
            const keys = keyframes.filter(k => k.objId === obj.uuid).sort((a,b) => a.frame - b.frame);
            if(keys.length < 2) return;
            let prev = keys.reduce((best, k) => (k.frame <= currentFrame) ? k : best, keys[0]);
            let next = keys.find(k => k.frame > currentFrame);
            if(prev && next) {
                const t = (currentFrame - prev.frame) / (next.frame - prev.frame);
                obj.position.lerpVectors(prev.pos, next.pos, t);
                obj.quaternion.slerpQuaternions(new THREE.Quaternion().setFromEuler(prev.rot), new THREE.Quaternion().setFromEuler(next.rot), t);
            }
        });
    }

    function renderKeyDots() {
        const container = document.getElementById('keys-container');
        container.innerHTML = '';
        keyframes.forEach(k => {
            const d = document.createElement('div');
            d.className = 'key-node';
            d.style.left = `${k.frame}%`;
            container.appendChild(d);
        });
    }

    function toggleTimeline() {
        document.getElementById('timeline').classList.toggle('collapsed');
        setTimeout(onResize, 350);
    }

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        sb.classList.toggle('collapsed');
        document.getElementById('side-icon').setAttribute('data-lucide', sb.classList.contains('collapsed') ? 'chevron-left' : 'chevron-right');
        lucide.createIcons();
        setTimeout(onResize, 350);
    }

    function addPrimitive(type) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({ color: 0x00f2ff, metalness: 0.5, roughness: 0.2 }));
        mesh.position.y = 1;
        scene.add(mesh);
        objects.push(mesh);
        selectObj(mesh);
    }

    function selectObj(obj) {
        selected = obj;
        if(obj) {
            transform.attach(obj);
            document.getElementById('obj-name-hud').innerText = obj.name || "Objeto";
            syncSidebar();
        }
    }

    function syncSidebar() {
        if(!selected) return;
        document.getElementById('p-x').value = selected.position.x.toFixed(2);
        document.getElementById('p-y').value = selected.position.y.toFixed(2);
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('play-icon').setAttribute('data-lucide', isPlaying ? 'pause' : 'play');
        lucide.createIcons();
    }

    function onSelect(e) {
        const rect = renderer.domElement.getBoundingClientRect();
        const m = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
        raycaster.setFromCamera(m, camera);
        const hits = raycaster.intersectObjects(objects, true);
        if(hits.length > 0) {
            let target = hits[0].object;
            while(target.parent && !objects.includes(target)) target = target.parent;
            selectObj(target);
        }
    }

    function onResize() {
        const grid = document.getElementById('app-grid');
        const view = document.getElementById('viewport');
        camera.aspect = view.clientWidth / view.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(view.clientWidth, view.clientHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        orbit.update();
        if(isPlaying) {
            currentFrame = (currentFrame + 0.5);
            if(currentFrame > 100) currentFrame = 0;
            setFrame(Math.floor(currentFrame));
        }
        renderer.render(scene, camera);
    }

    function takeSnapshot() {
        renderer.render(scene, camera);
        const a = document.createElement('a');
        a.href = renderer.domElement.toDataURL();
        a.download = 'vertex_final_render.png';
        a.click();
    }

    window.onload = init;
</script>
</body>
</html>
