<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blood Strike: Loot & Buildings</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #instructions {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: #0f0; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; cursor: pointer; text-align: center;
        }
        #hud {
            position: absolute; bottom: 20px; left: 20px; color: #fff; 
            background: rgba(0,255,0,0.1); padding: 15px; border: 1px solid #0f0;
        }
        #interaction {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
            color: yellow; font-weight: bold; display: none; text-shadow: 2px 2px #000;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: #0f0; border-radius: 50%; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>BLOOD STRIKE: <span style="color:white">LOOT SYSTEM</span></h1>
        <p>CAMINA HACIA LAS ARMAS O COFRES PARA RECOGERLOS</p>
        <p>[ CLICK PARA DESPLEGARSE ]</p>
    </div>
    
    <div id="interaction">PRESIONA 'E' PARA ABRIR</div>
    <div id="crosshair"></div>
    
    <div id="hud">
        ARMA: <span id="weapon-name">NINGUNA</span> <br>
        MUNICIÓN: <span id="ammo">0</span> <br>
        BOTÍN: <span id="loot-count">0</span> COFRES
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/PointerLockControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020502);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0x004400, 1);
        scene.add(light);

        // --- MAPA: SUELO VERDE ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({color: 0x0a330a}));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- SISTEMA DE LOOT Y EDIFICIOS ---
        const interactables = [];
        
        function createBuilding(x, z, color) {
            const group = new THREE.Group();
            // Paredes (hueco por dentro)
            const wallMat = new THREE.MeshStandardMaterial({color: color, side: THREE.DoubleSide, transparent: true, opacity: 0.8});
            const room = new THREE.Mesh(new THREE.BoxGeometry(20, 15, 20), wallMat);
            room.position.set(x, 7.5, z);
            scene.add(room);

            // Puerta (hueco visual)
            const door = new THREE.Mesh(new THREE.BoxGeometry(4, 7, 1), new THREE.MeshBasicMaterial({color: 0x000000}));
            door.position.set(x, 3.5, z + 10.1);
            scene.add(door);

            // Cofre dentro
            const chest = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 1), new THREE.MeshStandardMaterial({color: 0xffd700}));
            chest.position.set(x + 5, 0.5, z + 5);
            chest.userData = { type: 'cofré' };
            scene.add(chest);
            interactables.push(chest);

            // Arma dentro (Subfusil o Sniper)
            const isSniper = Math.random() > 0.5;
            const gun = new THREE.Mesh(
                isSniper ? new THREE.BoxGeometry(0.1, 0.2, 2) : new THREE.BoxGeometry(0.2, 0.4, 0.8),
                new THREE.MeshStandardMaterial({color: 0x333333})
            );
            gun.position.set(x - 5, 1, z - 5);
            gun.userData = { type: 'arma', name: isSniper ? 'SNIPER' : 'SUBFUSIL', ammo: isSniper ? 5 : 30 };
            scene.add(gun);
            interactables.push(gun);
        }

        // Generar 10 edificios con loot
        for(let i=0; i<10; i++) {
            createBuilding(Math.random()*400-200, Math.random()*400-200, Math.random()*0x444444);
        }

        // --- JUGADOR Y ARMA VISUAL ---
        const weaponModel = new THREE.Group();
        const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 1), new THREE.MeshStandardMaterial({color: 0x111111}));
        weaponModel.add(gunBody);
        camera.add(weaponModel);
        scene.add(camera);
        weaponModel.position.set(0.4, -0.4, -0.8);
        weaponModel.visible = false; // Solo visible si recoges arma

        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('instructions').addEventListener('click', () => controls.lock());
        
        let move = { f: false, b: false, l: false, r: false };
        let velocity = new THREE.Vector3();
        let lootCount = 0;

        camera.position.set(0, 100, 0); // Caida

        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') move.f = true;
            if(e.code === 'KeyS') move.b = true;
            if(e.code === 'KeyA') move.l = true;
            if(e.code === 'KeyD') move.r = true;
            if(e.code === 'Space' && camera.position.y <= 1.8) velocity.y = 10;
            if(e.code === 'KeyE') checkLoot();
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') move.f = false;
            if(e.code === 'KeyS') move.b = false;
            if(e.code === 'KeyA') move.l = false;
            if(e.code === 'KeyD') move.r = false;
        });

        function checkLoot() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const intersects = raycaster.intersectObjects(interactables);

            if (intersects.length > 0 && intersects[0].distance < 5) {
                const obj = intersects[0].object;
                if(obj.userData.type === 'cofré') {
                    lootCount++;
                    document.getElementById('loot-count').innerText = lootCount;
                    scene.remove(obj);
                } else if(obj.userData.type === 'arma') {
                    document.getElementById('weapon-name').innerText = obj.userData.name;
                    document.getElementById('ammo').innerText = obj.userData.ammo;
                    weaponModel.visible = true;
                    scene.remove(obj);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                // Raycast constante para mostrar texto de "E para recoger"
                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(), camera);
                const inter = ray.intersectObjects(interactables);
                document.getElementById('interaction').style.display = (inter.length > 0 && inter[0].distance < 5) ? 'block' : 'none';

                // Física básica
                const delta = 0.016;
                velocity.x -= velocity.x * 10 * delta;
                velocity.z -= velocity.z * 10 * delta;
                if(camera.position.y > 1.7) velocity.y -= 25 * delta;

                if(move.f) velocity.z -= 150 * delta;
                if(move.b) velocity.z += 150 * delta;
                if(move.l) velocity.x -= 150 * delta;
                if(move.r) velocity.x += 150 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                if(camera.position.y < 1.7) { camera.position.y = 1.7; velocity.y = 0; }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
