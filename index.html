<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo 3D con Transform Controls</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        #info {
            position: absolute;
            top: 10px; left: 10px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="info">
    <strong>Controles:</strong><br>
    W: Mover | E: Rotar | R: Escalar<br>
    Click/Arrastrar: Orbitar cámara
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // 1. Escena y Cámara
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 5);

    // 2. Renderizador
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 3. Elementos Visuales (Cubo y Rejilla)
    const grid = new THREE.GridHelper(10, 10, 0x888888, 0x444444);
    scene.add(grid);

    const geometry = new THREE.BoxGeometry(2, 2, 2);
    const material = new THREE.MeshNormalMaterial({ transparent: true, opacity: 0.8 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // 4. Controles de Órbita (Cámara)
    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.update();

    // 5. Transform Controls (Manipulación del objeto)
    const transformControl = new TransformControls(camera, renderer.domElement);
    transformControl.attach(cube);
    scene.add(transformControl);

    // Deshabilitar OrbitControls mientras se transforma el objeto
    transformControl.addEventListener('dragging-changed', (event) => {
        orbit.enabled = !event.value;
    });

    // 6. Eventos de Teclado
    window.addEventListener('keydown', (event) => {
        switch (event.key.toLowerCase()) {
            case 'w': transformControl.setMode('translate'); break;
            case 'e': transformControl.setMode('rotate'); break;
            case 'r': transformControl.setMode('scale'); break;
        }
    });

    // 7. Ajuste de Ventana
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 8. Animación
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
