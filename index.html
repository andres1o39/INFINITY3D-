<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeminiOS Pro - 1000+ Functions</title>
    <style>
        :root { --bg: #0f172a; --taskbar: rgba(15, 23, 42, 0.8); --accent: #38bdf8; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; overflow: hidden; height: 100vh; }
        
        /* Escritorio */
        #desktop { 
            width: 100vw; height: 100vh; 
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            display: grid; grid-template-columns: repeat(auto-fill, 100px);
            grid-template-rows: repeat(auto-fill, 100px);
            grid-auto-flow: column; padding: 20px; gap: 10px;
        }

        /* Barra de Tareas */
        #taskbar { 
            position: fixed; bottom: 0; width: 100%; height: 50px; 
            background: var(--taskbar); backdrop-filter: blur(10px);
            display: flex; align-items: center; padding: 0 15px; border-top: 1px solid #334155; z-index: 1000;
        }

        #search-input { 
            background: #1e293b; border: 1px solid #475569; color: white; 
            padding: 8px 15px; border-radius: 20px; width: 250px; outline: none;
        }

        /* Ventanas */
        .window { 
            position: absolute; width: 450px; min-height: 300px; 
            background: #f8fafc; color: #1e293b; border-radius: 12px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); display: flex; flex-direction: column;
            resize: both; overflow: hidden; animation: fadeIn 0.2s;
        }
        .window-header { 
            background: #e2e8f0; padding: 12px; cursor: move; 
            display: flex; justify-content: space-between; align-items: center; font-weight: bold;
        }
        .window-content { padding: 20px; flex-grow: 1; overflow-y: auto; font-family: monospace; }
        .close-btn { background: #ff5f56; border: none; border-radius: 50%; width: 15px; height: 15px; cursor: pointer; }

        /* Iconos */
        .icon { 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; cursor: pointer; transition: 0.2s; border-radius: 8px;
        }
        .icon:hover { background: rgba(255,255,255,0.1); }
        .icon-img { font-size: 30px; margin-bottom: 5px; }
        .icon-text { font-size: 11px; text-align: center; max-width: 80px; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div id="desktop"></div>

<div id="taskbar">
    <input type="text" id="search-input" placeholder="🔍 Buscar entre 1000 funciones..." onkeyup="filterFunctions(this.value)">
    <div id="status-bar" style="margin-left: auto; font-size: 12px; color: #94a3b8;">
        RAM: <span id="ram-sim">4.2GB</span> | <span id="clock">00:00:00</span>
    </div>
</div>

<script>
    const desktop = document.getElementById('desktop');
    const apps = [];

    // --- EL CEREBRO: MOTOR DE GENERACIÓN DE 1000 FUNCIONES ---
    function buildOS() {
        // 1. Herramientas de Texto (1-100)
        for(let i=1; i<=100; i++) {
            apps.push({
                name: `Texto Mod #` + i, icon: "📝",
                run: () => `Analizador de texto nivel ${i}: Invierte, cuenta y cifra caracteres automáticamente.`
            });
        }

        // 2. Herramientas Matemáticas (101-300)
        for(let i=101; i<=300; i++) {
            apps.push({
                name: `Math Calc ` + i, icon: "➕",
                run: () => `Resultado de la constante algorítmica ${i}: ${Math.sqrt(i * Math.PI).toFixed(4)}`
            });
        }

        // 3. Utilidades de Sistema (301-600)
        for(let i=301; i<=600; i++) {
            apps.push({
                name: `Sys Monitor ` + i, icon: "⚙️",
                run: () => `Estado del proceso #${i}: <b>EJECUTÁNDOSE</b>. Consumo: ${Math.random().toFixed(2)}ms.`
            });
        }

        // 4. Herramientas de Diseño/Color (601-800)
        for(let i=601; i<=800; i++) {
            let color = '#' + Math.floor(Math.random()*16777215).toString(16);
            apps.push({
                name: `Palette ` + i, icon: "🎨",
                run: () => `<div style="background:${color}; height:100px; border-radius:10px;"></div><br>Color Hex: ${color}`
            });
        }

        // 5. Generadores de Datos (801-1000)
        for(let i=801; i<=1000; i++) {
            apps.push({
                name: `Data Gen ` + i, icon: "💾",
                run: () => `ID Único Generado: ${crypto.randomUUID()}<br>Timestamp: ${Date.now()}`
            });
        }

        renderDesktop(apps.slice(0, 50)); // Solo mostramos 50 iconos iniciales para no tapar el fondo
    }

    function renderDesktop(appsList) {
        desktop.innerHTML = '';
        appsList.forEach((app, index) => {
            const div = document.createElement('div');
            div.className = 'icon';
            div.onclick = () => launchApp(app);
            div.innerHTML = `<div class="icon-img">${app.icon}</div><div class="icon-text">${app.name}</div>`;
            desktop.appendChild(div);
        });
    }

    function launchApp(app) {
        const win = document.createElement('div');
        win.className = 'window';
        win.style.left = (Math.random() * 50 + 100) + 'px';
        win.style.top = (Math.random() * 50 + 50) + 'px';
        win.innerHTML = `
            <div class="window-header">
                <span>${app.icon} ${app.name}</span>
                <button class="close-btn" onclick="this.parentElement.parentElement.remove()"></button>
            </div>
            <div class="window-content">${app.run()}</div>
        `;
        document.body.appendChild(win);
        makeDraggable(win);
    }

    function makeDraggable(el) {
        let p1=0, p2=0, p3=0, p4=0;
        el.querySelector('.window-header').onmousedown = (e) => {
            p3 = e.clientX; p4 = e.clientY;
            document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
            document.onmousemove = (e) => {
                p1 = p3 - e.clientX; p2 = p4 - e.clientY;
                p3 = e.clientX; p4 = e.clientY;
                el.style.top = (el.offsetTop - p2) + "px";
                el.style.left = (el.offsetLeft - p1) + "px";
            };
        }
    }

    function filterFunctions(query) {
        const filtered = apps.filter(a => a.name.toLowerCase().includes(query.toLowerCase()));
        renderDesktop(filtered.slice(0, 60)); // Muestra hasta 60 resultados de búsqueda
    }

    // Reloj y Simulación
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        document.getElementById('ram-sim').innerText = (Math.random() * (4.5 - 4.1) + 4.1).toFixed(2) + " GB";
    }, 1000);

    buildOS();
</script>
</body>
</html>
