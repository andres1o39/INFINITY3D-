<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxelOS Simulator</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --accent-color: #16213e;
            --text-color: #e94560;
            --taskbar-color: rgba(0, 0, 0, 0.8);
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background-color: black; color: white;
        }

        /* --- Pantalla de Inicio --- */
        #boot-screen {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; transition: opacity 1s ease;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--text-color);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Escritorio --- */
        #desktop {
            display: none; height: 100vh;
            background: linear-gradient(45deg, #0f3460, #16213e);
            position: relative;
        }

        /* Iconos */
        .icon-container {
            display: flex; flex-direction: column;
            gap: 20px; padding: 20px; width: 100px;
        }

        .icon {
            text-align: center; cursor: pointer;
            transition: transform 0.2s;
        }

        .icon:hover { transform: scale(1.1); }

        .icon img { width: 50px; height: 50px; display: block; margin: 0 auto; }
        .icon span { font-size: 12px; margin-top: 5px; display: block; }

        /* Barra de Tareas */
        .taskbar {
            position: absolute; bottom: 0; width: 100%;
            height: 45px; background: var(--taskbar-color);
            display: flex; justify-content: flex-end; align-items: center;
            padding: 0 15px; box-sizing: border-box;
        }

        .controls { display: flex; align-items: center; gap: 20px; }

        .control-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }

        input[type="range"] { accent-color: var(--text-color); width: 80px; }

    </style>
</head>
<body>

    <div id="boot-screen">
        <h1 id="status-text">Iniciando VoxelOS...</h1>
        <div class="loader"></div>
    </div>

    <div id="desktop">
        <div class="icon-container">
            <div class="icon" onclick="alert('Abriendo Configuración...')">
                <img src="https://cdn-icons-png.flaticon.com/512/3953/3953226.png" alt="Config">
                <span>Configuración</span>
            </div>
            <div class="icon" onclick="alert('Abriendo Voxel Store...')">
                <img src="https://cdn-icons-png.flaticon.com/512/3306/3306613.png" alt="Store">
                <span>Voxel Store</span>
            </div>
        </div>

        <div class="taskbar">
            <div class="controls">
                <div class="control-item">
                    <span>📶 WiFi:</span>
                    <select id="wifi-sim">
                        <option>Conectado</option>
                        <option>Buscando...</option>
                        <option>Desconectado</option>
                    </select>
                </div>
                <div class="control-item">
                    <span>☀️ Brillo:</span>
                    <input type="range" min="30" max="100" value="100" oninput="adjustBrightness(this.value)">
                </div>
            </div>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        const bootScreen = document.getElementById('boot-screen');
        const desktop = document.getElementById('desktop');

        // Simulación de secuencia de arranque
        setTimeout(() => {
            statusText.innerText = "Instalando actualizaciones...";
            
            setTimeout(() => {
                bootScreen.style.opacity = '0';
                setTimeout(() => {
                    bootScreen.style.display = 'none';
                    desktop.style.display = 'block';
                }, 1000);
            }, 3000); // 3 segundos de "Instalando"

        }, 2000); // 2 segundos de "Iniciando"

        function adjustBrightness(val) {
            document.getElementById('desktop').style.filter = `brightness(${val}%)`;
        }
    </script>
</body>
</html>
