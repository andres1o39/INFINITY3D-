<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gemini 3D Master Suite - Ultra Realism</title>
    <style>
        :root { --accent: #00ff88; --bg-dark: #050505; --panel: rgba(20, 20, 20, 0.9); --border: #333; }
        body { margin: 0; background: var(--bg-dark); color: #eee; font-family: 'Segoe UI', sans-serif; overflow: hidden; font-size: 11px; }
        
        /* Layout Profesional */
        #top-bar { position: absolute; top: 0; width: 100%; height: 35px; background: #111; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; z-index: 1000; gap: 15px; }
        .panel { position: absolute; background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(15px); border-radius: 4px; z-index: 100; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Paneles Específicos */
        #left-bar { left: 10px; top: 45px; width: 50px; padding: 10px; gap: 10px; }
        #right-bar { right: 10px; top: 45px; width: 250px; bottom: 80px; padding: 15px; overflow-y: auto; }
        #bottom-bar { bottom: 10px; left: 70px; right: 270px; height: 60px; padding: 10px; flex-direction: row; align-items: center; justify-content: space-around; }

        /* Estilo de Botones Modernos */
        button { background: #222; border: 1px solid #444; color: #ddd; padding: 6px; cursor: pointer; border-radius: 3px; transition: 0.2s; font-weight: 500; }
        button:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        button.active { background: var(--accent); color: #000; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; }
        
        h4 { margin: 15px 0 8px 0; color: var(--accent); text-transform: uppercase; font-size: 10px; border-bottom: 1px solid #333; padding-bottom: 3px; }
        label { font-size: 9px; color: #888; display: block; margin-bottom: 3px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); margin-bottom: 10px; }
        input[type="color"] { width: 100%; border: none; height: 25px; background: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="top-bar">
    <span style="font-weight: bold; color: var(--accent)">GEMINI 3D ENGINE</span>
    <button onclick="exportRender()">EXPORTAR PNG</button>
    <button onclick="toggleGrid()">MOSTRAR REJILLA</button>
    <button onclick="resetScene()">RESETEAR TODO</button>
    <div style="flex-grow: 1"></div>
    <button class="active" onclick="fullProgram()" id="progBtn">PROGRAMAR APP (100+ FUNCIONES)</button>
</div>

<div id="left-bar" class="panel">
    <button title="G: Mover" onclick="setMode('translate')">M</button>
    <button title="R: Rotar" onclick="setMode('rotate')">R</button>
    <button title="S: Escalar" onclick="setMode('scale')">E</button>
    <hr style="width:100%; border:0; border-top:1px solid #333;">
    <button onclick="setCam('front')">F</button>
    <button onclick="setCam('top')">T</button>
    <button onclick="setCam('left')">L</button>
</div>

<div id="right-bar" class="panel">
    <h4>Iluminación Avanzada</h4>
    <label>Intensidad Luz Solar</label>
    <input type="range" id="sun-int" min="0" max="10" step="0.1" value="2" oninput="updateLights()">
    <label>Color de Luz Ambiente</label>
    <input type="color" id="amb-color" value="#ffffff" oninput="updateLights()">
    <div class="grid-2">
        <button onclick="toggleLight('sun')">Sol On/Off</button>
        <button onclick="toggleLight('point')">Punto On/Off</button>
    </div>

    <h4>Material Físico (PBR)</h4>
    <label>Color Albedo</label>
    <input type="color" id="obj-color" value="#00ff88" oninput="updateMaterial()">
    <label>Metalizado</label>
    <input type="range" id="obj-metal" min="0" max="1" step="0.01" value="0.9" oninput="updateMaterial()">
    <label>Rugosidad</label>
    <input type="range" id="obj-rough" min="0" max="1" step="0.01" value="0.1" oninput="updateMaterial()">
    <label>Transparencia</label>
    <input type="range" id="obj-alpha" min="0.1" max="1" step="0.01" value="1" oninput="updateMaterial()">

    <h4>Post-Procesamiento</h4>
    <div class="grid-2">
        <button onclick="toggleFX('bloom')">Bloom</button>
        <button onclick="toggleFX('wire')">Wireframe</button>
        <button onclick="toggleFX('ghost')">X-Ray</button>
        <button onclick="toggleFX('edges')">Bordes</button>
    </div>

    <h4>Acciones de Geometría</h4>
    <div class="grid-2">
        <button onclick="changeMesh('box')">Cubo</button>
        <button onclick="changeMesh('sphere')">Esfera</button>
        <button onclick="changeMesh('torus')">Torus</button>
        <button onclick="changeMesh('cone')">Cono</button>
    </div>
    <button style="width:100%" onclick="applySubdivision()">SUBDIVIDIR MALLA (SMOOTH)</button>
    
    <h4>Físicas y Magia</h4>
    <button style="width:100%; margin-bottom:5px" onclick="toggleGravity()">ACTIVAR GRAVEDAD</button>
    <button style="width:100%; margin-bottom:5px" onclick="triggerParty()">MODO DISCO / FIESTA</button>
    <button style="width:100%" onclick="spawnParticles()">GENERAR PARTÍCULAS</button>
</div>

<div id="bottom-bar" class="panel">
    <div>OBJETO: <b id="ui-obj">Cube_001</b></div>
    <div>POLYS: <b id="ui-poly">12</b></div>
    <div>ENGINE: <b style="color:var(--accent)">WEBGL 2.0</b></div>
    <div>FPS: <b id="ui-fps">60</b></div>
    <button onclick="autoRotate()" id="rotateBtn">AUTO-ROTAR ESCENA</button>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // CONFIGURACIÓN INICIAL
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.Fog(0x050505, 1, 50);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(8, 8, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    // LUCES
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 2);
    sunLight.position.set(10, 15, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    scene.add(sunLight);

    const pointLight = new THREE.PointLight(0x00ff88, 5, 20);
    pointLight.position.set(-5, 5, -5);
    scene.add(pointLight);

    // ELEMENTOS
    const grid = new THREE.GridHelper(40, 40, 0x222222, 0x111111);
    scene.add(grid);

    const pbrMat = new THREE.MeshPhysicalMaterial({ 
        color: 0x00ff88, metalness: 0.9, roughness: 0.1, 
        clearcoat: 1, clearcoatRoughness: 0.1 
    });
    let mainMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), pbrMat);
    mainMesh.castShadow = true;
    mainMesh.position.y = 1;
    scene.add(mainMesh);

    // CONTROLES
    const orbit = new OrbitControls(camera, renderer.domElement);
    const transform = new TransformControls(camera, renderer.domElement);
    transform.attach(mainMesh);
    scene.add(transform);

    transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);

    // FUNCIONES GLOBALES (MAREADAS A WINDOW)
    window.setMode = (m) => transform.setMode(m);
    
    window.updateMaterial = () => {
        mainMesh.material.color.set(document.getElementById('obj-color').value);
        mainMesh.material.metalness = parseFloat(document.getElementById('obj-metal').value);
        mainMesh.material.roughness = parseFloat(document.getElementById('obj-rough').value);
        mainMesh.material.opacity = parseFloat(document.getElementById('obj-alpha').value);
        mainMesh.material.transparent = mainMesh.material.opacity < 1;
    };

    window.updateLights = () => {
        sunLight.intensity = parseFloat(document.getElementById('sun-int').value);
        ambientLight.color.set(document.getElementById('amb-color').value);
    };

    window.changeMesh = (type) => {
        const geos = {
            box: new THREE.BoxGeometry(2,2,2),
            sphere: new THREE.SphereGeometry(1.5, 32, 32),
            torus: new THREE.TorusGeometry(1.2, 0.4, 16, 100),
            cone: new THREE.ConeGeometry(1.5, 3, 32)
        };
        mainMesh.geometry.dispose();
        mainMesh.geometry = geos[type];
        document.getElementById('ui-obj').innerText = type.toUpperCase();
        document.getElementById('ui-poly').innerText = mainMesh.geometry.attributes.position.count;
    };

    window.toggleFX = (type) => {
        if(type === 'bloom') sunLight.intensity = sunLight.intensity > 5 ? 2 : 15;
        if(type === 'wire') mainMesh.material.wireframe = !mainMesh.material.wireframe;
        if(type === 'ghost') mainMesh.material.opacity = mainMesh.material.opacity < 1 ? 1 : 0.3;
    };

    let gravity = false;
    window.toggleGravity = () => gravity = !gravity;

    let spinning = false;
    window.autoRotate = () => {
        spinning = !spinning;
        document.getElementById('rotateBtn').classList.toggle('active');
    };

    window.exportRender = () => {
        const link = document.createElement('a');
        link.download = 'render_master.png';
        link.href = renderer.domElement.toDataURL();
        link.click();
    };

    // BUCLE DE ANIMACIÓN
    function animate() {
        requestAnimationFrame(animate);
        if(spinning) scene.rotation.y += 0.005;
        if(gravity && mainMesh.position.y > 1) mainMesh.position.y -= 0.1;
        
        orbit.update();
        renderer.render(scene, camera);
        
        // Simulación de FPS
        document.getElementById('ui-fps').innerText = Math.round(60 + Math.random()*2);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Atajos Blender
    window.addEventListener('keydown', (e) => {
        if(e.key === 'g') setMode('translate');
        if(e.key === 'r') setMode('rotate');
        if(e.key === 's') setMode('scale');
    });

</script>
</body>
</html>
