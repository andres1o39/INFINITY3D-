<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blood Strike Neon - Ultra Performance</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #instructions {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: cyan; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; cursor: pointer; text-align: center;
        }
        #hud {
            position: absolute; bottom: 30px; left: 30px; color: #0ff; 
            font-size: 20px; text-shadow: 0 0 10px cyan; pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 15px; height: 15px;
            border: 2px solid cyan; border-radius: 50%; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="instructions">
        <h1 style="font-size: 40px;">BLOOD STRIKE <span style="color:magenta">NEON</span></h1>
        <p>TECLAS: WASD (Mover) | ESPACIO (Saltar) | R (Recargar)</p>
        <p style="color: yellow;">[ CLICK PARA INICIAR DESPLIEGUE ]</p>
    </div>
    
    <div id="crosshair"></div>
    
    <div id="hud">
        ESTADO: INFILTRANDO... <br>
        MUNICIÓN: <span id="ammo">30</span>/30 <br>
        ACCIÓN: <span id="action">LISTO</span>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/PointerLockControls.js';

        // --- Escena y Renderer ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Iluminación ---
        const ambient = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambient);

        // --- Suelo de Luces de Colores ---
        const floorSize = 1000;
        const grid = new THREE.GridHelper(floorSize, 40, 0xff00ff, 0x00ffff);
        scene.add(grid);

        // Agregar luces puntuales de colores en el suelo
        const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
        for(let i = 0; i < 15; i++) {
            const pLight = new THREE.PointLight(colors[i % colors.length], 2, 50);
            pLight.position.set(Math.random()*400-200, 1, Math.random()*400-200);
            scene.add(pLight);
            
            // Cubo brillante bajo la luz
            const box = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.5, 2),
                new THREE.MeshBasicMaterial({ color: colors[i % colors.length] })
            );
            box.position.copy(pLight.position);
            box.position.y = 0.2;
            scene.add(box);
        }

        // --- Arma con Animación ---
        const weapon = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.7), new THREE.MeshStandardMaterial({color: 0x111111}));
        weapon.add(body);
        camera.add(weapon);
        scene.add(camera);
        weapon.position.set(0.4, -0.4, -0.7);

        // --- Lógica de Juego ---
        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('instructions').addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => document.getElementById('instructions').style.display = 'none');
        controls.addEventListener('unlock', () => document.getElementById('instructions').style.display = 'flex');

        let move = { f: false, b: false, l: false, r: false };
        let velocity = new THREE.Vector3();
        let canJump = false;
        let ammo = 30;
        let isReloading = false;

        camera.position.y = 150; // Altura inicial

        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') move.f = true;
            if(e.code === 'KeyS') move.b = true;
            if(e.code === 'KeyA') move.l = true;
            if(e.code === 'KeyD') move.r = true;
            if(e.code === 'Space' && canJump) {
                velocity.y += 10;
                canJump = false;
            }
            if(e.code === 'KeyR' && !isReloading) reload();
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') move.f = false;
            if(e.code === 'KeyS') move.b = false;
            if(e.code === 'KeyA') move.l = false;
            if(e.code === 'KeyD') move.r = false;
        });

        function reload() {
            isReloading = true;
            document.getElementById('action').innerText = "RECARGANDO...";
            document.getElementById('action').style.color = "yellow";
            
            // Animación de rotación del arma
            weapon.rotation.x = Math.PI / 4;
            
            setTimeout(() => {
                ammo = 30;
                isReloading = false;
                weapon.rotation.x = 0;
                document.getElementById('ammo').innerText = ammo;
                document.getElementById('action').innerText = "LISTO";
                document.getElementById('action').style.color = "#0ff";
            }, 1500);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                const delta = 0.1;
                
                // Gravedad y Fricción
                velocity.x -= velocity.x * 10.0 * 0.016;
                velocity.z -= velocity.z * 10.0 * 0.016;
                velocity.y -= 9.8 * 2.5 * 0.016; // Gravedad

                if (move.f) velocity.z -= 150.0 * 0.016;
                if (move.b) velocity.z += 150.0 * 0.016;
                if (move.l) velocity.x -= 150.0 * 0.016;
                if (move.r) velocity.x += 150.0 * 0.016;

                controls.moveRight(-velocity.x * 0.016);
                controls.moveForward(-velocity.z * 0.016);
                camera.position.y += (velocity.y * 0.016);

                // Colisión Suelo
                if (camera.position.y < 1.8) {
                    velocity.y = 0;
                    camera.position.y = 1.8;
                    canJump = true;
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
