<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity 3D - Pro Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; color: white; font-family: 'Inter', sans-serif; }
        #viewport { position: absolute; inset: 0; z-index: 1; }
        
        /* Toolbar Estilo Foto */
        .left-toolbar {
            position: absolute; left: 15px; top: 15px; bottom: 120px;
            width: 55px; background: rgba(15, 15, 20, 0.9);
            border: 1px solid #222; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; padding: 15px 0; z-index: 10;
        }
        .tool-btn {
            width: 40px; height: 40px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; cursor: pointer; transition: 0.2s; color: #666;
        }
        .tool-btn.active { background: #0ea5e9; color: white; box-shadow: 0 0 15px rgba(14, 165, 233, 0.5); }
        .tool-btn:hover:not(.active) { background: #1a1a1e; color: #fff; }

        /* Panel Derecho Inspector */
        .right-panel {
            position: absolute; right: 0; top: 0; bottom: 100px;
            width: 300px; background: rgba(10, 10, 12, 0.98);
            border-left: 1px solid #1a1a1a; z-index: 10; padding: 20px;
            display: flex; flex-direction: column; font-size: 11px; overflow-y: auto;
        }

        /* Timeline Inferior (Fiel a la foto) */
        .bottom-timeline {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 110px; background: #08080a; border-top: 1px solid #1a1a1a;
            z-index: 20; display: flex; flex-direction: column;
        }
        .ruler {
            height: 40px; border-bottom: 1px solid #151518; position: relative;
            overflow: hidden; font-size: 10px; color: #555; cursor: pointer;
        }
        .timeline-controls {
            flex: 1; display: flex; align-items: center; padding: 0 25px; gap: 15px;
        }

        /* Botones de acción */
        .btn-insert-key {
            background: #facc15; color: #000; font-weight: 900; font-size: 10px;
            padding: 10px 20px; border-radius: 6px; text-transform: uppercase;
        }
        .btn-play { background: #3b82f6; color: white; padding: 8px 25px; border-radius: 6px; font-weight: bold; }
        
        .prop-input { 
            width: 100%; background: #000; border: 1px solid #222; 
            color: #facc15; padding: 6px; border-radius: 4px; 
            font-family: monospace; font-size: 12px;
        }

        #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ef4444; z-index: 30; }

        /* Estilo de los items del outliner */
        .outliner-item {
            display: flex; align-items: center; gap: 8px; padding: 8px;
            border-radius: 6px; margin-bottom: 4px; cursor: pointer;
            border: 1px solid transparent;
        }
        .outliner-item.selected { background: #0ea5e9; border-color: #38bdf8; }
        .outliner-item:hover:not(.selected) { background: #1a1a1e; }
        
        /* Notificaciones */
        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #0ea5e9; color: white; padding: 10px 30px; border-radius: 50px;
            font-weight: bold; font-size: 12px; z-index: 1000; display: none;
        }
    </style>
</head>
<body>

    <div id="toast">MENSAJE</div>
    <div id="viewport"></div>

    <!-- Barra de Herramientas Izquierda -->
    <div class="left-toolbar">
        <div class="tool-btn active" id="t-move" title="Mover (T)"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M13 11V5.41l2.3 2.3 1.41-1.42L12 1.58l-4.71 4.71 1.41 1.42 2.3-2.3V11H5.41l2.3-2.3-1.42-1.41L1.58 12l4.71 4.71 1.42-1.41-2.3-2.3H11v5.59l-2.3-2.3-1.41 1.42L12 22.42l4.71-4.71-1.41-1.42-2.3 2.3V13h5.59l-2.3 2.3 1.41 1.42L22.42 12l-4.71-4.71-1.41 1.41 2.3 2.3H13z"/></svg></div>
        <div class="tool-btn" id="t-rotate" title="Rotar (R)"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 20c-4.41 0-8-3.59-8-8s3.59-8 8-8v3L17 3l-5-4v3c-5.52 0-10 4.48-10 10s4.48 10 10 10 10-4.48 10-10h-2c0 4.41-3.59 8-8 8z"/></svg></div>
        <div class="tool-btn" id="t-scale" title="Escalar (S)"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 19H5V5h14v14zM3 3v18h18V3H3zm15 15h-2V7h-4V5h6v13z"/></svg></div>
        
        <div class="w-full h-px bg-zinc-800 my-4"></div>
        
        <div class="tool-btn" onclick="addShape('cube')" title="Añadir Cubo"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.41 21.94 12.21 22 12 22C11.79 22 11.59 21.94 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.59 2.06 11.79 2 12 2C12.21 2 12.41 2.06 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5Z"/></svg></div>
        <div class="tool-btn" onclick="addShape('sphere')" title="Añadir Esfera"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z"/></svg></div>
        
        <div class="mt-auto"></div>
        <div class="tool-btn" onclick="document.getElementById('glb-loader').click()" title="Importar Actor (.glb)"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg></div>
    </div>

    <!-- Inspector Pro -->
    <div class="right-panel">
        <h3 class="text-sky-400 font-black mb-6 uppercase text-xs tracking-widest">● Inspector Pro</h3>
        
        <div id="inspector-content">
            <p class="text-zinc-600 italic">Selecciona un objeto para ver sus propiedades.</p>
        </div>
        
        <div class="mt-10">
            <h3 class="text-zinc-500 font-bold mb-4 uppercase text-[9px] tracking-widest">● Outliner de Escena</h3>
            <div id="outliner" class="space-y-1"></div>
        </div>

        <div class="mt-auto pt-6 border-t border-zinc-900">
            <button onclick="toggleSkeleton()" class="w-full bg-zinc-900 text-[10px] py-3 rounded-lg border border-zinc-800 hover:bg-zinc-800 transition mb-3">VISUALIZAR RIG (NEÓN)</button>
            <button onclick="deleteSelected()" class="w-full text-red-500 text-[9px] font-bold py-2 hover:bg-red-500/10 rounded transition">ELIMINAR SELECCIÓN</button>
        </div>
    </div>

    <!-- Timeline Inferior -->
    <div class="bottom-timeline">
        <div class="ruler" id="timeline-ruler">
            <div id="playhead"></div>
        </div>
        <div class="timeline-controls">
            <button class="btn-play" id="btn-play">▶ PLAY</button>
            <div class="bg-black border border-zinc-800 px-6 py-2 rounded text-yellow-400 font-mono text-lg font-bold min-w-[60px] text-center" id="current-frame-label">0</div>
            <button class="btn-insert-key" onclick="addKeyframe()">Insertar Key</button>
            <button class="bg-zinc-900 text-zinc-500 px-4 py-2 rounded text-[10px] font-bold border border-zinc-800" onclick="resetAnimation()">RESET</button>
        </div>
    </div>

    <input type="file" id="glb-loader" accept=".glb,.gltf" class="hidden" onchange="handleImport(event)">

    <script>
        let scene, camera, renderer, orbit, transform;
        let objects = [], animations = new Map();
        let currentFrame = 0, totalFrames = 250, isPlaying = false;
        let selectedObject = null;
        let skeletonHelpers = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 10, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('viewport').appendChild(renderer.domElement);

            // Grid y Luces Cinematográficas
            const grid = new THREE.GridHelper(60, 60, 0x1a1a1a, 0x111111);
            scene.add(grid);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const spot = new THREE.SpotLight(0x0ea5e9, 1);
            spot.position.set(15, 30, 15);
            spot.castShadow = true;
            scene.add(spot);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(-10, 20, 10);
            scene.add(sun);

            // Controles
            orbit = new THREE.OrbitControls(camera, renderer.domElement);
            transform = new THREE.TransformControls(camera, renderer.domElement);
            transform.addEventListener('dragging-changed', e => orbit.enabled = !e.value);
            transform.addEventListener('change', updateInspector);
            scene.add(transform);

            // Atajos de teclado
            window.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case 't': setTool('translate', 't-move'); break;
                    case 'r': setTool('rotate', 't-rotate'); break;
                    case 's': setTool('scale', 't-scale'); break;
                    case 'delete': deleteSelected(); break;
                }
            });

            initTimeline();
            setupTools();
            
            // Objeto de inicio
            addShape('cube', "Cubo_Inicio");
            
            animate();
        }

        // --- FUNCIONES DE CREACIÓN ---
        function addShape(type, name = "") {
            let geometry, material;
            material = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.3, metalness: 0.5 });
            
            if(type === 'cube') geometry = new THREE.BoxGeometry(3, 3, 3);
            else if(type === 'sphere') geometry = new THREE.SphereGeometry(2, 32, 32);
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.name = name || (type.charAt(0).toUpperCase() + type.slice(1) + "_" + objects.length);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.id = THREE.MathUtils.generateUUID();
            
            scene.add(mesh);
            objects.push(mesh);
            selectObject(mesh);
            updateOutliner();
            notify("OBJETO AÑADIDO");
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if(!file) return;
            
            notify("IMPORTANDO...");
            const loader = new THREE.GLTFLoader();
            const url = URL.createObjectURL(file);
            
            loader.load(url, (gltf) => {
                const model = gltf.scene;
                model.name = file.name.split('.')[0];
                model.id = THREE.MathUtils.generateUUID();
                
                // Configurar sombras y materiales
                model.traverse(node => {
                    if(node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });

                scene.add(model);
                objects.push(model);
                
                // Crear rig visual (estilo neón foto)
                const helper = new THREE.SkeletonHelper(model);
                helper.visible = false;
                scene.add(helper);
                skeletonHelpers.push(helper);

                selectObject(model);
                updateOutliner();
                notify("ACTOR IMPORTADO Y RIGGEADO");
            });
        }

        // --- SISTEMA DE SELECCIÓN ---
        function selectObject(obj) {
            if(!obj) {
                transform.detach();
                selectedObject = null;
            } else {
                selectedObject = obj;
                transform.attach(obj);
            }
            updateInspector();
            updateOutliner();
        }

        function updateInspector() {
            const container = document.getElementById('inspector-content');
            if(!selectedObject) {
                container.innerHTML = '<p class="text-zinc-600 italic">Nada seleccionado.</p>';
                return;
            }
            
            const p = selectedObject.position;
            const r = selectedObject.rotation;
            
            container.innerHTML = `
                <div class="bg-sky-500/10 p-4 rounded-xl border border-sky-500/30 mb-6">
                    <p class="text-[9px] text-sky-400 font-bold mb-1 tracking-widest">ELEMENTO SELECCIONADO</p>
                    <h4 class="text-white text-sm font-bold truncate">${selectedObject.name}</h4>
                </div>
                
                <div class="space-y-6">
                    <section>
                        <h5 class="text-zinc-500 text-[9px] font-bold mb-3 tracking-widest">POSICIÓN GLOBAL</h5>
                        <div class="space-y-2">
                            <div class="flex items-center gap-2">
                                <span class="text-red-500 font-bold w-4">X</span>
                                <input class="prop-input" value="${p.x.toFixed(2)}" onchange="updateSelected('px', this.value)">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-green-500 font-bold w-4">Y</span>
                                <input class="prop-input" value="${p.y.toFixed(2)}" onchange="updateSelected('py', this.value)">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-blue-500 font-bold w-4">Z</span>
                                <input class="prop-input" value="${p.z.toFixed(2)}" onchange="updateSelected('pz', this.value)">
                            </div>
                        </div>
                    </section>

                    <section>
                        <h5 class="text-zinc-500 text-[9px] font-bold mb-3 tracking-widest">ROTACIÓN (DEG)</h5>
                        <div class="grid grid-cols-1 gap-2">
                            <input class="prop-input" value="${(r.x * 57.3).toFixed(1)}°">
                            <input class="prop-input" value="${(r.y * 57.3).toFixed(1)}°">
                            <input class="prop-input" value="${(r.z * 57.3).toFixed(1)}°">
                        </div>
                    </section>
                </div>
            `;
        }

        function updateSelected(axis, val) {
            if(!selectedObject) return;
            const nVal = parseFloat(val);
            if(axis === 'px') selectedObject.position.x = nVal;
            if(axis === 'py') selectedObject.position.y = nVal;
            if(axis === 'pz') selectedObject.position.z = nVal;
        }

        function updateOutliner() {
            const container = document.getElementById('outliner');
            container.innerHTML = '';
            
            // Recorrer objetos y sus huesos si es un modelo importado
            objects.forEach(obj => {
                addOutlinerItem(container, obj, 0);
                
                // Si es un modelo complejo, mostrar huesos importantes para moverlos
                if(obj.type === 'Group' || obj.type === 'Scene') {
                    obj.traverse(child => {
                        if(child.isBone && child.name.length > 2) {
                            addOutlinerItem(container, child, 12);
                        }
                    });
                }
            });
        }

        function addOutlinerItem(parent, obj, indent) {
            const el = document.createElement('div');
            el.className = `outliner-item ${selectedObject === obj ? 'selected' : ''}`;
            el.style.paddingLeft = `${indent + 10}px`;
            
            const icon = obj.isBone ? '🦴' : '📦';
            el.innerHTML = `<span class="text-[10px] opacity-60">${icon}</span> <span class="truncate">${obj.name}</span>`;
            el.onclick = (e) => {
                e.stopPropagation();
                selectObject(obj);
            };
            parent.appendChild(el);
        }

        // --- ANIMACIÓN ---
        function addKeyframe() {
            if(!selectedObject) {
                notify("SELECCIONA ALGO PRIMERO");
                return;
            }
            if(!animations.has(selectedObject.id)) animations.set(selectedObject.id, []);
            
            const track = animations.get(selectedObject.id);
            const key = {
                frame: currentFrame,
                pos: selectedObject.position.clone(),
                rot: selectedObject.quaternion.clone(),
                scale: selectedObject.scale.clone()
            };

            const idx = track.findIndex(k => k.frame === currentFrame);
            if(idx >= 0) track[idx] = key;
            else { track.push(key); track.sort((a,b) => a.frame - b.frame); }
            
            notify("KEYFRAME GUARDADO");
        }

        function updateFrame() {
            document.getElementById('current-frame-label').innerText = currentFrame;
            document.getElementById('playhead').style.left = (currentFrame / totalFrames * 100) + '%';
            
            // Recorrer todos los objetos (incluyendo huesos animados)
            objects.concat(scene.children.filter(c => c.isBone)).forEach(obj => {
                const keys = animations.get(obj.id);
                if(!keys || keys.length === 0) return;

                let prev = keys.filter(k => k.frame <= currentFrame).pop();
                let next = keys.filter(k => k.frame > currentFrame)[0];

                if(prev && next) {
                    const t = (currentFrame - prev.frame) / (next.frame - prev.frame);
                    obj.position.lerpVectors(prev.pos, next.pos, t);
                    obj.quaternion.slerpQuaternions(prev.rot, next.rot, t);
                    obj.scale.lerpVectors(prev.scale, next.scale, t);
                } else if(prev) {
                    obj.position.copy(prev.pos);
                    obj.quaternion.copy(prev.rot);
                    obj.scale.copy(prev.scale);
                }
            });
            updateInspector();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(isPlaying) {
                currentFrame++;
                if(currentFrame > totalFrames) currentFrame = 0;
                updateFrame();
            }
            skeletonHelpers.forEach(h => h.update());
            renderer.render(scene, camera);
        }

        // --- UI UTILS ---
        function initTimeline() {
            const ruler = document.getElementById('timeline-ruler');
            for(let i=0; i<=totalFrames; i+=25) {
                const label = document.createElement('div');
                label.style.position = 'absolute';
                label.style.left = (i/totalFrames * 100) + '%';
                label.style.borderLeft = '1px solid #222';
                label.style.height = '15px';
                label.style.paddingLeft = '5px';
                label.innerText = i;
                ruler.appendChild(label);
            }
            ruler.onclick = (e) => {
                const rect = ruler.getBoundingClientRect();
                currentFrame = Math.round(((e.clientX - rect.left) / rect.width) * totalFrames);
                currentFrame = Math.max(0, Math.min(totalFrames, currentFrame));
                updateFrame();
            };
            document.getElementById('btn-play').onclick = () => {
                isPlaying = !isPlaying;
                document.getElementById('btn-play').innerText = isPlaying ? "⏸ PAUSE" : "▶ PLAY";
            };
        }

        function setTool(mode, id) {
            transform.setMode(mode);
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function setupTools() {
            const tools = { 't-move': 'translate', 't-rotate': 'rotate', 't-scale': 'scale' };
            Object.keys(tools).forEach(id => {
                document.getElementById(id).onclick = () => setTool(tools[id], id);
            });
        }

        function toggleSkeleton() {
            skeletonHelpers.forEach(h => h.visible = !h.visible);
            notify("RIG VISUAL ACTUALIZADO");
        }

        function notify(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        }

        function deleteSelected() {
            if(!selectedObject) return;
            scene.remove(selectedObject);
            objects = objects.filter(o => o !== selectedObject);
            animations.delete(selectedObject.id);
            transform.detach();
            selectedObject = null;
            updateOutliner();
            updateInspector();
            notify("ELIMINADO");
        }

        function resetAnimation() {
            isPlaying = false;
            currentFrame = 0;
            updateFrame();
            document.getElementById('btn-play').innerText = "▶ PLAY";
        }

        window.onload = init;
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
