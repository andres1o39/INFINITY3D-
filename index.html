<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Pro Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #282828;
            --bg-panel: #3d3d3d;
            --bg-sidebar: #212121;
            --accent: #4772b3;
            --text: #dbdbdb;
            --keyframe: #e2a126;
        }
        body { margin: 0; overflow: hidden; background-color: var(--bg-main); color: var(--text); font-family: 'Inter', sans-serif; font-size: 12px; }
        
        .viewport-container { position: relative; flex: 1; background: #1d1d1d; cursor: crosshair; }
        
        /* Layout */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        .top-nav { height: 24px; background: #181818; display: flex; align-items: center; padding: 0 10px; gap: 15px; border-bottom: 1px solid #000; }
        .main-area { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar Tools */
        .tools-bar { width: 40px; background: var(--bg-sidebar); border-right: 1px solid #111; display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 8px; }
        .tool-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; }
        .tool-icon.active { background: var(--accent); }
        .tool-icon:hover:not(.active) { background: #444; }

        /* Right Panels */
        .side-panel { width: 280px; background: var(--bg-sidebar); border-left: 1px solid #111; display: flex; flex-direction: column; }
        .panel-header { background: #333; padding: 4px 8px; font-weight: bold; font-size: 11px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; }
        .outliner { flex: 0.4; overflow-y: auto; border-bottom: 2px solid #111; }
        .properties { flex: 0.6; overflow-y: auto; padding: 10px; }

        /* Animation Dope Sheet */
        .animation-editor { height: 200px; background: var(--bg-main); border-top: 2px solid #111; display: flex; flex-direction: column; }
        .timeline-header { height: 28px; background: #333; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-bottom: 1px solid #111; }
        .dope-sheet { flex: 1; display: flex; overflow: hidden; }
        .channel-list { width: 150px; background: #2b2b2b; border-right: 1px solid #111; }
        .channel-item { padding: 4px 8px; border-bottom: 1px solid #333; font-size: 10px; display: flex; justify-content: space-between; }
        .timeline-grid { flex: 1; position: relative; background: #1d1d1d; background-image: linear-gradient(#2a2a2a 1px, transparent 1px), linear-gradient(90deg, #2a2a2a 1px, transparent 1px); background-size: 40px 100%; overflow-x: auto; }
        
        .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #4772b3; z-index: 20; pointer-events: none; }
        .playhead-handle { position: absolute; top: -5px; left: -5px; width: 12px; height: 12px; background: #4772b3; border-radius: 2px; }

        .keyframe-diamond { position: absolute; width: 10px; height: 10px; background: var(--keyframe); transform: rotate(45deg); top: 50%; margin-top: -5px; border: 1px solid #000; cursor: pointer; z-index: 10; }

        /* Input Styles */
        .prop-row { display: flex; align-items: center; margin-bottom: 4px; gap: 5px; }
        .prop-label { width: 70px; color: #aaa; }
        .prop-input { background: #111; border: 1px solid #444; color: #fff; padding: 2px 4px; width: 100%; border-radius: 2px; text-align: right; }
        
        .btn-blender { background: #555; border: 1px solid #222; padding: 4px 12px; border-radius: 3px; cursor: pointer; transition: 0.2s; }
        .btn-blender:hover { background: #666; }
        .btn-primary { background: #e2a126; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Barra Superior -->
    <div class="top-nav">
        <span style="color: #e2a126; font-weight: bold;">Blender</span>
        <span>Archivo</span>
        <span>Editar</span>
        <span>Render</span>
        <span>Vista</span>
    </div>

    <div class="main-area">
        <!-- Herramientas -->
        <div class="tools-bar">
            <div id="tool-select" class="tool-icon active" title="Seleccionar (W)">🖱️</div>
            <div id="tool-move" class="tool-icon" title="Mover (G)">✢</div>
            <div id="tool-rotate" class="tool-icon" title="Rotar (R)">🔄</div>
            <div id="tool-scale" class="tool-icon" title="Escalar (S)">⤢</div>
        </div>

        <!-- Viewport -->
        <div id="viewport" class="viewport-container">
            <div class="absolute top-2 left-2 text-[10px] text-gray-500 pointer-events-none">
                User Perspective<br>Cube | Frames: 250
            </div>
        </div>

        <!-- Paneles Derechos -->
        <div class="side-panel">
            <div class="outliner">
                <div class="panel-header"><span>Escena</span> 👁️</div>
                <div class="p-2 space-y-1">
                    <div class="flex items-center gap-2"><span class="text-orange-400">📦</span> Cube</div>
                    <div class="flex items-center gap-2 opacity-50"><span class="text-yellow-200">💡</span> Light</div>
                    <div class="flex items-center gap-2 opacity-50"><span class="text-blue-400">📷</span> Camera</div>
                </div>
            </div>
            <div class="properties">
                <div class="panel-header"><span>Transformación</span> 🛠️</div>
                <div class="mt-4">
                    <div class="text-[10px] font-bold text-gray-500 mb-2 uppercase">Localización</div>
                    <div class="prop-row"><span class="prop-label">X</span><input id="px" type="number" step="0.1" class="prop-input" value="0.00"></div>
                    <div class="prop-row"><span class="prop-label">Y</span><input id="py" type="number" step="0.1" class="prop-input" value="0.00"></div>
                    <div class="prop-row"><span class="prop-label">Z</span><input id="pz" type="number" step="0.1" class="prop-input" value="0.00"></div>
                </div>
                <div class="mt-4">
                    <div class="text-[10px] font-bold text-gray-500 mb-2 uppercase">Rotación</div>
                    <div class="prop-row"><span class="prop-label">X</span><input id="rx" type="number" step="1" class="prop-input" value="0.00"></div>
                    <div class="prop-row"><span class="prop-label">Y</span><input id="ry" type="number" step="1" class="prop-input" value="0.00"></div>
                    <div class="prop-row"><span class="prop-label">Z</span><input id="rz" type="number" step="1" class="prop-input" value="0.00"></div>
                </div>
                <div class="mt-6 flex flex-col gap-2">
                    <button id="btn-key" class="btn-blender btn-primary">Insertar Fotograma (I)</button>
                    <button id="btn-clear" class="btn-blender text-[10px]">Borrar Animación</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Línea de Tiempo / Dope Sheet -->
    <div class="animation-editor">
        <div class="timeline-header">
            <button id="play-btn" class="btn-blender">▶ Reproducir</button>
            <div class="flex items-center gap-2">
                <span>Frame:</span>
                <input id="frame-input" type="number" class="bg-black border-none w-12 text-center" value="0">
            </div>
        </div>
        <div class="dope-sheet">
            <div class="channel-list">
                <div class="channel-item"><span>Summary</span> 👁️</div>
                <div class="channel-item" style="padding-left: 15px;"><span>Location</span></div>
                <div class="channel-item" style="padding-left: 15px;"><span>Rotation</span></div>
                <div class="channel-item" style="padding-left: 15px;"><span>Scale</span></div>
            </div>
            <div id="timeline-container" class="timeline-grid">
                <div id="playhead" class="playhead">
                    <div class="playhead-handle"></div>
                </div>
                <!-- Los diamantes de keyframe se insertarán aquí -->
            </div>
        </div>
    </div>
</div>

<script>
    // Configuración Base de Three.js
    let scene, camera, renderer, controls, transformControls, cube;
    let currentFrame = 0;
    let isPlaying = false;
    const maxFrames = 250;
    let keyframes = []; // Formato: { frame, pos, rot, scl }

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        // Cámara
        const viewport = document.getElementById('viewport');
        camera = new THREE.PerspectiveCamera(50, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
        camera.position.set(6, 6, 6);

        // Renderer con mejor calidad
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        viewport.appendChild(renderer.domElement);

        // --- ILUMINACIÓN (Crucial para visibilidad) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Cuadrícula estilo Blender
        const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(grid);

        // El Cubo (Material Gris Blender)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshPhongMaterial({ 
            color: 0x909090, 
            specular: 0x111111,
            shininess: 30
        });
        cube = new THREE.Mesh(geometry, material);
        cube.position.y = 1;
        scene.add(cube);

        // Orbit Controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Transform Controls
        transformControls = new THREE.TransformControls(camera, renderer.domElement);
        transformControls.attach(cube);
        transformControls.addEventListener('dragging-changed', (e) => controls.enabled = !e.value);
        transformControls.addEventListener('change', updateUIFromCube);
        scene.add(transformControls);

        setupEvents();
        animate();
    }

    function setupEvents() {
        window.addEventListener('resize', () => {
            const viewport = document.getElementById('viewport');
            camera.aspect = viewport.clientWidth / viewport.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        });

        // Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key === 'g' || e.key === 'G') transformControls.setMode('translate');
            if (e.key === 'r' || e.key === 'R') transformControls.setMode('rotate');
            if (e.key === 's' || e.key === 'S') transformControls.setMode('scale');
            if (e.key === 'i' || e.key === 'I') addKeyframe();
            if (e.key === ' ') { e.preventDefault(); togglePlay(); }
        });

        document.getElementById('play-btn').onclick = togglePlay;
        document.getElementById('btn-key').onclick = addKeyframe;
        document.getElementById('btn-clear').onclick = clearAnimation;

        // Click en línea de tiempo para mover playhead
        const timeline = document.getElementById('timeline-container');
        timeline.onclick = (e) => {
            const rect = timeline.getBoundingClientRect();
            const x = e.clientX - rect.left + timeline.scrollLeft;
            const frame = Math.round((x / 40));
            goToFrame(Math.min(maxFrames, Math.max(0, frame)));
        };

        // Inputs manuales
        ['px', 'py', 'pz', 'rx', 'ry', 'rz'].forEach(id => {
            document.getElementById(id).oninput = updateCubeFromUI;
        });
    }

    function addKeyframe() {
        // Eliminar keyframe existente en este cuadro
        keyframes = keyframes.filter(k => k.frame !== currentFrame);
        
        keyframes.push({
            frame: currentFrame,
            pos: cube.position.clone(),
            rot: cube.rotation.clone(),
            scl: cube.scale.clone()
        });
        
        keyframes.sort((a, b) => a.frame - b.frame);
        drawKeyframes();
        console.log("Keyframe added at frame", currentFrame);
    }

    function drawKeyframes() {
        const container = document.getElementById('timeline-container');
        // Limpiar diamantes viejos (manteniendo el playhead)
        const oldKeys = container.querySelectorAll('.keyframe-diamond');
        oldKeys.forEach(k => k.remove());

        keyframes.forEach(k => {
            const diamond = document.createElement('div');
            diamond.className = 'keyframe-diamond';
            diamond.style.left = (k.frame * 40) + 'px';
            container.appendChild(diamond);
        });
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('play-btn').textContent = isPlaying ? "⏸ Pausar" : "▶ Reproducir";
    }

    function goToFrame(f) {
        currentFrame = f;
        document.getElementById('frame-input').value = currentFrame;
        document.getElementById('playhead').style.left = (currentFrame * 40) + 'px';
        applyAnimation();
    }

    function applyAnimation() {
        if (keyframes.length === 0) return;

        // Buscar los dos keyframes entre los que estamos
        let prev = null;
        let next = null;

        for (let i = 0; i < keyframes.length; i++) {
            if (keyframes[i].frame <= currentFrame) prev = keyframes[i];
            if (keyframes[i].frame > currentFrame && !next) next = keyframes[i];
        }

        if (prev && next) {
            const t = (currentFrame - prev.frame) / (next.frame - prev.frame);
            // Interpolación Suave
            cube.position.lerpVectors(prev.pos, next.pos, t);
            cube.scale.lerpVectors(prev.scl, next.scl, t);
            
            // Rotación suave con cuaterniones para evitar problemas de gimbal lock
            const qPrev = new THREE.Quaternion().setFromEuler(prev.rot);
            const qNext = new THREE.Quaternion().setFromEuler(next.rot);
            cube.quaternion.slerpQuaternions(qPrev, qNext, t);
        } else if (prev) {
            cube.position.copy(prev.pos);
            cube.rotation.copy(prev.rot);
            cube.scale.copy(prev.scl);
        }
        updateUIFromCube();
    }

    function updateUIFromCube() {
        document.getElementById('px').value = cube.position.x.toFixed(2);
        document.getElementById('py').value = cube.position.y.toFixed(2);
        document.getElementById('pz').value = cube.position.z.toFixed(2);
        document.getElementById('rx').value = (cube.rotation.x * 180 / Math.PI).toFixed(0);
        document.getElementById('ry').value = (cube.rotation.y * 180 / Math.PI).toFixed(0);
        document.getElementById('rz').value = (cube.rotation.z * 180 / Math.PI).toFixed(0);
    }

    function updateCubeFromUI() {
        cube.position.set(
            parseFloat(document.getElementById('px').value),
            parseFloat(document.getElementById('py').value),
            parseFloat(document.getElementById('pz').value)
        );
        cube.rotation.set(
            parseFloat(document.getElementById('rx').value) * Math.PI / 180,
            parseFloat(document.getElementById('ry').value) * Math.PI / 180,
            parseFloat(document.getElementById('rz').value) * Math.PI / 180
        );
    }

    function clearAnimation() {
        keyframes = [];
        drawKeyframes();
    }

    function animate() {
        requestAnimationFrame(animate);
        
        if (isPlaying) {
            currentFrame++;
            if (currentFrame > maxFrames) currentFrame = 0;
            goToFrame(currentFrame);
        }

        controls.update();
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
