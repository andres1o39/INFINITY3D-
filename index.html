<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gemini OS - Quantum Kernel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main: #00ff88; --bg: #050505; --win: #121212; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; cursor: default; }
        body { margin: 0; height: 100vh; background: #000; color: white; font-family: 'JetBrains Mono', monospace; overflow: hidden; }
        
        /* Wallpaper con Canvas (Opcional: puedes poner una imagen) */
        #wallpaper { position: fixed; width: 100%; height: 100%; z-index: -1; background: linear-gradient(45deg, #050505, #1a1a2e); }

        /* Escritorio Estilo Grid */
        #desktop { height: calc(100% - 45px); padding: 25px; display: grid; grid-template-columns: repeat(auto-fill, 100px); grid-auto-rows: 100px; gap: 20px; }
        .app-icon { display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; border-radius: 12px; }
        .app-icon:hover { background: var(--glass); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,255,136,0.2); }
        .app-icon i { font-size: 42px; margin-bottom: 8px; filter: drop-shadow(0 0 5px var(--main)); }
        .app-icon span { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }

        /* Ventanas Quantum */
        .window { position: absolute; width: 700px; height: 450px; background: var(--win); border: 1px solid #333; border-radius: 10px; display: none; flex-direction: column; box-shadow: 0 25px 50px rgba(0,0,0,0.8); z-index: 10; overflow: hidden; }
        .win-bar { background: #1a1a1a; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; cursor: move; }
        .win-ctrls { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; cursor: pointer; }
        .win-content { flex: 1; padding: 20px; overflow-y: auto; }

        /* Terminal Estilo Hacker */
        .terminal { background: #000; color: #00ff00; font-family: 'Courier New'; padding: 10px; height: 100%; }
        .terminal-input { background: transparent; border: none; color: #00ff00; outline: none; width: 100%; }

        /* Monitor de Sistema */
        .stat-bar { background: #333; height: 10px; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        .stat-fill { background: var(--main); height: 100%; width: 0%; transition: 1s; }

        /* Taskbar Inferior */
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 45px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 15px; border-top: 1px solid #222; z-index: 10000; }
        .start-btn { color: var(--main); font-size: 24px; cursor: pointer; margin-right: 20px; }
        #clock { margin-left: auto; color: var(--main); font-size: 13px; }
    </style>
</head>
<body>

<div id="wallpaper"></div>

<div id="desktop">
    <div class="app-icon" onclick="openW('win-terminal')"><i class="fas fa-terminal" style="color: #00ff88;"></i><span>Kernel</span></div>
    <div class="app-icon" onclick="openW('win-files')"><i class="fas fa-folder-open" style="color: #ffca28;"></i><span>Archivos</span></div>
    <div class="app-icon" onclick="openW('win-stats')"><i class="fas fa-microchip" style="color: #ff4081;"></i><span>Recursos</span></div>
    <div class="app-icon" onclick="openW('win-discord')"><i class="fab fa-discord" style="color: #5865F2;"></i><span>Discord</span></div>
    <div class="app-icon" onclick="openW('win-code')"><i class="fas fa-code" style="color: #00d2ff;"></i><span>IDE Dev</span></div>
</div>

<div id="win-terminal" class="window">
    <div class="win-bar" onmousedown="drag(this.parentElement)">
        <span><i class="fas fa-terminal"></i> root@gemini-os:~</span>
        <div class="win-ctrls"><div class="dot red" onclick="closeW('win-terminal')"></div></div>
    </div>
    <div class="win-content" style="padding:0;">
        <div class="terminal" id="term-out">
            <div>Gemini Kernel v4.0.0-release</div>
            <div>Escribe 'help' para ver comandos...</div>
            <div style="display:flex"><span>$ &nbsp;</span><input type="text" class="terminal-input" id="term-in" autofocus onkeypress="execTerm(event)"></div>
        </div>
    </div>
</div>

<div id="win-stats" class="window" style="width:350px; height:300px;">
    <div class="win-bar" onmousedown="drag(this.parentElement)">
        <span>Monitor de Energía</span>
        <div class="win-ctrls"><div class="dot red" onclick="closeW('win-stats')"></div></div>
    </div>
    <div class="win-content">
        CPU: <span id="cpu-val">0%</span> <div class="stat-bar"><div id="cpu-fill" class="stat-fill"></div></div>
        RAM: <span id="ram-val">0%</span> <div class="stat-bar"><div id="ram-fill" class="stat-fill" style="background:#00d2ff"></div></div>
        GPU: <span id="gpu-val">0%</span> <div class="stat-bar"><div id="gpu-fill" class="stat-fill" style="background:#ff4081"></div></div>
    </div>
</div>

<div id="win-files" class="window">
    <div class="win-bar" onmousedown="drag(this.parentElement)">
        <span>Mi Almacenamiento</span>
        <div class="win-ctrls"><div class="dot red" onclick="closeW('win-files')"></div></div>
    </div>
    <div class="win-content">
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:20px; text-align:center;">
            <div ondblclick="alert('Carpeta vacía')"><i class="fas fa-folder" style="font-size:40px; color:#ffca28"></i><br>Proyectos</div>
            <div ondblclick="alert('Contiene: index.html, script.js')"><i class="fas fa-folder" style="font-size:40px; color:#ffca28"></i><br>Downloads</div>
            <div ondblclick="alert('Acceso denegado: Root solo')"><i class="fas fa-folder-lock" style="font-size:40px; color:#ff5f56"></i><br>System32</div>
        </div>
    </div>
</div>

<div id="taskbar">
    <i class="fas fa-atom start-btn"></i>
    <div id="clock"></div>
</div>

<script>
    let activeWin = null;
    let zIdx = 100;

    function openW(id) {
        const w = document.getElementById(id);
        w.style.display = 'flex';
        w.style.zIndex = ++zIdx;
    }

    function closeW(id) { document.getElementById(id).style.display = 'none'; }

    // Logica Terminal
    function execTerm(e) {
        if(e.key === 'Enter') {
            const out = document.getElementById('term-out');
            const cmd = e.target.value.toLowerCase();
            let res = "Comando no reconocido.";
            
            if(cmd === 'help') res = "Comandos: cls, neofetch, exit, install --update, date";
            if(cmd === 'neofetch') res = "OS: Gemini Quantum<br>Kernel: 4.0.0<br>Uptime: 2 mins<br>Shell: bash";
            if(cmd === 'cls') { out.innerHTML = ''; e.target.value = ''; return; }
            
            const div = document.createElement('div');
            div.innerHTML = `<div>$ ${cmd}</div><div>${res}</div><br>`;
            out.insertBefore(div, out.lastElementChild);
            e.target.value = '';
            out.scrollTop = out.scrollHeight;
        }
    }

    // Monitor de Recursos (Simulado pero dinámico)
    setInterval(() => {
        const cpu = Math.floor(Math.random() * 40) + 10;
        const ram = Math.floor(Math.random() * 20) + 60;
        const gpu = Math.floor(Math.random() * 30);
        
        document.getElementById('cpu-fill').style.width = cpu + "%";
        document.getElementById('cpu-val').innerText = cpu + "%";
        document.getElementById('ram-fill').style.width = ram + "%";
        document.getElementById('ram-val').innerText = ram + "%";
        document.getElementById('gpu-fill').style.width = gpu + "%";
        document.getElementById('gpu-val').innerText = gpu + "%";
    }, 2000);

    // Drag and Drop
    function drag(el) {
        el.style.zIndex = ++zIdx;
        document.onmousemove = (e) => {
            el.style.left = e.clientX - 350 + "px";
            el.style.top = e.clientY - 20 + "px";
        }
        document.onmouseup = () => document.onmousemove = null;
    }

    // Reloj
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleString();
    }, 1000);
</script>

</body>
</html>
