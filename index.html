<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mini Blender Clone - Con Efectos y Objetos</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; font-family: sans-serif; }
        #ui-top, #ui-bottom, #ui-left {
            position: absolute;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto; /* Permitir interacción con los elementos del UI */
            z-index: 1000;
        }
        #ui-left {
            top: 10px;
            left: 10px;
        }
        #ui-top {
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
        }
        #ui-bottom {
            bottom: 10px;
            left: 10px;
        }
        kbd {
            background: #eee;
            color: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background: #0056b3;
        }
        .ui-section label {
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="ui-top">
    <div class="ui-section">
        <label>
            <input type="checkbox" id="toggleFog"> Niebla
        </label>
        <label>
            <input type="checkbox" id="toggleRain"> Lluvia (Agua)
        </label>
        <label>
            <input type="checkbox" id="toggleFire"> Fuego
        </label>
    </div>
</div>

<div id="ui-left">
    <h2>Viewport Control</h2>
    <p><kbd>W</kbd> Mover</p>
    <p><kbd>E</kbd> Rotar</p>
    <p><kbd>R</kbd> Escalar</p>
    <p><kbd>Q</kbd> Ocultar Controles</p>
</div>

<div id="ui-bottom">
    <h2>Objetos</h2>
    <button id="addCubeButton">Añadir Cubo</button>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // --- CONFIGURACIÓN BÁSICA ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x282828);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- ELEMENTOS DE LA ESCENA ---
    // Rejilla (Grid)
    const gridHelper = new THREE.GridHelper(10, 10, 0x888888, 0x444444);
    scene.add(gridHelper);

    // Luces
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 1, 2);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040, 0.8)); // Aumentar luz ambiental

    // El Cubo Inicial
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const initialMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff88 });
    const cube = new THREE.Mesh(geometry, initialMaterial);
    scene.add(cube);

    const objects = [cube]; // Array para guardar todos los objetos (cubos)

    // --- CONTROLES ---
    // Órbita (Navegación de cámara)
    const orbit = new OrbitControls(camera, renderer.domElement);

    // Transformación (Mover, Rotar, Escalar)
    const transformControls = new TransformControls(camera, renderer.domElement);
    transformControls.attach(cube); // Adjuntar al cubo inicial
    scene.add(transformControls);

    // Evitar que la cámara se mueva mientras arrastramos el cubo
    transformControls.addEventListener('dragging-changed', (event) => {
        orbit.enabled = !event.value;
    });

    // --- LÓGICA DE TECLADO (W, E, R, Q) ---
    window.addEventListener('keydown', (event) => {
        // Asegurarse de que no estamos escribiendo en un input
        if (event.target.tagName === 'INPUT') return;

        switch (event.key.toLowerCase()) {
            case 'w':
                transformControls.setMode('translate');
                break;
            case 'e':
                transformControls.setMode('rotate');
                break;
            case 'r':
                transformControls.setMode('scale');
                break;
            case 'q':
                transformControls.showX = transformControls.showY = transformControls.showZ = !transformControls.showX;
                break;
        }
    });

    // --- EFECTOS DE PARTÍCULAS Y NIEBLA ---
    let rainParticles = null;
    let fireParticles = null;

    // Niebla
    const toggleFog = document.getElementById('toggleFog');
    toggleFog.addEventListener('change', (event) => {
        if (event.target.checked) {
            scene.fog = new THREE.Fog(0x888888, 5, 50); // Color, distancia de inicio, distancia final
        } else {
            scene.fog = null;
        }
    });

    // Lluvia (Partículas de agua)
    const toggleRain = document.getElementById('toggleRain');
    toggleRain.addEventListener('change', (event) => {
        if (event.target.checked) {
            const particleCount = 2000;
            const positions = new Float32Array(particleCount * 3);
            const velocities = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() * 20 - 10); // x
                positions[i + 1] = (Math.random() * 20 + 10); // y (arriba)
                positions[i + 2] = (Math.random() * 20 - 10); // z

                velocities[i] = 0; // x
                velocities[i + 1] = -0.1 - Math.random() * 0.1; // y (hacia abajo)
                velocities[i + 2] = 0; // z
            }

            const particleGeometry = new THREE.BufferGeometry();
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));

            const particleMaterial = new THREE.PointsMaterial({
                color: 0xADD8E6, // Azul claro
                size: 0.1,
                transparent: true,
                opacity: 0.7
            });

            rainParticles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(rainParticles);
        } else {
            if (rainParticles) {
                scene.remove(rainParticles);
                rainParticles.geometry.dispose();
                rainParticles.material.dispose();
                rainParticles = null;
            }
        }
    });

    // Fuego (Partículas de llamas simples)
    const toggleFire = document.getElementById('toggleFire');
    toggleFire.addEventListener('change', (event) => {
        if (event.target.checked) {
            const particleCount = 500;
            const positions = new Float32Array(particleCount * 3);
            const velocities = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount); // Para escalar el tamaño

            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 0.5; // x cerca del origen
                positions[i + 1] = Math.random() * 0.5; // y
                positions[i + 2] = (Math.random() - 0.5) * 0.5; // z

                velocities[i] = (Math.random() - 0.5) * 0.01; // x
                velocities[i + 1] = 0.05 + Math.random() * 0.05; // y (hacia arriba)
                velocities[i + 2] = (Math.random() - 0.5) * 0.01; // z
                
                sizes[i / 3] = 0.2 + Math.random() * 0.3; // Tamaño inicial
            }

            const particleGeometry = new THREE.BufferGeometry();
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
            particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));


            const particleMaterial = new THREE.PointsMaterial({
                color: 0xFF4500, // Naranja rojizo
                size: 0.3,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending // Para que parezca que brilla
            });

            fireParticles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(fireParticles);
        } else {
            if (fireParticles) {
                scene.remove(fireParticles);
                fireParticles.geometry.dispose();
                fireParticles.material.dispose();
                fireParticles = null;
            }
        }
    });


    // --- GESTIÓN DE OBJETOS ---
    const addCubeButton = document.getElementById('addCubeButton');
    addCubeButton.addEventListener('click', () => {
        const newMaterial = new THREE.MeshStandardMaterial({
            color: new THREE.Color(Math.random(), Math.random(), Math.random()) // Color aleatorio
        });
        const newCube = new THREE.Mesh(geometry, newMaterial);

        // Posición aleatoria
        newCube.position.set(
            (Math.random() * 6 - 3),
            0.5, // Para que esté sobre la rejilla
            (Math.random() * 6 - 3)
        );

        scene.add(newCube);
        objects.push(newCube);

        // Opcional: Adjuntar los TransformControls al último cubo añadido
        transformControls.attach(newCube);
    });


    // --- ANIMACIÓN Y RESIZE ---
    const clock = new THREE.Clock(); // Para controlar el tiempo de las partículas

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta(); // Tiempo transcurrido desde el último frame

        // Actualizar partículas de lluvia
        if (rainParticles) {
            const positions = rainParticles.geometry.attributes.position.array;
            const velocities = rainParticles.geometry.attributes.velocity.array;

            for (let i = 0; i < positions.length; i += 3) {
                positions[i] += velocities[i] * delta * 50; // Acelerar el movimiento
                positions[i + 1] += velocities[i + 1] * delta * 50;
                positions[i + 2] += velocities[i + 2] * delta * 50;

                // Reiniciar partículas que caen por debajo
                if (positions[i + 1] < -5) {
                    positions[i + 1] = 10 + Math.random() * 5; // Reaparece arriba
                    positions[i] = (Math.random() * 20 - 10);
                    positions[i + 2] = (Math.random() * 20 - 10);
                }
            }
            rainParticles.geometry.attributes.position.needsUpdate = true;
        }

        // Actualizar partículas de fuego
        if (fireParticles) {
            const positions = fireParticles.geometry.attributes.position.array;
            const velocities = fireParticles.geometry.attributes.velocity.array;
            const sizes = fireParticles.geometry.attributes.size.array;
            const originalSizes = fireParticles.userData.originalSizes || sizes.slice(); // Guardar tamaños originales
            fireParticles.userData.originalSizes = originalSizes;

            for (let i = 0; i < positions.length; i += 3) {
                positions[i] += velocities[i] * delta * 10;
                positions[i + 1] += velocities[i + 1] * delta * 10;
                positions[i + 2] += velocities[i + 2] * delta * 10;

                // Reducir el tamaño de la partícula a medida que sube (o pasa el tiempo)
                sizes[i / 3] = originalSizes[i / 3] * (1 - (positions[i + 1] / 1.5)); // Ejemplo simple de escalado

                // Reiniciar partículas que suben demasiado
                if (positions[i + 1] > 2) {
                    positions[i] = (Math.random() - 0.5) * 0.5;
                    positions[i + 1] = Math.random() * 0.5;
                    positions[i + 2] = (Math.random() - 0.5) * 0.5;
                    sizes[i / 3] = originalSizes[i / 3]; // Restablecer tamaño
                }
            }
            fireParticles.geometry.attributes.position.needsUpdate = true;
            fireParticles.geometry.attributes.size.needsUpdate = true; // Si el tamaño cambia
        }


        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
