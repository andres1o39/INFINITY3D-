<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gemini OS - REPARADO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #00ff88; --bg: #0a0a0a; --win: #1a1a1a; }
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            background: radial-gradient(circle, #1a1a2e 0%, #000 100%);
            font-family: 'Segoe UI', sans-serif; color: white;
        }

        /* Escritorio: Los iconos ahora son accesibles */
        #desktop { 
            height: calc(100% - 50px); padding: 20px; 
            display: grid; grid-template-columns: repeat(auto-fill, 110px); 
            grid-template-rows: repeat(auto-fill, 110px); gap: 15px;
            position: relative; z-index: 1;
        }
        .app-icon { 
            text-align: center; cursor: pointer; padding: 10px; 
            border-radius: 10px; transition: 0.2s; z-index: 2;
        }
        .app-icon:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
        .app-icon i { font-size: 45px; display: block; margin-bottom: 8px; color: var(--accent); }
        .app-icon span { font-size: 12px; font-weight: bold; }

        /* Ventanas Reparadas */
        .window { 
            position: absolute; width: 550px; height: 400px; 
            background: var(--win); border-radius: 12px; display: none; 
            flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.7); 
            z-index: 100; border: 1px solid #333; overflow: hidden;
        }
        .win-header { 
            background: #252525; padding: 12px; cursor: move; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .win-body { flex: 1; padding: 15px; overflow-y: auto; color: #eee; }
        .close-btn { color: #ff5555; cursor: pointer; font-size: 20px; }

        /* Taskbar */
        #taskbar { 
            position: fixed; bottom: 0; width: 100%; height: 50px; 
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); 
            display: flex; align-items: center; padding: 0 20px; border-top: 1px solid #333; z-index: 1000;
        }
        #clock { margin-left: auto; font-family: monospace; color: var(--accent); }

        /* Estilos Apps */
        .store-item { background: #2d2d2d; padding: 10px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .btn-install { background: var(--accent); color: black; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="desktop">
    <div class="app-icon" onclick="openWin('win-ai')">
        <i class="fas fa-robot"></i><span>Claude AI</span>
    </div>
    <div class="app-icon" onclick="openWin('win-store')">
        <i class="fas fa-shopping-cart"></i><span>Infi Store</span>
    </div>
    <div class="app-icon" onclick="openWin('win-files')">
        <i class="fas fa-folder"></i><span>Archivos</span>
    </div>
</div>

<div id="win-ai" class="window">
    <div class="win-header" onmousedown="startDrag(event, this.parentElement)">
        <span><i class="fas fa-robot"></i> Claude AI</span>
        <i class="fas fa-times-circle close-btn" onclick="closeWin('win-ai')"></i>
    </div>
    <div class="win-body">
        <div id="ai-chat" style="height: 250px; background: #000; border-radius: 5px; padding: 10px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #444; color: #0f0;">
            > Sistema iniciado. Esperando comandos...
        </div>
        <input type="text" id="ai-in" placeholder="Pregunta algo..." style="width: 100%; padding: 10px; background: #222; border: 1px solid var(--accent); color: white;" onkeypress="runAI(event)">
    </div>
</div>

<div id="win-store" class="window">
    <div class="win-header" onmousedown="startDrag(event, this.parentElement)">
        <span><i class="fas fa-shopping-cart"></i> Infi Store</span>
        <i class="fas fa-times-circle close-btn" onclick="closeWin('win-store')"></i>
    </div>
    <div class="win-body">
        <div class="store-item">
            <span>🎮 Geometry Dash (Web)</span>
            <button class="btn-install" onclick="installApp('Geometry', 'fa-square', '#00ff00')">Instalar</button>
        </div>
        <div class="store-item">
            <span>💬 Discord Chat</span>
            <button class="btn-install" onclick="installApp('Discord', 'fa-brands fa-discord', '#5865F2')">Instalar</button>
        </div>
        <div class="store-item">
            <span>📺 YouTube Player</span>
            <button class="btn-install" onclick="installApp('YouTube', 'fa-brands fa-youtube', '#ff0000')">Instalar</button>
        </div>
    </div>
</div>

<div id="win-files" class="window">
    <div class="win-header" onmousedown="startDrag(event, this.parentElement)">
        <span><i class="fas fa-folder"></i> Explorador</span>
        <i class="fas fa-times-circle close-btn" onclick="closeWin('win-files')"></i>
    </div>
    <div class="win-body">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center;">
            <div><i class="fas fa-folder" style="font-size: 40px; color: #ffca28;"></i><br>Documentos</div>
            <div><i class="fas fa-folder" style="font-size: 40px; color: #ffca28;"></i><br>Imágenes</div>
            <div><i class="fas fa-file-code" style="font-size: 40px; color: #00d2ff;"></i><br>index.html</div>
        </div>
    </div>
</div>

<div id="taskbar">
    <i class="fas fa-shield-virus" style="color: var(--accent); font-size: 24px;"></i>
    <div id="clock"></div>
</div>

<script>
    let highestZ = 100;

    // Abrir y Cerrar Apps (REPARADO)
    function openWin(id) {
        const win = document.getElementById(id);
        win.style.display = 'flex';
        win.style.zIndex = ++highestZ;
    }

    function closeWin(id) {
        document.getElementById(id).style.display = 'none';
    }

    // Instalador Infi Store
    function installApp(name, icon, color) {
        const desktop = document.getElementById('desktop');
        const div = document.createElement('div');
        div.className = 'app-icon';
        div.innerHTML = `<i class="${icon}" style="color:${color}"></i><span>${name}</span>`;
        div.onclick = () => alert(`Ejecutando ${name} v1.0...`);
        desktop.appendChild(div);
        alert(`${name} se ha instalado en el escritorio.`);
    }

    // Lógica IA
    function runAI(e) {
        if(e.key === 'Enter') {
            const chat = document.getElementById('ai-chat');
            chat.innerHTML += `<div><span style="color:white">Usted:</span> ${e.target.value}</div>`;
            setTimeout(() => {
                chat.innerHTML += `<div><span style="color:var(--accent)">Claude:</span> Analizando "${e.target.value}"... Acceso al kernel permitido.</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 500);
            e.target.value = '';
        }
    }

    // SISTEMA DE ARRASTRE REPARADO (No bloquea los clics)
    function startDrag(e, win) {
        highestZ++;
        win.style.zIndex = highestZ;
        
        let shiftX = e.clientX - win.getBoundingClientRect().left;
        let shiftY = e.clientY - win.getBoundingClientRect().top;

        function moveAt(pageX, pageY) {
            win.style.left = pageX - shiftX + 'px';
            win.style.top = pageY - shiftY + 'px';
        }

        function onMouseMove(event) {
            moveAt(event.pageX, event.pageY);
        }

        document.addEventListener('mousemove', onMouseMove);

        document.onmouseup = function() {
            document.removeEventListener('mousemove', onMouseMove);
            document.onmouseup = null;
        };
    }

    // Reloj
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>

</body>
</html>
