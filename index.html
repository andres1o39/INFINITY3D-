<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Studio Ultimate - High Performance Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --b-bg: #111111;
            --b-panel: #202020;
            --b-accent: #e87d0d;
            --b-accent-light: #ff9d3d;
            --b-text: #eeeeee;
            --b-border: #333333;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: var(--b-bg); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--b-text);
        }

        /* Viewport Principal */
        #viewport {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* Interfaz Superior */
        #header-ui {
            position: absolute; top: 0; left: 0; right: 0; height: 40px;
            background: rgba(32, 32, 32, 0.9); border-bottom: 1px solid var(--b-border);
            display: flex; align-items: center; padding: 0 15px; z-index: 10;
            backdrop-filter: blur(10px);
        }

        .logo { font-weight: 800; color: var(--b-accent); margin-right: 25px; letter-spacing: 1px; }

        /* Panel Lateral de Propiedades */
        #sidebar {
            position: absolute; top: 50px; right: 10px; width: 260px;
            background: rgba(25, 25, 25, 0.85); border: 1px solid var(--b-border);
            border-radius: 8px; padding: 15px; z-index: 10;
            backdrop-filter: blur(15px); max-height: calc(100vh - 200px);
            overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        /* Timeline / Dope Sheet */
        #timeline-ui {
            position: absolute; bottom: 0; left: 0; right: 0; height: 140px;
            background: rgba(20, 20, 20, 0.95); border-top: 1px solid var(--b-border);
            z-index: 10; display: flex; flex-direction: column;
        }

        #timeline-controls {
            height: 35px; background: #2a2a2a; border-bottom: 1px solid #111;
            display: flex; align-items: center; padding: 0 15px; gap: 15px;
        }

        #track-container {
            flex-grow: 1; position: relative; background: #111;
            background-image: linear-gradient(90deg, #222 1px, transparent 1px);
            background-size: 50px 100%; cursor: crosshair;
        }

        #playhead {
            position: absolute; top: 0; bottom: 0; width: 2px;
            background: #00ffcc; z-index: 5; pointer-events: none;
        }

        .key-marker {
            position: absolute; top: 50%; width: 10px; height: 10px;
            background: var(--b-accent); border: 1px solid #fff;
            transform: translate(-50%, -50%) rotate(45deg); cursor: pointer;
        }

        /* Estilos de Controles */
        .group { margin-bottom: 18px; }
        .group-label { font-size: 10px; color: #777; text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: block; }
        
        .btn {
            background: #3d3d3d; border: 1px solid #555; color: white;
            padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 11px;
            width: 100%; transition: 0.2s; margin-bottom: 4px;
        }
        .btn:hover { background: #4d4d4d; border-color: var(--b-accent); }
        .btn.active { background: var(--b-accent); border-color: #fff; }

        input[type="range"] { width: 100%; accent-color: var(--b-accent); margin: 8px 0; }
        
        #frame-info {
            position: absolute; top: 50px; left: 20px; font-size: 40px; 
            font-weight: 900; color: var(--b-accent); opacity: 0.2; pointer-events: none;
        }

        .stat-badge { font-size: 10px; color: #00ff00; background: rgba(0,255,0,0.1); padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="header-ui">
        <span class="logo">BLENDER ULTIMATE</span>
        <button class="btn" style="width:auto; margin:0 5px;" onclick="togglePlay()" id="play-btn">REPRODUCIR (Espacio)</button>
        <button class="btn" style="width:auto; margin:0 5px;" onclick="insertKey()">INSERTAR KEYFRAME (I)</button>
        <div style="flex-grow:1"></div>
        <span class="stat-badge">RENDER: EEVEE+ (REAL-TIME)</span>
    </div>

    <div id="viewport"></div>
    <div id="frame-info">000</div>

    <div id="sidebar">
        <div class="group">
            <span class="group-label">Iluminación Física (HDRI)</span>
            <label style="font-size:11px">Intensidad Solar: <span id="sun-val">2.0</span></label>
            <input type="range" id="sun-slider" min="0" max="10" step="0.1" value="2">
            
            <label style="font-size:11px">Rotación del Cielo</label>
            <input type="range" id="sky-slider" min="0" max="6.28" step="0.01" value="0">
        </div>

        <div class="group">
            <span class="group-label">Propiedades del Objeto</span>
            <label style="font-size:11px">Posición Y (Altura)</label>
            <input type="range" id="posY" min="0" max="10" step="0.1" value="1.5">
            <label style="font-size:11px">Escala Uniforme</label>
            <input type="range" id="scaleAll" min="0.1" max="4" step="0.1" value="1">
        </div>

        <div class="group">
            <span class="group-label">Materiales de Alta Gama</span>
            <button class="btn active" id="mat-gold" onclick="setMaterial('gold')">Oro Pulido (24k)</button>
            <button class="btn" id="mat-glass" onclick="setMaterial('glass')">Cristal Refractivo</button>
            <button class="btn" id="mat-metal" onclick="setMaterial('metal')">Acero Industrial</button>
            <button class="btn" id="mat-neon" onclick="setMaterial('neon')">Emisión Neón</button>
        </div>

        <div class="group">
            <span class="group-label">Ajustes de Render</span>
            <button class="btn" onclick="toggleShadows()">Alternar Sombras Suaves</button>
            <button class="btn" onclick="resetAll()">Limpiar Todo (Reset)</button>
        </div>
    </div>

    <div id="timeline-ui">
        <div id="timeline-controls">
            <button class="btn" style="width:40px" onclick="changeFrame(0)">|◀</button>
            <button class="btn" style="width:40px" onclick="changeFrame(currentFrame-1)">◀</button>
            <span id="frame-display" style="font-size:12px; font-family:monospace; min-width:80px; text-align:center;">0 / 250</span>
            <button class="btn" style="width:40px" onclick="changeFrame(currentFrame+1)">▶</button>
            <button class="btn" style="width:40px" onclick="changeFrame(250)">▶|</button>
            <div style="flex-grow:1; font-size:10px; color:#555; text-align:right;">DOPE SHEET INTERACTIVA</div>
        </div>
        <div id="track-container" onclick="seekTimeline(event)">
            <div id="playhead"></div>
            <!-- Keyframes inject here -->
        </div>
    </div>

<script>
    let scene, camera, renderer, cube, sun, controls;
    let isPlaying = false;
    let currentFrame = 0;
    const maxFrames = 250;
    let keyframes = []; // Array de {frame, pos, rot, scl}

    function init() {
        // Escena y Ambiente
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 20, 100);

        // Cámara
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 12, 12);

        // Renderer Pro
        renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.getElementById('viewport').appendChild(renderer.domElement);

        // Controles de Cámara
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Iluminación Master (Sol con Sombras Suaves)
        sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(10, 20, 10);
        sun.castShadow = true;
        sun.shadow.mapSize.set(4096, 4096);
        sun.shadow.camera.left = -20;
        sun.shadow.camera.right = 20;
        sun.shadow.camera.top = 20;
        sun.shadow.camera.bottom = -20;
        scene.add(sun);

        const ambient = new THREE.AmbientLight(0xffffff, 0.1);
        scene.add(ambient);

        // Grid & Suelo Realista
        const grid = new THREE.GridHelper(40, 40, 0x333333, 0x181818);
        scene.add(grid);

        const floorMat = new THREE.ShadowMaterial({ opacity: 0.4 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // El Objeto (PBR por defecto Oro)
        const geometry = new THREE.BoxGeometry(3, 3, 3);
        const material = new THREE.MeshPhysicalMaterial({
            color: 0xffaa00, metalness: 1, roughness: 0.1,
            clearcoat: 1, clearcoatRoughness: 0
        });
        cube = new THREE.Mesh(geometry, material);
        cube.position.y = 1.5;
        cube.castShadow = true;
        scene.add(cube);

        // Eventos UI
        document.getElementById('sun-slider').oninput = (e) => {
            const val = parseFloat(e.target.value);
            sun.intensity = val;
            document.getElementById('sun-val').innerText = val.toFixed(1);
        };

        document.getElementById('sky-slider').oninput = (e) => {
            const angle = parseFloat(e.target.value);
            sun.position.set(Math.cos(angle) * 15, 20, Math.sin(angle) * 15);
        };

        document.getElementById('posY').oninput = (e) => {
            cube.position.y = parseFloat(e.target.value);
        };

        document.getElementById('scaleAll').oninput = (e) => {
            const s = parseFloat(e.target.value);
            cube.scale.set(s,s,s);
        };

        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space') { e.preventDefault(); togglePlay(); }
            if(e.key.toLowerCase() === 'i') insertKey();
        });

        window.addEventListener('resize', onWindowResize);

        animate();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Lógica de Materiales
    function setMaterial(type) {
        document.querySelectorAll('#sidebar .btn').forEach(b => b.classList.remove('active'));
        document.getElementById('mat-' + type).classList.add('active');

        const mats = {
            gold: { color: 0xffaa00, metalness: 1, roughness: 0.1, transmission: 0, emissive: 0x000000 },
            glass: { color: 0xffffff, metalness: 0, roughness: 0, transmission: 1, thickness: 2, emissive: 0x000000 },
            metal: { color: 0x888888, metalness: 0.9, roughness: 0.5, transmission: 0, emissive: 0x000000 },
            neon: { color: 0x000000, metalness: 0, roughness: 1, transmission: 0, emissive: 0x00ffcc }
        };

        const p = mats[type];
        cube.material.color.setHex(p.color);
        cube.material.metalness = p.metalness;
        cube.material.roughness = p.roughness;
        cube.material.transmission = p.transmission || 0;
        cube.material.thickness = p.thickness || 0;
        cube.material.emissive.setHex(p.emissive || 0);
    }

    // Sistema de Animación
    function insertKey() {
        keyframes = keyframes.filter(k => k.frame !== currentFrame);
        keyframes.push({
            frame: currentFrame,
            pos: cube.position.clone(),
            rot: cube.rotation.clone(),
            scl: cube.scale.clone()
        });
        keyframes.sort((a, b) => a.frame - b.frame);
        renderKeyMarkers();
    }

    function renderKeyMarkers() {
        const track = document.getElementById('track-container');
        track.querySelectorAll('.key-marker').forEach(m => m.remove());
        keyframes.forEach(k => {
            const marker = document.createElement('div');
            marker.className = 'key-marker';
            marker.style.left = (k.frame / maxFrames * 100) + '%';
            track.appendChild(marker);
        });
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('play-btn').classList.toggle('active');
        document.getElementById('play-btn').innerText = isPlaying ? "PAUSAR (Espacio)" : "REPRODUCIR (Espacio)";
    }

    function changeFrame(f) {
        currentFrame = Math.max(0, Math.min(maxFrames, f));
        updateAnimationFrame();
    }

    function seekTimeline(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - rect.left;
        changeFrame(Math.round((x / rect.width) * maxFrames));
    }

    function updateAnimationFrame() {
        document.getElementById('frame-info').innerText = currentFrame.toString().padStart(3, '0');
        document.getElementById('frame-display').innerText = `${currentFrame} / ${maxFrames}`;
        document.getElementById('playhead').style.left = (currentFrame / maxFrames * 100) + '%';

        if(keyframes.length === 0) return;

        let prev = keyframes[0], next = keyframes[keyframes.length-1];
        for(let k of keyframes) {
            if(k.frame <= currentFrame) prev = k;
            if(k.frame >= currentFrame) { next = k; break; }
        }

        if(prev === next) {
            cube.position.copy(prev.pos);
            cube.rotation.copy(prev.rot);
            cube.scale.copy(prev.scl);
        } else {
            let t = (currentFrame - prev.frame) / (next.frame - prev.frame);
            // Interpolación Suave Bézier
            const ease = t * t * (3 - 2 * t);
            cube.position.lerpVectors(prev.pos, next.pos, ease);
            cube.scale.lerpVectors(prev.scl, next.scl, ease);
            
            const q1 = new THREE.Quaternion().setFromEuler(prev.rot);
            const q2 = new THREE.Quaternion().setFromEuler(next.rot);
            q1.slerp(q2, ease);
            cube.rotation.setFromQuaternion(q1);
        }
    }

    function toggleShadows() {
        sun.castShadow = !sun.castShadow;
    }

    function resetAll() {
        keyframes = [];
        renderKeyMarkers();
        cube.position.set(0, 1.5, 0);
        cube.rotation.set(0,0,0);
        cube.scale.set(1,1,1);
        changeFrame(0);
    }

    function animate() {
        requestAnimationFrame(animate);
        
        if(isPlaying) {
            currentFrame++;
            if(currentFrame > maxFrames) currentFrame = 0;
            updateAnimationFrame();
        }

        controls.update();
        renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
</html>
