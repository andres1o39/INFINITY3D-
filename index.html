<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender Web Master Suite 5.0</title>
    <style>
        :root {
            --bg-deep: #121212;
            --bg-panel: #242424;
            --bg-header: #333333;
            --accent: #e67e22;
            --blue: #4f9eee;
            --text-dim: #999;
            --text-bright: #eee;
            --border: #1a1a1a;
        }

        body { margin: 0; overflow: hidden; background: var(--bg-deep); font-family: 'Inter', sans-serif; color: var(--text-bright); font-size: 11px; }

        /* Estructura de Ventanas Profesionales */
        .app-grid {
            display: grid;
            grid-template-columns: 48px 1fr 280px;
            grid-template-rows: 24px 1fr 180px;
            height: 100vh;
        }

        /* Top Bar */
        header { 
            grid-column: 1 / -1; 
            background: var(--bg-header); 
            display: flex; 
            align-items: center; 
            padding: 0 10px; 
            gap: 12px; 
            border-bottom: 1px solid #000;
        }

        /* Herramientas Izquierda */
        .toolbar { 
            background: var(--bg-panel); 
            border-right: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 8px 0; 
            gap: 10px;
        }

        .tool-btn { 
            width: 32px; height: 32px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; border-radius: 4px; transition: 0.2s;
        }
        .tool-btn:hover { background: #444; }
        .tool-btn.active { background: var(--accent); }

        /* Viewport */
        .viewport { position: relative; background: #333; overflow: hidden; }
        
        /* Sidebar (Outliner & Properties) */
        .sidebar { background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-panel { flex: 1; display: flex; flex-direction: column; border-bottom: 2px solid #111; }
        .panel-title { background: #3a3a3a; padding: 4px 10px; font-weight: bold; border-bottom: 1px solid #111; display: flex; justify-content: space-between; }

        /* Timeline / Dope Sheet */
        .timeline { grid-column: 1 / -1; background: var(--bg-panel); border-top: 1px solid #111; display: flex; flex-direction: column; }
        .timeline-header { height: 32px; background: #333; display: flex; align-items: center; padding: 0 10px; gap: 20px; }
        .timeline-content { flex: 1; position: relative; background: #1a1a1a; overflow-x: auto; }
        #playhead { position: absolute; top: 0; width: 2px; height: 100%; background: var(--blue); z-index: 5; pointer-events: none; }

        /* Componentes de UI */
        .btn { background: #444; border: 1px solid #555; color: white; padding: 3px 10px; cursor: pointer; border-radius: 2px; }
        .btn:hover { background: #555; }
        .btn-accent { background: var(--accent); border: none; }

        .prop-row { display: flex; align-items: center; padding: 4px 10px; gap: 10px; }
        .prop-row label { flex: 1; color: var(--text-dim); }
        .prop-row input { background: #111; border: 1px solid #333; color: var(--accent); width: 60px; padding: 2px; text-align: center; }

        /* Outliner List */
        .obj-item { padding: 4px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e1e1e; }
        .obj-item.selected { background: #444; }
        .obj-item:hover { background: #333; }

        /* Overlays */
        #viewport-shading { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 6px; }
        #camera-gizmo { position: absolute; top: 10px; right: 150px; width: 100px; height: 100px; pointer-events: none; }

        .key-marker { position: absolute; width: 8px; height: 8px; background: #decb00; transform: rotate(45deg); top: 12px; border: 1px solid #000; }
    </style>
</head>
<body>

<div class="app-grid">
    <header>
        <span style="color: var(--accent); font-weight: bold;">Blender Web Suite 5.0</span>
        <div class="btn" id="add-btn">Agregar (Shift+A)</div>
        <div class="btn" id="render-btn">Renderizar Imagen</div>
        <div style="flex:1"></div>
        <span id="scene-stats" style="color: #666; font-size: 10px;">Verts: 0 | Faces: 0 | Objects: 0</span>
    </header>

    <div class="toolbar">
        <div class="tool-btn active" id="t-select" title="Seleccionar">🖱️</div>
        <div class="tool-btn" id="t-move" title="Mover (G)">✥</div>
        <div class="tool-btn" id="t-rotate" title="Rotar (R)">🔄</div>
        <div class="tool-btn" id="t-scale" title="Escalar (S)">⤢</div>
        <hr style="width: 70%; border-color: #333">
        <div class="tool-btn" id="t-autokey" title="Auto-Keying" style="color: #888;">⏺️</div>
    </div>

    <div class="viewport" id="viewport">
        <div id="viewport-shading">
            <div class="btn" onclick="app.setShading('wireframe')" title="Wireframe">🌐</div>
            <div class="btn" onclick="app.setShading('solid')" title="Sólido">🌑</div>
            <div class="btn" onclick="app.setShading('xray')" title="Rayos X">🩻</div>
            <div class="btn" onclick="app.setShading('render')" title="Render">✨</div>
        </div>
        <div id="camera-gizmo"></div>
    </div>

    <div class="sidebar">
        <div class="sidebar-panel">
            <div class="panel-title">Outliner <span>🔍</span></div>
            <div id="outliner-list" style="overflow-y:auto; flex:1"></div>
        </div>
        <div class="sidebar-panel">
            <div class="panel-title">Propiedades <span>⚙️</span></div>
            <div id="inspector-content" style="padding-top:10px">
                <div id="no-sel-msg" style="text-align:center; color:#555; padding: 20px;">No hay objeto seleccionado</div>
                <div id="props" style="display:none">
                    <div class="prop-row"><label>Nombre</label><input type="text" id="obj-name" style="width:120px"></div>
                    <div class="panel-title" style="background:transparent; font-size:10px; color:var(--accent)">TRANSFORMACIÓN</div>
                    <div class="prop-row"><label>Ubicación X</label><input type="number" step="0.1" id="loc-x"></div>
                    <div class="prop-row"><label>Ubicación Y</label><input type="number" step="0.1" id="loc-y"></div>
                    <div class="prop-row"><label>Ubicación Z</label><input type="number" step="0.1" id="loc-z"></div>
                    <div class="prop-row"><label>Rotación Z</label><input type="number" step="1" id="rot-z"></div>
                    <div class="panel-title" style="background:transparent; font-size:10px; color:var(--accent)">MATERIAL</div>
                    <div class="prop-row"><label>Color</label><input type="color" id="mat-color"></div>
                    <div class="prop-row"><label>Metálico</label><input type="range" min="0" max="1" step="0.1" id="mat-metal"></div>
                    <div class="prop-row"><label>Rugosidad</label><input type="range" min="0" max="1" step="0.1" id="mat-rough"></div>
                    <button class="btn btn-accent" id="key-btn" style="width:90%; margin: 10px 5%; font-weight:bold">Insertar Keyframe (I)</button>
                </div>
            </div>
        </div>
    </div>

    <div class="timeline">
        <div class="timeline-header">
            <div class="btn" id="play-btn">▶ Reproducir</div>
            <div style="color:var(--blue); font-weight:bold">Frame: <span id="current-frame-lbl">0</span></div>
            <div style="flex:1"></div>
            <div style="display:flex; gap:5px; align-items:center">
                Inicio: <input type="number" value="0" style="width:40px">
                Fin: <input type="number" value="250" style="width:40px">
            </div>
        </div>
        <div class="timeline-content" id="timeline-container">
            <div id="playhead"></div>
            <div id="keyframes-track" style="position:absolute; width:10000px; height:100%"></div>
            <canvas id="timeline-ruler" style="height:100%; width:10000px"></canvas>
        </div>
    </div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    class BlenderMasterApp {
        constructor() {
            this.frame = 0;
            this.isPlaying = false;
            this.objects = [];
            this.selected = null;
            this.autoKey = false;
            this.shading = 'solid';
            
            this.initEngine();
            this.initTimeline();
            this.initUI();
            this.add('cube');
            this.renderLoop();
        }

        initEngine() {
            this.scene = new THREE.Scene();
            this.scene.background = new THREE.Color(0x282828);
            
            this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            this.camera.position.set(10, 10, 10);

            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.shadowMap.enabled = true;
            document.getElementById('viewport').appendChild(this.renderer.domElement);

            this.grid = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
            this.scene.add(this.grid);

            this.ambient = new THREE.AmbientLight(0xffffff, 0.7);
            this.scene.add(this.ambient);

            this.sun = new THREE.DirectionalLight(0xffffff, 1);
            this.sun.position.set(10, 20, 5);
            this.sun.castShadow = true;
            this.scene.add(this.sun);

            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.orbit.enableDamping = true;

            this.transform = new TransformControls(this.camera, this.renderer.domElement);
            this.scene.add(this.transform);

            this.transform.addEventListener('dragging-changed', (e) => {
                this.orbit.enabled = !e.value;
                if (!e.value && this.autoKey) this.insertKeyframe();
                this.syncProps();
            });
        }

        add(type) {
            let mesh;
            const mat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.2, roughness: 0.5 });
            
            if (type === 'cube') mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), mat);
            if (type === 'sphere') mesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 16), mat);
            if (type === 'monkey') mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), mat);
            
            mesh.name = `${type.charAt(0).toUpperCase() + type.slice(1)}_${this.objects.length}`;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData.keyframes = {}; // Formato: { frame: {pos, rot, scale} }

            this.scene.add(mesh);
            this.objects.push(mesh);
            this.select(mesh);
            this.updateOutliner();
        }

        select(obj) {
            this.selected = obj;
            if (obj) {
                this.transform.attach(obj);
                document.getElementById('props').style.display = 'block';
                document.getElementById('no-sel-msg').style.display = 'none';
                this.syncProps();
            } else {
                this.transform.detach();
                document.getElementById('props').style.display = 'none';
                document.getElementById('no-sel-msg').style.display = 'block';
            }
            this.updateOutliner();
            this.renderKeyMarkers();
        }

        insertKeyframe() {
            if (!this.selected) return;
            this.selected.userData.keyframes[this.frame] = {
                pos: this.selected.position.clone(),
                rot: this.selected.rotation.clone(),
                sca: this.selected.scale.clone()
            };
            this.renderKeyMarkers();
        }

        applyAnimation() {
            this.objects.forEach(obj => {
                const keys = obj.userData.keyframes;
                const frameNums = Object.keys(keys).map(Number).sort((a,b) => a-b);
                if (frameNums.length === 0) return;

                let prev = frameNums[0], next = frameNums[0];
                for (let f of frameNums) {
                    if (f <= this.frame) prev = f;
                    if (f >= this.frame) { next = f; break; }
                }

                if (prev === next) {
                    obj.position.copy(keys[prev].pos);
                    obj.rotation.copy(keys[prev].rot);
                    obj.scale.copy(keys[prev].sca);
                } else {
                    const t = (this.frame - prev) / (next - prev);
                    // Interpolación Ease-In-Out (Funcionalidad 32)
                    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                    
                    obj.position.lerpVectors(keys[prev].pos, keys[next].pos, ease);
                    obj.scale.lerpVectors(keys[prev].sca, keys[next].sca, ease);
                    
                    const q1 = new THREE.Quaternion().setFromEuler(keys[prev].rot);
                    const q2 = new THREE.Quaternion().setFromEuler(keys[next].rot);
                    obj.quaternion.slerp(q2.set(q2.x, q2.y, q2.z, q2.w), ease);
                }
            });
        }

        initTimeline() {
            const canvas = document.getElementById('timeline-ruler');
            const ctx = canvas.getContext('2d');
            canvas.width = 5000;
            canvas.height = 32;

            const draw = () => {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                ctx.strokeStyle = '#555';
                ctx.fillStyle = '#888';
                ctx.font = '10px Inter';

                for (let i = 0; i < 300; i++) {
                    const x = i * 20;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, i % 5 === 0 ? 12 : 6);
                    ctx.stroke();
                    if (i % 10 === 0) ctx.fillText(i, x + 2, 25);
                }
            };
            draw();

            document.getElementById('timeline-container').addEventListener('click', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left + e.currentTarget.scrollLeft;
                this.frame = Math.round(x / 20);
                this.updatePlayhead();
            });
        }

        updatePlayhead() {
            if (this.frame > 250) this.frame = 0;
            document.getElementById('playhead').style.left = (this.frame * 20) + 'px';
            document.getElementById('current-frame-lbl').innerText = this.frame;
            this.applyAnimation();
            this.syncProps();
        }

        syncProps() {
            if (!this.selected) return;
            document.getElementById('obj-name').value = this.selected.name;
            document.getElementById('loc-x').value = this.selected.position.x.toFixed(2);
            document.getElementById('loc-y').value = this.selected.position.y.toFixed(2);
            document.getElementById('loc-z').value = this.selected.position.z.toFixed(2);
        }

        updateOutliner() {
            const list = document.getElementById('outliner-list');
            list.innerHTML = '';
            this.objects.forEach(obj => {
                const el = document.createElement('div');
                el.className = `obj-item ${this.selected === obj ? 'selected' : ''}`;
                el.innerHTML = `<span>👁️</span> ${obj.name}`;
                el.onclick = () => this.select(obj);
                list.appendChild(el);
            });
            document.getElementById('scene-stats').innerText = `Objects: ${this.objects.length} | Frame: ${this.frame}`;
        }

        renderKeyMarkers() {
            const track = document.getElementById('keyframes-track');
            track.innerHTML = '';
            if (!this.selected) return;
            Object.keys(this.selected.userData.keyframes).forEach(f => {
                const div = document.createElement('div');
                div.className = 'key-marker';
                div.style.left = (f * 20) + 'px';
                track.appendChild(div);
            });
        }

        setShading(mode) {
            this.shading = mode;
            this.objects.forEach(obj => {
                if (obj.material) {
                    obj.material.wireframe = (mode === 'wireframe');
                    obj.material.transparent = (mode === 'xray');
                    obj.material.opacity = (mode === 'xray') ? 0.4 : 1.0;
                }
            });
            if (mode === 'render') {
                this.scene.background = new THREE.Color(0x050505);
                this.grid.visible = false;
            } else {
                this.scene.background = new THREE.Color(0x282828);
                this.grid.visible = true;
            }
        }

        initUI() {
            document.getElementById('play-btn').onclick = () => {
                this.isPlaying = !this.isPlaying;
                document.getElementById('play-btn').innerText = this.isPlaying ? '⏸ Pausar' : '▶ Reproducir';
            };

            document.getElementById('key-btn').onclick = () => this.insertKeyframe();
            
            document.getElementById('t-autokey').onclick = (e) => {
                this.autoKey = !this.autoKey;
                e.currentTarget.style.color = this.autoKey ? '#ff4444' : '#888';
            };

            document.getElementById('t-move').onclick = () => this.transform.setMode('translate');
            document.getElementById('t-rotate').onclick = () => this.transform.setMode('rotate');
            document.getElementById('t-scale').onclick = () => this.transform.setMode('scale');

            window.addEventListener('keydown', (e) => {
                if (e.shiftKey && e.key === 'A') document.getElementById('add-btn').click();
                if (e.key === 'i') this.insertKeyframe();
                if (e.key === 'g') this.transform.setMode('translate');
                if (e.key === 'r') this.transform.setMode('rotate');
                if (e.key === 's') this.transform.setMode('scale');
            });

            document.getElementById('add-btn').onclick = () => this.add('cube');
        }

        renderLoop() {
            requestAnimationFrame(() => this.renderLoop());
            this.orbit.update();
            if (this.isPlaying) {
                this.frame++;
                this.updatePlayhead();
            }
            this.renderer.render(this.scene, this.camera);
        }
    }

    const app = new BlenderMasterApp();
    window.app = app;

    window.addEventListener('resize', () => {
        app.camera.aspect = window.innerWidth / window.innerHeight;
        app.camera.updateProjectionMatrix();
        app.renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
