<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blood Strike Pro - Ultra Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #instructions {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: #fff; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; cursor: pointer; text-transform: uppercase;
        }
        #hud {
            position: absolute; bottom: 30px; left: 30px; color: #0f0; 
            font-size: 20px; letter-spacing: 2px; pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            border: 2px solid rgba(0, 255, 0, 0.5); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="flash"></div>
    <div id="instructions">
        <h1 style="font-size: 50px; margin-bottom: 10px;">BLOOD STRIKE <span style="color: red;">JS</span></h1>
        <p>Potencia Detectada: Modo Ultra Activado</p>
        <p>CLICK PARA DESPLEGARSE</p>
    </div>
    <div id="crosshair"></div>
    <div id="hud">
        STATUS: OPERATIVO <br> 
        ALTITUD: <span id="alt">0</span>m <br>
        AMMO: 30/&infin;
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
        import { PointerLockControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/PointerLockControls.js';

        // --- Configuración Core ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Sombras activadas para laptops potentes
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- Luces de alta calidad ---
        const ambient = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(50, 100, 50);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048; // Alta resolución de sombras
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        // --- Mapa Avanzado ---
        const gridHelper = new THREE.GridHelper(1000, 100, 0xff0000, 0x222222);
        scene.add(gridHelper);

        const floorGeo = new THREE.PlaneGeometry(1000, 1000);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Obstáculos con sombras
        for (let i = 0; i < 80; i++) {
            const h = Math.random() * 30 + 2;
            const boxGeo = new THREE.BoxGeometry(8, h, 8);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.set(Math.random() * 600 - 300, h/2, Math.random() * 600 - 300);
            box.castShadow = true;
            box.receiveShadow = true;
            scene.add(box);
        }

        // --- Arma Avanzada (FPS View) ---
        const weaponGroup = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(0.15, 0.2, 0.7);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 0.9, roughness: 0.1 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        weaponGroup.add(body);
        
        const barrelGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.5);
        const barrel = new THREE.Mesh(barrelGeo, bodyMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.z = -0.4;
        weaponGroup.add(barrel);

        scene.add(camera);
        camera.add(weaponGroup);
        weaponGroup.position.set(0.4, -0.3, -0.6);

        // --- Controles y Movimiento ---
        const controls = new PointerLockControls(camera, document.body);
        const instructions = document.getElementById('instructions');
        instructions.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => instructions.style.display = 'none');
        controls.addEventListener('unlock', () => instructions.style.display = 'flex');

        let moveFwd = false, moveBwd = false, moveL = false, moveR = false;
        let velocity = new THREE.Vector3();
        camera.position.y = 250; // Caída desde más alto
        let parachuting = true;

        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') moveFwd = true;
            if(e.code === 'KeyS') moveBwd = true;
            if(e.code === 'KeyA') moveL = true;
            if(e.code === 'KeyD') moveR = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') moveFwd = false;
            if(e.code === 'KeyS') moveBwd = false;
            if(e.code === 'KeyA') moveL = false;
            if(e.code === 'KeyD') moveR = false;
        });

        // --- Sistema de Disparo ---
        window.addEventListener('mousedown', () => {
            if(!controls.isLocked) return;
            // Efecto Muzzle Flash
            document.getElementById('flash').style.opacity = '0.3';
            setTimeout(() => document.getElementById('flash').style.opacity = '0', 50);
            
            // Retroceso visual del arma
            weaponGroup.position.z += 0.1;
        });

        // --- Bucle de Renderizado ---
        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                // Física de movimiento
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                if (parachuting) {
                    velocity.y = -8; 
                    if (camera.position.y <= 2) parachuting = false;
                } else {
                    velocity.y -= 20.0 * delta; // Gravedad más fuerte
                }

                if (moveFwd) velocity.z -= 200.0 * delta;
                if (moveBwd) velocity.z += 200.0 * delta;
                if (moveL) velocity.x -= 200.0 * delta;
                if (moveR) velocity.x += 200.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += (velocity.y * delta);

                if (camera.position.y < 1.7) {
                    velocity.y = 0;
                    camera.position.y = 1.7;
                }

                // Balanceo del arma (Bobbing)
                const timer = Date.now() * 0.005;
                if (moveFwd || moveBwd || moveL || moveR) {
                    weaponGroup.position.y = -0.3 + Math.sin(timer) * 0.02;
                    weaponGroup.position.x = 0.4 + Math.cos(timer) * 0.01;
                }
                // Recuperación de retroceso
                weaponGroup.position.z += ( -0.6 - weaponGroup.position.z ) * 0.1;
                
                document.getElementById('alt').innerText = Math.floor(camera.position.y);
            }
            prevTime = time;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
