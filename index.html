<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo 3D Interactivo - Three.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #444;
            display: flex;
            gap: 20px;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .key-hint {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        kbd {
            background: #eee;
            color: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-family: monospace;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-size: 0.9em;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="key-hint"><kbd>F</kbd> Mover (Oscilar)</div>
        <div class="key-hint"><kbd>W</kbd> Rotar</div>
        <div class="key-hint"><kbd>A</kbd> Escalar</div>
    </div>

    <div class="instructions">
        Usa el ratón/trackpad para orbitar y zoom.
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, cube, grid, controls;
        let isMoving = false;
        let isRotating = false;
        let isScaling = false;
        
        // Variables para animaciones
        let time = 0;

        function init() {
            // 1. Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // 2. Cámara
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. Controles de Cámara (Orbit)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 5. Luces
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // 6. Rejilla (Grid)
            grid = new THREE.GridHelper(10, 10, 0x00ff00, 0x444444);
            scene.add(grid);

            // 7. Cubo
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x0088ff, 
                shininess: 100,
                transparent: true,
                opacity: 0.9 
            });
            cube = new THREE.Mesh(geometry, material);
            cube.position.y = 1; // Elevar sobre la rejilla
            scene.add(cube);

            // 8. Eventos de teclado
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'f') isMoving = !isMoving;
                if (key === 'w') isRotating = !isRotating;
                if (key === 'a') isScaling = !isScaling;
                
                updateVisualFeedback(key);
            });

            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function updateVisualFeedback(key) {
            // Cambiar color del cubo brevemente al activar una función
            cube.material.emissive.setHex(0x333333);
            setTimeout(() => cube.material.emissive.setHex(0x000000), 200);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.02;

            // Lógica de Movimiento (F)
            if (isMoving) {
                cube.position.x = Math.sin(time) * 3;
                cube.position.z = Math.cos(time) * 3;
            }

            // Lógica de Rotación (W)
            if (isRotating) {
                cube.rotation.x += 0.02;
                cube.rotation.y += 0.02;
            }

            // Lógica de Escala (A)
            if (isScaling) {
                const scale = 1 + Math.sin(time * 2) * 0.5;
                cube.scale.set(scale, scale, scale);
            } else {
                // Suavizar el regreso a escala original si se apaga
                cube.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Iniciar cuando el DOM esté listo
        window.onload = init;
    </script>
</body>
</html>

                                                                                                                                                                                                                                            <div id="lk" class="s">

                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                    const $ = id => document.getElementById(id);

                                                                                                                                                                                                                                                                            const cvs = $('c'), ctx = cvs.getContext('2d');

                                                                                                                                                                                                                                                                                let st = 0, sel = 0, gSel = 0, cSel = 0, lvl = 1, wait = 0, lck = 0, inG = 0;
                                                                                                                                                                                                                                                                                    let pCol = "#f00"; 
                                                                                                                                                                                                                                                                                        const gList = ["MERIA PARKOUR", "VOLVER"];
                                                                                                                                                                                                                                                                                            const colList = ["#f00", "#0f0", "#00f", "#fff", "VOLVER"];
                                                                                                                                                                                                                                                                                                const colNames = ["ROJO", "VERDE", "AZUL", "BLANCO", "VOLVER"];

                                                                                                                                                                                                                                                                                                    let p = { x: 30, y: 0, w: 18, h: 18, vx: 0, vy: 0, j: 0 };
                                                                                                                                                                                                                                                                                                        let plats = [], enms = [], goal = {}, warp = null;

                                                                                                                                                                                                                                                                                                            // Activar al tocar la pantalla
                                                                                                                                                                                                                                                                                                                scr.act.onclick = () => {

                                                                                                                                                                                                                                                                                                                                        async function startBoot() {
                                                                                                                                                                                                                                                                                                                                                scr.ov.style.display = 'none'; scr.boot.style.display = 'flex';
                                                                                                                                                                                                                                                                                                                                                        for(let i=0; i<=100; i+=10) { scr.bar.style.width = i+'%'; await new Promise(r=>setTimeout(r,50)); }

                                                                                                                                                                                                                                                                                                                                                                        function menu() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function init(n) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            cvs.width = window.innerWidth; cvs.height = window.innerHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    plats = [{ x: 20, y: cvs.height - 60, w: 70, h: 10 }]; enms = []; warp = null;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                plats.push({ x: px, y: py, w: 55, h: 10 });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(Math.random()>0.4) enms.push({x:px, y:py-15, w:14, h:14, s:px, e:px+40, spd:1+n*0.1, d:1});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(i === 3) warp = { x: px+18, y: py-35, w: 20, h: 20 };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                p.x = 30; p.y = plats[0].y-30; p.vx = p.vy = 0; scr.lv.innerText = n;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function loop() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const pad = navigator.getGamepads()[0];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (pad) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (scr.ov.style.display == 'flex' && btnA) startBoot();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (lck) { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (pad.buttons[1].pressed && pad.buttons[3].pressed) { lck=0; scr.lk.style.display='none'; scr.u.style.display='flex'; st=0; menu(); } 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                else if (inG) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                p.vx = (pad.axes[0] < -0.4 || pad.buttons[14].pressed) ? -4 : (pad.axes[0] > 0.4 || pad.buttons[15].pressed) ? 4 : p.vx*0.7;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (btnA && !p.j) { p.vy = -12; p.j = 1; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                p.vy += 0.8; p.x += p.vx; p.y += p.vy;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                plats.forEach(pl => { if(p.x < pl.x+pl.w && p.x+p.w > pl.x && p.y+p.h > pl.y && p.y+p.h < pl.y+pl.h+p.vy) { p.y=pl.y-p.h; p.vy=0; p.j=0; } });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                enms.forEach(e => { e.x += e.spd*e.d; if(e.x>e.e || e.x<e.s) e.d*=-1; if(p.x<e.x+e.w && p.x+p.w>e.x && p.y<e.y+e.h && p.y+p.h>e.y) init(lvl); });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(st==1) gSel=(gSel+d+2)%2; else if(st==2) cSel=(cSel+d+5)%5; else sel=(sel+d+3)%3;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function draw() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
