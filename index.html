<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Blender Editor Pro</title>
    <style>
        :root {
            --bg-darker: #111111;
            --bg-panel: #252525;
            --bg-hover: #353535;
            --accent: #e67e22;
            --text: #cfcfcf;
            --border: #3d3d3d;
        }
        body { margin: 0; overflow: hidden; background: var(--bg-darker); font-family: 'Inter', sans-serif; color: var(--text); font-size: 12px; }
        
        /* Layout Principal */
        .ui-overlay { position: absolute; pointer-events: none; inset: 0; display: flex; flex-direction: column; }
        .panel { pointer-events: auto; background: var(--bg-panel); border: 1px solid var(--border); display: flex; flex-direction: column; }

        /* Barra Superior */
        header { height: 40px; display: flex; align-items: center; padding: 0 15px; gap: 15px; border-bottom: 1px solid var(--border); pointer-events: auto; background: var(--bg-panel); }
        .menu-item { cursor: pointer; padding: 5px 10px; border-radius: 3px; }
        .menu-item:hover { background: var(--bg-hover); }

        /* Contenedor Central */
        .main-content { flex: 1; display: flex; justify-content: space-between; padding: 10px; }

        /* Sidebar Izquierda: Outliner */
        #outliner { width: 200px; }
        .list-item { padding: 5px 10px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .list-item:hover { background: var(--bg-hover); }
        .list-item.selected { background: var(--accent); color: white; }

        /* Sidebar Derecha: Propiedades */
        #inspector { width: 260px; overflow-y: auto; padding: 15px; }
        .prop-group { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .prop-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .prop-row input { background: #111; border: 1px solid #444; color: var(--accent); width: 60px; padding: 2px; }
        input[type="range"] { width: 100px; accent-color: var(--accent); }

        /* Barra Inferior */
        footer { height: 35px; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; gap: 20px; pointer-events: auto; }
        
        .badge { background: #444; padding: 2px 6px; border-radius: 10px; font-size: 10px; }
        button { background: #3d3d3d; color: white; border: 1px solid #555; padding: 5px 10px; cursor: pointer; font-size: 11px; }
        button:hover { background: var(--accent); }

        canvas { position: absolute; top: 0; left: 0; z-index: -1; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; color: var(--accent); margin-right: 20px;">BLENDER WEB v2.0</div>
    <div class="menu-item" onclick="app.addCube()">+ Cubo</div>
    <div class="menu-item" onclick="app.addSphere()">+ Esfera</div>
    <div class="menu-item" onclick="app.addPointLight()">+ Luz</div>
    <div class="menu-item" onclick="app.resetScene()">Reset Escena</div>
</header>

<div class="ui-overlay">
    <div class="main-content">
        <!-- Outliner -->
        <div id="outliner" class="panel">
            <div style="padding: 8px; font-weight: bold; border-bottom: 1px solid var(--border)">ESCENA</div>
            <div id="object-list" style="overflow-y: auto; flex: 1;"></div>
        </div>

        <!-- Inspector -->
        <div id="inspector" class="panel">
            <div id="empty-hint" style="text-align: center; margin-top: 50px; color: #666;">Selecciona un objeto</div>
            <div id="props-content" style="display: none;">
                <h3 id="obj-title" style="margin-top:0">Objeto</h3>
                
                <div class="prop-group">
                    <h4>Transformación</h4>
                    <div class="prop-row"><span>Pos X</span><input type="number" step="0.1" id="pX"></div>
                    <div class="prop-row"><span>Pos Y</span><input type="number" step="0.1" id="pY"></div>
                    <div class="prop-row"><span>Pos Z</span><input type="number" step="0.1" id="pZ"></div>
                </div>

                <div class="prop-group">
                    <h4>Material</h4>
                    <div class="prop-row"><span>Color</span><input type="color" id="mCol"></div>
                    <div class="prop-row"><span>Metal</span><input type="range" min="0" max="1" step="0.01" id="mMet"></div>
                    <div class="prop-row"><span>Rough</span><input type="range" min="0" max="1" step="0.01" id="mRou"></div>
                </div>

                <button id="cloneBtn" style="width: 100%; margin-bottom: 5px;">Duplicar (Shift+D)</button>
                <button id="delBtn" style="width: 100%; background: #622;">Eliminar (DEL)</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="badge">FPS: <span id="fps">60</span></div>
        <div class="badge">Objetos: <span id="obj-count">0</span></div>
        <div style="margin-left: auto; display: flex; gap: 15px;">
            <label><input type="checkbox" id="fogCheck"> Niebla</label>
            <label><input type="checkbox" id="gridCheck" checked> Rejilla</label>
            <label><input type="checkbox" id="rainCheck"> Lluvia</label>
        </div>
    </footer>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    class BlenderApp {
        constructor() {
            this.scene = new THREE.Scene();
            this.scene.background = new THREE.Color(0x1a1a1a);
            
            this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            this.camera.position.set(10, 10, 10);

            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.shadowMap.enabled = true;
            this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(this.renderer.domElement);

            this.objects = [];
            this.selected = null;
            this.rainParticles = null;

            this.initControls();
            this.initLights();
            this.initHelpers();
            this.bindEvents();
            this.animate();
        }

        initControls() {
            this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
            this.orbit.enableDamping = true;

            this.transform = new TransformControls(this.camera, this.renderer.domElement);
            this.scene.add(this.transform);

            this.transform.addEventListener('dragging-changed', (e) => {
                this.orbit.enabled = !e.value;
                if (!e.value) this.updateUI();
            });

            this.transform.addEventListener('change', () => this.updateUIInputs());
        }

        initLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            this.scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(10, 20, 10);
            sun.castShadow = true;
            this.scene.add(sun);
        }

        initHelpers() {
            this.grid = new THREE.GridHelper(50, 50, 0x333333, 0x222222);
            this.scene.add(this.grid);
        }

        addCube() {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(2, 2, 2),
                new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.5, metalness: 0.1 })
            );
            mesh.name = "Cubo_" + this.objects.length;
            this.addToScene(mesh);
        }

        addSphere() {
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(1.2, 32, 32),
                new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.1, metalness: 0.8 })
            );
            mesh.name = "Esfera_" + this.objects.length;
            this.addToScene(mesh);
        }

        addPointLight() {
            const light = new THREE.PointLight(0xffffff, 50, 20);
            const helper = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 0xffff00}));
            light.add(helper);
            light.name = "Luz_" + this.objects.length;
            this.addToScene(light);
        }

        addToScene(obj) {
            obj.position.set(0, 1, 0);
            obj.castShadow = true;
            obj.receiveShadow = true;
            this.scene.add(obj);
            this.objects.push(obj);
            this.select(obj);
            this.updateOutliner();
        }

        select(obj) {
            this.selected = obj;
            if (obj) {
                this.transform.attach(obj);
                document.getElementById('props-content').style.display = 'block';
                document.getElementById('empty-hint').style.display = 'none';
                document.getElementById('obj-title').innerText = obj.name;
                this.updateUIInputs();
            } else {
                this.transform.detach();
                document.getElementById('props-content').style.display = 'none';
                document.getElementById('empty-hint').style.display = 'block';
            }
            this.updateOutliner();
        }

        updateOutliner() {
            const list = document.getElementById('object-list');
            list.innerHTML = '';
            this.objects.forEach(obj => {
                const item = document.createElement('div');
                item.className = `list-item ${this.selected === obj ? 'selected' : ''}`;
                item.innerHTML = `<span>${obj.name}</span>`;
                item.onclick = () => this.select(obj);
                list.appendChild(item);
            });
            document.getElementById('obj-count').innerText = this.objects.length;
        }

        updateUIInputs() {
            if (!this.selected) return;
            document.getElementById('pX').value = this.selected.position.x.toFixed(2);
            document.getElementById('pY').value = this.selected.position.y.toFixed(2);
            document.getElementById('pZ').value = this.selected.position.z.toFixed(2);
            
            if (this.selected.material) {
                document.getElementById('mCol').value = '#' + this.selected.material.color.getHexString();
                document.getElementById('mMet').value = this.selected.material.metalness;
                document.getElementById('mRou').value = this.selected.material.roughness;
            }
        }

        bindEvents() {
            // Inputs Manuales
            ['pX', 'pY', 'pZ'].forEach(id => {
                document.getElementById(id).oninput = (e) => {
                    if (this.selected) this.selected.position[id[1].toLowerCase()] = parseFloat(e.target.value);
                };
            });

            document.getElementById('mCol').oninput = (e) => {
                if (this.selected?.material) this.selected.material.color.set(e.target.value);
            };

            document.getElementById('mMet').oninput = (e) => {
                if (this.selected?.material) this.selected.material.metalness = parseFloat(e.target.value);
            };

            document.getElementById('mRou').oninput = (e) => {
                if (this.selected?.material) this.selected.material.roughness = parseFloat(e.target.value);
            };

            // Teclado
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                switch(e.key.toLowerCase()) {
                    case 'w': this.transform.setMode('translate'); break;
                    case 'e': this.transform.setMode('rotate'); break;
                    case 'r': this.transform.setMode('scale'); break;
                    case 'd': if (e.shiftKey) this.cloneSelected(); break;
                    case 'delete': this.deleteSelected(); break;
                }
            });

            // Niebla y Extras
            document.getElementById('fogCheck').onchange = (e) => this.scene.fog = e.target.checked ? new THREE.FogExp2(0x1a1a1a, 0.05) : null;
            document.getElementById('gridCheck').onchange = (e) => this.grid.visible = e.target.checked;
            document.getElementById('rainCheck').onchange = (e) => this.toggleRain(e.target.checked);
        }

        cloneSelected() {
            if (!this.selected) return;
            const clone = this.selected.clone();
            clone.position.x += 2;
            clone.name = this.selected.name + "_Copia";
            this.addToScene(clone);
        }

        deleteSelected() {
            if (!this.selected) return;
            this.scene.remove(this.selected);
            this.objects = this.objects.filter(o => o !== this.selected);
            this.select(null);
            this.updateOutliner();
        }

        toggleRain(enabled) {
            if (enabled) {
                const geo = new THREE.BufferGeometry();
                const count = 5000;
                const pos = new Float32Array(count * 3);
                for(let i=0; i<count*3; i+=3) {
                    pos[i] = Math.random()*40-20;
                    pos[i+1] = Math.random()*20;
                    pos[i+2] = Math.random()*40-20;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                this.rainParticles = new THREE.Points(geo, new THREE.PointsMaterial({color: 0xaaaaaf, size: 0.05}));
                this.scene.add(this.rainParticles);
            } else {
                this.scene.remove(this.rainParticles);
                this.rainParticles = null;
            }
        }

        animate() {
            requestAnimationFrame(() => this.animate());
            this.orbit.update();

            if (this.rainParticles) {
                const pos = this.rainParticles.geometry.attributes.position.array;
                for(let i=1; i<pos.length; i+=3) {
                    pos[i] -= 0.3;
                    if (pos[i] < 0) pos[i] = 20;
                }
                this.rainParticles.geometry.attributes.position.needsUpdate = true;
            }

            this.renderer.render(this.scene, this.camera);
            
            // Stats simples
            if (Math.random() > 0.9) document.getElementById('fps').innerText = Math.round(60); 
        }

        resetScene() {
            this.objects.forEach(o => this.scene.remove(o));
            this.objects = [];
            this.select(null);
            this.updateOutliner();
        }
    }

    const app = new BlenderApp();
    window.app = app; // Para acceso desde HTML

    window.addEventListener('resize', () => {
        app.camera.aspect = window.innerWidth / window.innerHeight;
        app.camera.updateProjectionMatrix();
        app.renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
