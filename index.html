<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gemini OS - Neural API Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #00ff88; --bg: #050505; --win: #121212; }
        body, html { margin: 0; padding: 0; height: 100vh; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        #desktop { height: calc(100% - 50px); padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, 110px); gap: 15px; }
        .app-icon { text-align: center; cursor: pointer; padding: 10px; border-radius: 10px; transition: 0.2s; }
        .app-icon:hover { background: rgba(0, 255, 136, 0.1); }
        .app-icon i { font-size: 45px; display: block; margin-bottom: 8px; color: var(--accent); }

        .window { position: absolute; width: 600px; height: 450px; background: var(--win); border-radius: 12px; display: none; flex-direction: column; border: 1px solid #333; box-shadow: 0 0 30px rgba(0,0,0,1); overflow: hidden; z-index: 100; }
        .win-header { background: #1a1a1a; padding: 12px; cursor: move; display: flex; justify-content: space-between; }
        .win-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }

        /* Chat Estilo Moderno */
        #ai-messages { flex: 1; overflow-y: auto; margin-bottom: 10px; padding: 10px; background: #000; border-radius: 8px; border: 1px solid #222; }
        .msg { margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; line-height: 1.4; max-width: 85%; }
        .user-msg { background: var(--accent); color: black; align-self: flex-end; margin-left: auto; }
        .ai-msg { background: #222; color: #00ff88; align-self: flex-start; }

        .input-area { display: flex; gap: 10px; }
        #ai-input { flex: 1; background: #1a1a1a; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; outline: none; }
        #ai-input:focus { border-color: var(--accent); }

        #taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.9); display: flex; align-items: center; padding: 0 20px; border-top: 1px solid #333; }
        .loading { font-style: italic; color: #888; font-size: 0.8em; }
    </style>
</head>
<body>

<div id="desktop">
    <div class="app-icon" onclick="openWin('win-claude')">
        <i class="fas fa-brain"></i><span>Claude 3.5</span>
    </div>
    <div class="app-icon" onclick="openWin('win-settings')">
        <i class="fas fa-key"></i><span>API Config</span>
    </div>
</div>

<div id="win-claude" class="window">
    <div class="win-header" onmousedown="startDrag(event, this.parentElement)">
        <span><i class="fas fa-robot"></i> Claude Neural Link</span>
        <i class="fas fa-times" onclick="closeWin('win-claude')" style="cursor:pointer"></i>
    </div>
    <div class="win-body">
        <div id="ai-messages">
            <div class="msg ai-msg">Sistema Conectado. Por favor, asegúrate de haber configurado tu API Key en la app 'API Config'.</div>
        </div>
        <div id="status-ai"></div>
        <div class="input-area">
            <input type="text" id="ai-input" placeholder="Escribe tu mensaje a Claude..." onkeypress="if(event.key==='Enter') sendToClaude()">
            <button onclick="sendToClaude()" style="background:var(--accent); border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight:bold;">ENVIAR</button>
        </div>
    </div>
</div>

<div id="win-settings" class="window" style="height:250px; width:400px;">
    <div class="win-header" onmousedown="startDrag(event, this.parentElement)">
        <span><i class="fas fa-cog"></i> Configurar API</span>
        <i class="fas fa-times" onclick="closeWin('win-settings')" style="cursor:pointer"></i>
    </div>
    <div class="win-body">
        <p>Introduce tu Anthropic API Key:</p>
        <input type="password" id="api-key-input" placeholder="sk-ant-..." style="width:100%; padding:10px; background:#000; border:1px solid var(--accent); color:white;">
        <button onclick="saveKey()" style="margin-top:15px; width:100%; padding:10px; background:var(--accent); border:none; cursor:pointer; font-weight:bold;">GUARDAR KEY</button>
    </div>
</div>

<div id="taskbar">
    <i class="fas fa-atom" style="color:var(--accent); font-size:24px;"></i>
    <div id="clock" style="margin-left:auto; color:var(--accent); font-family:monospace;"></div>
</div>

<script>
    let zIdx = 1000;
    let ANTHROPIC_API_KEY = localStorage.getItem('claude_key') || "";

    function saveKey() {
        ANTHROPIC_API_KEY = document.getElementById('api-key-input').value;
        localStorage.setItem('claude_key', ANTHROPIC_API_KEY);
        alert("API Key guardada localmente en el sistema.");
        closeWin('win-settings');
    }

    async function sendToClaude() {
        const inputEl = document.getElementById('ai-input');
        const msgBox = document.getElementById('ai-messages');
        const status = document.getElementById('status-ai');
        const text = inputEl.value;

        if(!text || !ANTHROPIC_API_KEY) {
            alert("Escribe algo o configura tu API Key primero.");
            return;
        }

        // Mostrar mensaje del usuario
        msgBox.innerHTML += `<div class="msg user-msg">${text}</div>`;
        inputEl.value = "";
        status.innerHTML = `<span class="loading">Claude está pensando...</span>`;
        msgBox.scrollTop = msgBox.scrollHeight;

        try {
            // PETICIÓN REAL A CLAUDE (Usando el endpoint de mensajes)
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'x-api-key': ANTHROPIC_API_KEY,
                    'anthropic-version': '2023-06-01',
                    'content-type': 'application/json',
                    'dangerouslyAllowBrowser': 'true' // Esto es para demos, en prod se usa backend
                },
                body: JSON.stringify({
                    model: "claude-3-5-sonnet-20240620",
                    max_tokens: 1024,
                    messages: [{ role: "user", content: text }]
                })
            });

            const data = await response.json();
            status.innerHTML = "";
            
            if(data.content && data.content[0]) {
                msgBox.innerHTML += `<div class="msg ai-msg">${data.content[0].text}</div>`;
            } else {
                msgBox.innerHTML += `<div class="msg ai-msg" style="color:red">Error: ${data.error ? data.error.message : 'No se pudo conectar'}</div>`;
            }
        } catch (error) {
            status.innerHTML = "";
            msgBox.innerHTML += `<div class="msg ai-msg" style="color:red">Error de conexión. Revisa el CORS o tu Key.</div>`;
        }
        msgBox.scrollTop = msgBox.scrollHeight;
    }

    // Funciones de Ventana
    function openWin(id) { document.getElementById(id).style.display = 'flex'; document.getElementById(id).style.zIndex = ++zIdx; }
    function closeWin(id) { document.getElementById(id).style.display = 'none'; }

    function startDrag(e, win) {
        win.style.zIndex = ++zIdx;
        let shiftX = e.clientX - win.getBoundingClientRect().left;
        let shiftY = e.clientY - win.getBoundingClientRect().top;
        function moveAt(pageX, pageY) { win.style.left = pageX - shiftX + 'px'; win.style.top = pageY - shiftY + 'px'; }
        function onMouseMove(event) { moveAt(event.pageX, event.pageY); }
        document.addEventListener('mousemove', onMouseMove);
        document.onmouseup = () => { document.removeEventListener('mousemove', onMouseMove); document.onmouseup = null; };
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>

</body>
</html>
