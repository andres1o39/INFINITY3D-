<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFINITY 3D - CINEMA PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=JetBrains+Mono&display=swap');
        
        :root {
            --bg: #0f0f11;
            --panel: #18181b;
            --accent: #3b82f6;
            --border: #27272a;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--bg); 
            color: #e4e4e7; 
            font-family: 'Inter', sans-serif; 
            user-select: none;
        }

        .ui-panel { background: var(--panel); border: 1px solid var(--border); }
        
        /* Custom Context Menu */
        #context-menu {
            position: absolute;
            display: none;
            z-index: 1000;
            width: 180px;
            background: #18181b;
            border: 1px solid #3f3f46;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            border-radius: 6px;
            padding: 4px;
        }
        .menu-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
        .menu-item:hover { background: var(--accent); color: white; }
        .menu-sep { height: 1px; background: #3f3f46; margin: 4px 0; }

        /* Animation Keyframes */
        .key-marker {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #f59e0b;
            transform: rotate(45deg);
            top: 50%;
            margin-top: -4px;
            border: 1px solid white;
        }

        input[type="range"] { accent-color: var(--accent); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full h-12 ui-panel flex items-center justify-between px-6 z-50">
        <div class="flex items-center space-x-6">
            <h1 class="text-lg font-black tracking-tighter text-blue-500">INFINITY 3D</h1>
            <div class="h-4 w-px bg-zinc-800"></div>
            <div class="flex space-x-4 text-[11px] font-semibold text-zinc-500">
                <button onclick="spawn('box')" class="hover:text-white transition">Añadir Cubo</button>
                <button onclick="spawn('sphere')" class="hover:text-white transition">Esfera</button>
                <button onclick="spawn('light')" class="hover:text-white transition text-yellow-500">Luz de Punto</button>
            </div>
        </div>
        <div class="flex items-center space-x-4 text-[10px] font-mono text-zinc-500">
            <span id="stats-fps">FPS: 60</span>
            <span id="stats-objs">Objetos: 0</span>
        </div>
    </header>

    <!-- Context Menu -->
    <div id="context-menu" class="ui-panel">
        <div class="menu-item" onclick="spawn('box')"><span>Añadir Cubo</span><span class="opacity-40">Shift+A</span></div>
        <div class="menu-item" onclick="spawn('sphere')"><span>Añadir Esfera</span></div>
        <div class="menu-item" onclick="spawn('light')"><span>Luz Cinematográfica</span></div>
        <div class="menu-sep"></div>
        <div class="menu-item" onclick="deleteSelected()"><span>Borrar Seleccionado</span><span class="opacity-40">Del</span></div>
        <div class="menu-item" onclick="resetCamera()"><span>Resetear Cámara</span></div>
    </div>

    <!-- Inspector -->
    <aside class="fixed right-0 top-12 w-72 h-[calc(100vh-160px)] ui-panel border-l z-40 flex flex-col p-4 space-y-6 overflow-y-auto">
        <section>
            <h3 class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-4">Transformación</h3>
            <div class="grid grid-cols-3 gap-2 text-[10px] font-mono">
                <div class="bg-zinc-900 p-2 border border-zinc-800 rounded">
                    <label class="text-red-500 block mb-1">X</label>
                    <span id="pos-x">0.00</span>
                </div>
                <div class="bg-zinc-900 p-2 border border-zinc-800 rounded">
                    <label class="text-green-500 block mb-1">Y</label>
                    <span id="pos-y">0.00</span>
                </div>
                <div class="bg-zinc-900 p-2 border border-zinc-800 rounded">
                    <label class="text-blue-500 block mb-1">Z</label>
                    <span id="pos-z">0.00</span>
                </div>
            </div>
        </section>

        <section>
            <h3 class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-4">Material Cinema</h3>
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between text-[11px] mb-2"><span>Albedo Color</span></div>
                    <input type="color" id="m-color" value="#ffffff" class="w-full h-8 bg-transparent border-none cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between text-[11px] mb-2"><span>Roughness</span><span id="v-rough">0.5</span></div>
                    <input type="range" id="m-rough" min="0" max="1" step="0.01" value="0.5" class="w-full">
                </div>
                <div>
                    <div class="flex justify-between text-[11px] mb-2"><span>Metalic</span><span id="v-metal">0.0</span></div>
                    <input type="range" id="m-metal" min="0" max="1" step="0.01" value="0" class="w-full">
                </div>
            </div>
        </section>

        <section class="flex-grow">
            <h3 class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-4">Jerarquía</h3>
            <div id="outliner" class="text-[11px] space-y-1 overflow-y-auto h-40"></div>
        </section>

        <button onclick="insertKeyframe()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-bold rounded-lg shadow-lg shadow-blue-900/20 transition-all flex items-center justify-center space-x-2">
            <span class="w-2 h-2 bg-white rotate-45"></span>
            <span>INSERTAR KEYFRAME (I)</span>
        </button>
    </aside>

    <!-- Timeline -->
    <footer class="fixed bottom-0 left-0 w-full h-32 ui-panel border-t z-50 flex flex-col">
        <div class="h-10 border-b border-zinc-800 flex items-center px-6 justify-between bg-zinc-900/50">
            <div class="flex items-center space-x-6">
                <button id="play-btn" class="text-zinc-400 hover:text-white transition">
                    <svg id="play-svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="text-[11px] font-mono">
                    FRAME: <span id="cur-frame" class="text-blue-400 font-bold">0</span> / 250
                </div>
            </div>
            <button onclick="clearAnimation()" class="text-[10px] text-red-500 font-bold uppercase hover:underline">Limpiar Secuencia</button>
        </div>
        <div class="relative flex-grow bg-zinc-950 overflow-hidden" id="timeline-box">
            <div id="playhead" class="absolute top-0 left-0 w-[2px] h-full bg-blue-500 z-20 pointer-events-none">
                <div class="absolute -top-1 -left-1 w-2.5 h-2.5 bg-blue-500 rotate-45 border border-white"></div>
            </div>
            <div id="key-container" class="absolute inset-0 pointer-events-none"></div>
            <input type="range" id="timeline-slider" min="0" max="250" value="0" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-30">
        </div>
    </footer>

    <script>
        // --- INFINITY 3D ENGINE CORE ---
        let scene, camera, renderer, controls, transformControls;
        let actors = [];
        let selectedActor = null;
        let isPlaying = false;
        let frame = 0;
        const totalFrames = 250;
        
        // Data: actorUUID -> { frame: { pos, rot, sca } }
        let animData = new Map();

        function init() {
            // Escena y Niebla Cinematográfica
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0b);
            scene.fog = new THREE.Fog(0x0a0a0b, 15, 60);

            // Cámara
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(12, 8, 12);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Iluminación
            const ambient = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambient);

            const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            scene.add(hemi);

            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(10, 20, 10);
            sun.castShadow = true;
            sun.shadow.mapSize.set(2048, 2048);
            scene.add(sun);

            // Grid
            const grid = new THREE.GridHelper(40, 40, 0x222222, 0x18181b);
            scene.add(grid);

            // Controles de Cámara
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Transform Gizmo
            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            transformControls.addEventListener('dragging-changed', (e) => controls.enabled = !e.value);
            transformControls.addEventListener('change', updateTransformUI);
            scene.add(transformControls);

            // Events
            setupEvents();
            spawn('box');
            loop();
        }

        function setupEvents() {
            // Clic Derecho - Menú Contextual
            window.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const menu = document.getElementById('context-menu');
                menu.style.display = 'block';
                menu.style.left = e.pageX + 'px';
                menu.style.top = e.pageY + 'px';
            });

            window.addEventListener('click', () => {
                document.getElementById('context-menu').style.display = 'none';
            });

            // Materiales
            document.getElementById('m-color').oninput = (e) => {
                if(selectedActor && selectedActor.material) selectedActor.material.color.set(e.target.value);
            };
            document.getElementById('m-rough').oninput = (e) => {
                if(selectedActor && selectedActor.material) {
                    selectedActor.material.roughness = e.target.value;
                    document.getElementById('v-rough').innerText = e.target.value;
                }
            };
            document.getElementById('m-metal').oninput = (e) => {
                if(selectedActor && selectedActor.material) {
                    selectedActor.material.metalness = e.target.value;
                    document.getElementById('v-metal').innerText = e.target.value;
                }
            };

            // Timeline
            const slider = document.getElementById('timeline-slider');
            slider.oninput = (e) => {
                frame = parseInt(e.target.value);
                updateTimelineUI();
                applyAnim();
            };

            document.getElementById('play-btn').onclick = togglePlay;

            // Atajos
            window.onkeydown = (e) => {
                if(e.key.toLowerCase() === 'g') transformControls.setMode('translate');
                if(e.key.toLowerCase() === 'r') transformControls.setMode('rotate');
                if(e.key.toLowerCase() === 's') transformControls.setMode('scale');
                if(e.key.toLowerCase() === 'i') insertKeyframe();
                if(e.key === 'Delete') deleteSelected();
                if(e.key === ' ') { togglePlay(); e.preventDefault(); }
            };

            window.onresize = () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            };
        }

        function spawn(type) {
            let mesh;
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });

            if(type === 'box') mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), mat);
            else if(type === 'sphere') mesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), mat);
            else if(type === 'light') {
                mesh = new THREE.PointLight(0xffaa00, 2, 20);
                mesh.add(new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({color: 0xffaa00})));
            }

            mesh.position.set(Math.random()*4-2, 1, Math.random()*4-2);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.name = `${type.toUpperCase()}_${actors.length + 1}`;
            
            scene.add(mesh);
            actors.push(mesh);
            select(mesh);
            updateOutliner();
            document.getElementById('stats-objs').innerText = `Objetos: ${actors.length}`;
        }

        function select(obj) {
            selectedActor = obj;
            transformControls.attach(obj);
            if(obj.material) {
                document.getElementById('m-color').value = '#' + obj.material.color.getHexString();
                document.getElementById('m-rough').value = obj.material.roughness;
                document.getElementById('m-metal').value = obj.material.metalness;
                document.getElementById('v-rough').innerText = obj.material.roughness;
                document.getElementById('v-metal').innerText = obj.material.metalness;
            }
            updateOutliner();
            renderKeys();
        }

        function updateTransformUI() {
            if(!selectedActor) return;
            document.getElementById('pos-x').innerText = selectedActor.position.x.toFixed(2);
            document.getElementById('pos-y').innerText = selectedActor.position.y.toFixed(2);
            document.getElementById('pos-z').innerText = selectedActor.position.z.toFixed(2);
        }

        function updateOutliner() {
            const container = document.getElementById('outliner');
            container.innerHTML = '';
            actors.forEach(a => {
                const el = document.createElement('div');
                el.className = `p-2 rounded cursor-pointer ${selectedActor === a ? 'bg-blue-600/20 text-blue-400' : 'hover:bg-zinc-800'}`;
                el.innerText = a.name;
                el.onclick = () => select(a);
                container.appendChild(el);
            });
        }

        function deleteSelected() {
            if(!selectedActor) return;
            scene.remove(selectedActor);
            actors = actors.filter(a => a !== selectedActor);
            animData.delete(selectedActor.uuid);
            transformControls.detach();
            selectedActor = null;
            updateOutliner();
            document.getElementById('stats-objs').innerText = `Objetos: ${actors.length}`;
        }

        function resetCamera() {
            controls.reset();
            camera.position.set(12, 8, 12);
        }

        function insertKeyframe() {
            if(!selectedActor) return;
            const id = selectedActor.uuid;
            if(!animData.has(id)) animData.set(id, {});
            
            const frames = animData.get(id);
            frames[frame] = {
                p: selectedActor.position.clone(),
                r: selectedActor.rotation.clone(),
                s: selectedActor.scale.clone()
            };
            renderKeys();
        }

        function renderKeys() {
            const container = document.getElementById('key-container');
            container.innerHTML = '';
            if(!selectedActor || !animData.has(selectedActor.uuid)) return;

            const frames = animData.get(selectedActor.uuid);
            Object.keys(frames).forEach(f => {
                const dot = document.createElement('div');
                dot.className = 'key-marker';
                dot.style.left = `${(f / totalFrames) * 100}%`;
                container.appendChild(dot);
            });
        }

        function applyAnim() {
            actors.forEach(a => {
                const data = animData.get(a.uuid);
                if(!data) return;

                const sorted = Object.keys(data).map(Number).sort((a,b)=>a-b);
                if(sorted.length === 0) return;

                if(data[frame]) {
                    a.position.copy(data[frame].p);
                    a.rotation.copy(data[frame].r);
                    a.scale.copy(data[frame].s);
                    return;
                }

                let prev = null, next = null;
                for(let f of sorted) {
                    if(f < frame) prev = f;
                    if(f > frame && next === null) next = f;
                }

                if(prev !== null && next !== null) {
                    const t = (frame - prev) / (next - prev);
                    // Smooth lerp
                    const smoothT = t * t * (3 - 2 * t);
                    a.position.lerpVectors(data[prev].p, data[next].p, smoothT);
                    a.scale.lerpVectors(data[prev].s, data[next].s, smoothT);
                    
                    const q1 = new THREE.Quaternion().setFromEuler(data[prev].r);
                    const q2 = new THREE.Quaternion().setFromEuler(data[next].r);
                    a.quaternion.slerpQuaternions(q1, q2, smoothT);
                } else if(prev !== null) {
                    a.position.copy(data[prev].p);
                    a.rotation.copy(data[prev].r);
                    a.scale.copy(data[prev].s);
                }
            });
        }

        function updateTimelineUI() {
            document.getElementById('cur-frame').innerText = frame;
            document.getElementById('timeline-slider').value = frame;
            document.getElementById('playhead').style.left = `${(frame / totalFrames) * 100}%`;
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('play-svg').innerHTML = isPlaying ? 
                '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : 
                '<path d="M8 5v14l11-7z"/>';
        }

        function clearAnimation() {
            if(selectedActor) animData.delete(selectedActor.uuid);
            renderKeys();
        }

        function loop() {
            requestAnimationFrame(loop);
            if(isPlaying) {
                frame++;
                if(frame > totalFrames) frame = 0;
                updateTimelineUI();
                applyAnim();
            }
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
